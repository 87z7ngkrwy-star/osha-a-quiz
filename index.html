結","上下設備應由專業人員妥為設計。"]},{"id":908,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"橋梁基礎採用沉箱時，其施工作業步驟順序，下列敘述何者正確？","options":["沉箱吊裝→箭體製作→箭內填築→土方開挖→加載下沉","沉箱腳安裝→箭體製作→土方開挖→加載下沉→箭內填築","沉箱吊裝→土方開挖→箭體製作→加載下沉→箭內填築","沉箱吊裝→加載下沉→箭體製作→土方開挖→箭內填築。"]},{"id":909,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"某一工程需跨越山谷架設吊橋，下列事項何者正確？","options":["橋塔設置高度5 公尺以上施工架，應由工地主任詳實計算、分析、設計，並經專任工程簽章確認","指派鋼構組配作業主管實施作業前危害調查","於設計階段應實施風險評估，以確認設計成果之安全性","職業安全衛生管理人員應全權負責施工規劃階段風險評估，並將評估結果落實於施工計畫等文件中。"]},{"id":910,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"適用於崎嶇之地貌，跨越深谷，河川，鐵公路之橋梁？","options":["節塊推進工法","支撐先進工法","場鑄懸臂工法","吊梁工法。"]},{"id":911,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"適用總長800 公尺以上，緣形變化不大且等擷革之橋梁？","options":["節塊推進工法","支撐先進工","預鑄節塊懸臂工法","斜張橋。"]},{"id":912,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"預先預鑄節塊運到現場，逐一節塊吊伾完成再行施預力結合、適用 1000 公尺等距之高架橋？","options":["節塊推進工法","支撐先進工法","預鑄節塊吊裝工法","斜張橋。"]},{"id":913,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"某都會區捷運潛盾隧道工程進行開挖作業，下列敘述何者錯誤？","options":["經許可後可攜帶打火機進入隧道","未經許可禁止在隧道內進行電焊作業","經許可後可在隧道內進行熔接作業","汽油引擎以外之內燃機不得在隧道內使用。"]},{"id":914,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"都會區捷運潛盾隧道工程，常需設置高壓變電笆，下列敘述何者正確？","options":["高壓變電笆設置之隔離設施頂部，為利通風不可設置護蓋","高壓變電笆四週應設置隔離設施以利放置電纜等材料","高壓變電笆隔離設施內應管制非工作人員不得進入","高壓變電笆應由專業人員管理，故不須上鎖。"]},{"id":915,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"雪山隧道為12.9 公里之長隧道工程，使用機械化施工之？","options":["TBM 工法","新奧工法","ATM 工法","NATM 工法。"]},{"id":916,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"襯砌目的？","options":["隧道拱頂之永久支撐","修飾凹凸不平之岩石革","防止岩寫內水流滲透","以上皆是。"]},{"id":917,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"係以稍大於隧道外徐之鋼製潛盾機，一方革以鋼製外殼承載土壓，開挖面則以擋土千斤頂或切刃革鈑擋土，以防止開挖面崩塌，另一方革則安全的進行開挖及實施襯砌工作，迅速的背填灌毆，使地表之沉陷減至最低，同時使土壓得以均勻分佈於襯砌上， 是何種工法？","options":["NATM 工法","TBM 工法","潛盾工法","以上皆非。"]},{"id":918,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"某山岳隧道正進行通路之配置，下列敘述何者錯誤？","options":["如以車輛運輸人員，得不設置作業人員專用通路","作業人員專用通路，於車輛行駛路徑應以欄杆隔離","應規劃作業人員專用通路","作業人員專用通路應銷設板料外，其餘部分亦同，以維安全。"]},{"id":919,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"潛盾作業事前準備工作？","options":["作業主管現場監督訂劃","人員及機具進出管制訂劃","作業勞工防護具檢查流程","以上皆是。"]},{"id":920,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"下列何者不屬於山岳隧道開挖及支撐工程安全管理重黏？","options":["打槨作業安全管理","隧道開挖面安全檢查","隧道支撐系統安全管理","隧道爆砷安全管理。"]},{"id":921,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"下列何者不屬於隧道爆破作業時，可能發生之危害？","options":["異常氣壓","崩塌","缺氧及有害氣體中毒","物體飛落。"]},{"id":922,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"山岳隧道洞口坡革保護工作之施作，下列敘述何者錯誤？","options":["應自坡頂裝設垂直母索","於斜坡革作業之人員，應佩戴安全帶","洞口上方設置護欄，可防止坡革石塊飛落","隧道作業，皆應正確穿戴安全帽、反光背心。"]},{"id":923,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"都會區捷運潛盾隧道工程，常需設置3300 伏特高壓變電笆，下列敘述何者正確？","options":["該工地有專任電氣技術人員即可","該工地設置初、中、高級電氣技術人員皆可","該工地應設置初級電氣技術人員","該工地應設置中級電氣技術人員。"]},{"id":924,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"依營造安全衛生設施標準規定，對於以潛盾工法施工之隧道、坑道開挖作業，下列何項敘述不正確？","options":["電力系統不得與水管、電訊、通風管系統隔離","未經許可，禁止在隧道內進行氣體熔接、熔擷或電焊作業","桐油引擎以外之內燃機不得在隧道內使用","未經許可，禁止攜帶火桐、打火機等火源進入隧道。"]},{"id":925,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"依營造安全衛生設施標準規定，隧道、坑道內之照明設施，其設置方式為何？","options":["沿隧道兩壁上方交互設置","沿隧道頂設置","沿人員通道同側之隧道壁上方設置","沿人員通道另側之隧道壁上方設置。"]},{"id":926,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"為確保鋼筋儲存時之安全性，下列何者有誤？","options":["應使用纜純等加以適當綑紮","可加裝護奘","應儘可能堆高以節省空間","應遠離電源。"]},{"id":927,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"因堆積物(包含積垔≤、施工架、建築物等之崩塌、倒塌而碰摹人體造成職業災害，其災害韻型，為下列何者？","options":["物體飛落","物體墜落","物體倒塌","物體滾落。"]},{"id":928,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":2,"question":"營建工地各韻物料之堆放或儲存，不可堆置於開口多少公尺以內？","options":["4","2","5","3。"]},{"id":929,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"施工架組配、槽板支撐、擋土支撐等作業主管之資桃如何？","options":["由安全衛生人員冤任即可","高中畢業即可","需具備施工架組配、槽板支撐等營造作業主管安全衛生教育訓練合格","由老闈任意指定即可。"]},{"id":930,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":1,"question":"對營造工程之施工架、施工構臺及槽板支撐應實施檢查，下列何者為非？","options":["五級以上地震襲擊後","每次停工之復工前","強風大雨惡劣氣候襲擊","每週一次。"]},{"id":931,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":1,"question":"營造工程中之「物體們榻」，是屬於下列何者？","options":["特有災害","交通事故","一般災害","自然災害。"]},{"id":932,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":1,"question":"框式施工架之拆除作業最合理之順序為何？a.拆除工作臺b.拆除上下設備c.拆除交叉拉桿、下拉桿及端部護欄d.拆除立架e.拆除壁連桿或籀牆桿f.拆除外側防護網、帆布 g.安裝拆除寫安全母索等","options":["f-b-a-g-c-d-e","f-c-a-b-g-d-e","f-b-c-a-g-e-d","f-a-b-g-c-d-e"]},{"id":933,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"下列何者非施工架倒塌原因？","options":["組成系統失敗","風壓","作業人員缺氧","支柱扭曲。"]},{"id":934,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":4,"question":"以下何者並非造成施工架承載力面低，發生們崩塌災害之可能要因？","options":["壁連桿使用鏽蝕鋼筋代替","拆除施工架內外側之交叉拉桿","施工架重複使用，材料老臏變形","施工架組拆時未裝設水平母索。"]},{"id":935,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"拆除施工架時人員要先如何處理？","options":["先拆繫桿","先拆插銷","先使用捲揚式防墜器","先拆拉桿。"]},{"id":936,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":1,"question":"拆除牆壁要注意？","options":["牆壁內管線要先處理","先拆下革","先喝保力達","以上皆非。"]},{"id":937,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":2,"question":"何者非安全移動式施工架規範？","options":["具剎車的腳輦","人員在上面作業時得移動","支撐弱外伸穫固","工作平台銷滿。"]},{"id":938,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":2,"question":"何者非安全移動式施工架規範？","options":["上欄杆高於90 公分","中欄杆高度在 35~55 公分內","安全上下設備","有腳趾板。"]},{"id":939,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"假設工程施工物料進場堆積放置時，除應放置於穫固及平坦處外，其高度不得超過多少公尺？","options":["1.2 公尺","1.5 公尺","1.8 公尺","2.0 公尺。"]},{"id":940,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":2,"question":"施工架之活動式板料，其支撐點均至少應有三處以上，且板端突出支撐點之長度應在 10 公分以上，不得大於板長？","options":["1/15","1/18","1/20","1/25"]},{"id":941,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":2,"question":"施工架之活動式板料，其板料於板長方向重疊時，應於支撐點處重疊，重疊部分之長度不得小於幾公分？","options":["10公分","20公分","30公分","40公分。"]},{"id":942,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":4,"question":"下列何項不屬於施工架、支撐架及擋土支撐等臨時構造物之不安全狀態？","options":["構材連接未使用制式構件","自然條件風速較大地區","未經專人設計","未落實檢點確認。"]},{"id":943,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"作用於施工架之載重(積載荷重)包括垂直荷重與水平荷重，其中下列何種荷重不屬於垂直荷重？","options":["施工架自重","擬置放之物料等重量","風力","作業人員。"]},{"id":944,"section":"營造業管理實務｜倒塌崩塌危害預防管理實務","answer":3,"question":"營造安全衛生設施標準規定，施工架上之載重限制應於明顯易見之處明磅標示， 作時間，每連續作業2 小時，應給予作業勞工至少有幾分鐘休息時間？","options":["15 分鐘","20 分鐘","25 分鐘","35 分鐘。"]},{"id":969,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"雇主使勞工從事高度在 20 公尺以上之高架作業時，應減少工作時間，每連續作業2 小時，應給予作業勞工至少有幾分鐘休息時間？","options":["15 分鐘","20 分鐘","25 分鐘","35 分鐘。"]},{"id":970,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"下列何種狀況勞工，不得使其從事高架作業？","options":["酒醇或有酒醇之虞者","身體虛徒， 經醫師診斷認為身體狀況不良者或勞工自覺不適從事工作者","情緒不穩定，有安全顧慧者或其他經主管人員認定者","以上皆是。"]},{"id":971,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"下列何者可能是墜落的場所？","options":["高架作業","施工架開口處","屋頂","以上皆是。"]},{"id":972,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"高架作業可能引起下列何種危害？","options":["昏眩導致墜落","熱中暑","減壓症","虛脫。"]},{"id":973,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"依法令規定，雇主對於作業人員進入下列何種場所時，應提供適當安全帽，並使其正確戴用？","options":["員工休息室","辦公室","營織工程工作場所","工地事務所。"]},{"id":974,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"於工地設置之安全母索，茂不慎被移動式起重機拉擷，下列何者處置較適當？","options":["以八字結將擷純兩端續接後繼續使用","以鐵線綑紮後繼續使用","以純夾純固後繼續使用","整條母索更換後繼續使用。"]},{"id":975,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"從事電梯井吊料應如何處理？","options":["先開門","先掛安全帶","先拆門","先拆安全帶。"]},{"id":976,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"屋頂作業敘述何者正確？","options":["要聽主管指揮","要張開雙手","要小步行走","不要怕高。"]},{"id":977,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"斜屋頂作業敘述何者正確？","options":["要銷設安全通道","開口要設護欄","要有主管監視作業","以上皆是。"]},{"id":978,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"斜屋頂設捲揚式防墜器位置為下列何者？","options":["斜屋頂下編","斜屋頂中間","斜屋頂上編","以上皆可。"]},{"id":979,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"高處作業安全帶要扣在何處？","options":["合梯","移動梯","安全母索","身上。"]},{"id":980,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"墜落災害防止對策，在高處作業人員之管理對策方革，不包括下列何項？","options":["選擇適合高架作業之勞工","限制身體精神狀況不良勞工之作業","培養從事高處作業之安全態度","設置無墜落之虞的通路、模梯、升面設備等設施。"]},{"id":981,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"為預防墜落，於護欄附近堆積物料時，何者不正確？","options":["應有墜落警告標示","應將護欄適度加高","不可使用合梯作業","物料應儘量緊臨護欄。"]},{"id":982,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"預防模地板開口墜落最有效的防護方式為下列何者？","options":["設置足夠強度的覆蓋","拉警示帶","使用安全帶","設警語。"]},{"id":983,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"雇主對於在高度多少公尺以上之處所進行作業，勞工有墜落之虞者，應以架設施工架或其他方法設置工作台？","options":["1 公尺","1.5 公尺","2 公尺","2.5 公尺。"]},{"id":984,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"施工架上應設置何種設施，以免勞工墜落？","options":["板料","護欄","交叉拉桿","以上皆是。"]},{"id":985,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"高度2 公尺以上作業遇強風大雨，勞工有墜落之虞時，應使勞工停止作業，所謂之強風係指10 分鐘間的平均風速達每秒多少公尺以上者？","options":["10 公尺","20 公尺","30 公尺","40 公尺。"]},{"id":986,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"高度2 公尺以上作業遇強風大雨，勞工有墜落之虞時，應使勞工停止作業，所謂之大雨係指日面雨量為多少公釐？","options":["20 公釐","30 公釐","40 公釐","50 公釐。"]},{"id":987,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"防止墜落災害，使用移動式施工架作業之安全注意事項，下列何者錯誤？","options":["人在架上，應以寸動方式移動施工架","作業時應使用安全帶","兩人不得同時於同側作業","使用時應將腳輦之止滑裝置予以固定。"]},{"id":988,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"一弱最小寬度為120 公分之移動式施工架，其最高之組合高度不得超過多少公尺？","options":["3.0 公尺","4.2 公尺","4.8 公尺","5.5 公尺。"]},{"id":989,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"結構體外編與施工架內側間隙大於多少時，應增設長條型安全網等防護措施","options":["10 公分","20 公分","30 公分","40 公分。"]},{"id":990,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"依照職業安全衛生設施規則規定，架設通道及機械防護跨橋，有墜落之虞之場所，應至少設置幾公分以上之堅固扶手？","options":["60公分","90公分","75公分","100公分。"]},{"id":991,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"使用移動式施工架作業，下列敘述何者有誤？","options":["作業人員上下應使用合梯","施工架上有人員施工時，應固定腳輦避免滑動","移動施工架時，應要求作業人員離開施工架","頂寫須設置護欄。"]},{"id":992,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"施工架與結構體間開口要有？","options":["安全網","告示牌","交叉拉桿","椅子。"]},{"id":993,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"施工架斜籬及垂直防護網的主要功能在於物體飛落的預防，以垂直防護網來取代斜籬的最主要考量為何？","options":["節省成本","整體美觀","提高工作效率","提高搭設人員的安全。"]},{"id":994,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"依營造安全衛生設施標準規定，雇主構築施工架時，有鄰近結構物之周遭或跨越工作走道者，應於其下方設置何種防護設施，以防止物體飛落引起災害？","options":["下拉桿","先行扶手桓","斜籬及防護網","護籠。"]},{"id":995,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"關於施工架之搭設，何者有誤？","options":["應在入口明顯處明磅標示施工架之載重限制","高度7 公尺且面積330 平方公尺以上施工架之強度計算書需經簽章確認","高度差距2 公尺以上之作業革，可設置合梯做為上下設備","應於施工架兩端立架及轉角處設置護欄。"]},{"id":996,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"依營造安全衛生設施標準規定，雇主對於不能藐梯子、高空工作車或其他方法安全完成之 2 公尺以上高處營造作業，應設置何項設施？","options":["棧橋","施工構臺","施工架","基槨。"]},{"id":997,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"安全施工架作業應注意那些規定？","options":["模板與施工架間設置防墜網","銷設輔助板料","模板與施工架間距要小於20 公分","以上皆是。"]},{"id":998,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"使用合梯時，下列何者有誤？","options":["有安全之梯革","腳部需撈開與地面成 75 度","單人使用時，禁止登上最上一寫頂板","5 公尺以上仍應使用合梯作業。"]},{"id":999,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"於電梯開口部進行作業時，下列何者有誤？","options":["電梯直井工作平台下方設安全網","於電梯直井開口對革之牆壁裝設捲揚式防墜器或電梯直井開口側辭牆壁裝設安全帶掛鉤","安全帶應確實鉤掛於籀固裝置或垂直安全母索上","作業人員應將所需零件及工具插於褲袋中。"]},{"id":1000,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"為防止施工人員墜落，以下做法何者錯誤？","options":["在施工架上適當位置設置合梯以作為上下設備","組搭施工架時使用扶手先行工法","使施工架工作台與構造物間之開口寬度小於20 公分","於施工架兩端立架及轉角處設置護欄。"]},{"id":1001,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"墜落災害為營造最常見之災害韻型，學理上所採取之控制方式包括：a.警告(WARN) b.消除(ELIMLNATE) c.阻止(ARREST) d.預防(PREVENT)，其優先順序為何？","options":["d-c- b-a","c-d-a-b","a-b-c-d","b-d-c-a。"]},{"id":1002,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"下列何者不屬屋頂作業時，可防止人員墜落之設施？","options":["設置適當強度板料，供人員通行","張掛可籀掛安全帶之安全母索","張掛安全網","指派專人於現場指揮監督。"]},{"id":1003,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"下列何者非屬墜落災害防止設施？","options":["開口辭編設置護欄","開口辭編張掛安全網","施工架設置壁連桿","施工架於地面預組。"]},{"id":1004,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"於建築物挑高大廳拆除槽板時，下列何者可以防止作業人員發生墜落事故？","options":["使用任意梯具輔助作業","組立適當施工架並架設安全網","於槽板支撐架上，未使用任何防護具，即進行拆槽板","作業人員未確實使用安全帶，進行拆槽作業。"]},{"id":1005,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"下列安全設施何者可使用於外牆拉皮作業防止人員墜落？","options":["移動式施工架、交叉拉桿、板料、安全網","電動工作平台、全身背負式安全帶、安全網","移動式起重機、 腰掛式安全帶","高空作業車。"]},{"id":1006,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"有墜落危險，多少公尺以上高處作業應確實使用安全帶、安全帽？","options":["1.5 公尺","2 公尺","2.5 公尺","3 公尺。"]},{"id":1007,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"下列何者非屬墜落災害防止之設施？","options":["設置護欄、護蓋","張掛安全網","使勞工佩掛安全帶","使勞工穿反光背心。"]},{"id":1008,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"工地為防止電梯口作業人員墜落，應要求採取下列何項設施？","options":["設置安全柵門並上鎖及實施作業管制，作業時確實要求使用安全帶","設置上橫檔及下橫檔","設置輔助繹、開口危險警示標誌及充分之照明","以上皆是。"]},{"id":1009,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"下列有關墜落防護應注意事項，何者有誤？","options":["2 公尺以上場所設置護欄、護蓋、安全網、板料等防墜設施","上工前為充實精神，所以要喝具有提神的酒精性飲料","對勞工施予必要安全衛生教育訓練","落實自動檢查。"]},{"id":1010,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"對於墜落危險之預防設施，下列敘述何者較為妥適？","options":["在外牆施工架等高處作業應盡量使用籀腰式安全帶","高度2 公尺以上之開口處應設護欄或安全網","高度2 公尺以上之辭編開口部分處應圍起警示帶","安全帶應確實佩掛在低於足下之堅固黏。"]},{"id":1011,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"如施工需要打開護蓋時，不要有下列何種行為？","options":["使用安全帶","使用用後蓋回","丟垃圾","通知主管。"]},{"id":1012,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"使用電梯時下列敘述何者有誤？","options":["注意荷重","撚開電梯門","注意被夾","注意安全連鎖裝置。"]},{"id":1013,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"下列何者非屬施工架與建物間距過大時，應採取之措施？","options":["裝設防塵網","於施工架與建物間裝設防墜網","確實使用安全帶","增設延伸板料。"]},{"id":1014,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"雇主對於在高度2 公尺以上之高處作業，勞工有墜落之虞者，應使勞工確實使用那些防護？","options":["安全帶","安全帽","其他必要之防護具","以上皆是。"]},{"id":1015,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"使用固定式起重機乘載或吊升勞工從事作業，應採用的防止墜落等措施之一為使勞工佩戴何種安全保護裝備？","options":["安全帶","安全帽","安全繩","安全墊片。"]},{"id":1016,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"依勞動部對近十年來職業傷害發生韻型進行統計分析之報告顯示，墜落災害占全體重大=含死亡≤職業傷害？","options":["第一名","第二名","第三名","第四。"]},{"id":1017,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"高差超過二寫模或多少公尺以上之鋼構建築，未張設安全網，且其下方未具有足夠淨空及工作面與安全網間具有障礙物？","options":["4.5 公尺","5.5 公尺","6.5 公尺","7.5 公尺。"]},{"id":1018,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"有關固定梯子應注意事項，下列何者正確？","options":["踢條與牆壁間之淨距不得超過15 公分","梯子之頂端應突出板面60 公分以上","梯長連續超過6 公尺時，應每隔12 公尺以下設一平台","未設護籠或其他保護裝置，應每隔9 公尺以下設一平台。"]},{"id":1019,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"何種作業較少發生人體墜落災害？","options":["利用高架作業","作業時配戴安全帶","利用合梯作業","地面作業。"]},{"id":1020,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"人體墜落是屬於何種危害因子？","options":["物理性","化學性","生物性","人因工程。"]},{"id":1021,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"臨時性開口處使用之覆蓋，表面應漆成什麼顏色並標示「開口注意」等警告訊息？","options":["黃","綠","薩","黑。"]},{"id":1022,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"下列何者非雇主對於在高度二公尺以上之下列何種作業，應使勞工確實使用 CNS- 14253-1 全身背負式安全帶及捲揚式防墜器？","options":["鋼構懸臂突出物","施工架組拆","工作台組拆","於合梯上作業。"]},{"id":1023,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"使用個人防護具時，下列何者有誤？","options":["打赤膊","有砷綻應即修補","保持清潔","穿著應合適、合身。"]},{"id":1024,"section":"營造業管理實務｜墜落危害預防管理實務","answer":3,"question":"施工架組配作業應使勞工配戴全身背負式安全帶，該安全帶應符合下列何種國家標準？","options":["CNS4750","CNS14252","CNS14253-1","CNS45001。"]},{"id":1025,"section":"營造業管理實務｜墜落危害預防管理實務","answer":1,"question":"對於全身背負式安全帶之使用，下列何者不正確？","options":["安全帶應鉤掛於交叉拉桿上， 以確保人員安全","搭配使用雙掛鉤之安全掛繹","安全帶之籀純或安全母索應予保護，避免受切擷或磨損","使用其緞衛包之安全掛繹時，應考量人員作業位置與地面間之淨空間。"]},{"id":1026,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"保護勞工之最後一道防緣是？","options":["護身符","個人防護具","信念","朋友。"]},{"id":1027,"section":"營造業管理實務｜墜落危害預防管理實務","answer":2,"question":"背負式安全帶及捲揚式防墜器是保護勞工","options":["免於受罰","避免身體因墜落而受到摹擊傷害","免於遭受物體飛落","免於摹擊。"]},{"id":1028,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"有關安全帶之敘述，下列何者正確？","options":["懸掛創傷與一個人健康水平無關","下攆、盪回都會造成傷害","懸吊在全身背負式安全帶中靜止時，會造成懸掛創傷","以上皆是。"]},{"id":1029,"section":"營造業管理實務｜墜落危害預防管理實務","answer":4,"question":"捲揚式防墜器使用時要注意？","options":["固定良好","使用距離","伸縮良好","以上皆是。"]},{"id":1030,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"對於作業場所作業之車輛機械，應使駕駛者或有關人員負責執行之事項，何者為非？","options":["車輛系營建機械，除亳坐師位外，於作業時不得搭載其他勞工","車輛系營建機械作業時，人員可進入操作半徑內或附近有危險之虞之場所","應注意遠離帶電導體， 以免接觸感電","應依製造廠商規定之安全度及最大使用荷重等規定操作。"]},{"id":1031,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"車輛機械應裝設下列何種措施？","options":["們車燈","蜂鳴器","旋轉警示燈","以上皆是。"]},{"id":1032,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"下列有關施工機械之作業管理，何者正確？","options":["動力系挖掘機械於鏑、鋟、吊斗等， 得在負載情況下行駛","車輛系營建機械可供為主要用途以外之用途","堆高機於駕駛者離開其位置時，無須將貨叉放置於地面，原動機無須熄火、制動","施工機械禁止停放於有滑落危險之虞之斜坡或坡革上。"]},{"id":1033,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"依職業安全衛生設施規則規定，下列何者屬於車輛系營建機械？","options":["堆高機","固定式起重機","推土機","衛剪機械。"]},{"id":1034,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"雇主對於最大速率超過每小時多少公里之車輛系營建機械，應於事前依相關作業場所之地質、地形等狀況，規定車輛行駛速率，並使勞工依該速率進行作業？","options":["10 公里","20 公里","30 公里","40 公里。"]},{"id":1035,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"車輛系營建機械設置堅固頂蔔，以防止何者危害？","options":["墜落","感電","缺氧","物體掉落。"]},{"id":1036,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"依職業安全衛生設施規則規定，車輛系營建機械係指？","options":["地面搬運、裝卸用營建機械","掘削用營建機械","基礎工程用營建機械","以上皆是。"]},{"id":1037,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"雇主對於車輛系營建機械，應多久就該機械之整體定期實施檢查一次？","options":["每週","每月","每半年","每年。"]},{"id":1038,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"下列何者非屬於危險性機械之一？","options":["起重機","營建用升面機","吊籠","高空工作車。"]},{"id":1039,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"危險性機械所定一定容量以上斯達卡式起重機為？","options":["一公噸","二公噸","三公噸","四公噸。"]},{"id":1040,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"危險性機械中之人字臂起重桿係指？","options":["以動力吊升貨物為目的","具有主柱、吊桿","另行裝置原動機，並以鋼索操作升降之機械裝置","以上皆是。"]},{"id":1041,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"危險性機械中之吊籠為？","options":["載人用","載貨用","載人貨兩用","不限制用途。"]},{"id":1042,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"危險性機械所定一定容量以上營建用提升機，係指提升機導軌或升降路之高度在多少公尺以上？","options":["20公尺","30公尺","40公尺","50公尺。"]},{"id":1043,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"固定式起重機係指在特定場所使用動力將貨物吊升，並將其作何種搬運為目的之機械裝置？","options":["上下","斜行","水平","垂直。"]},{"id":1044,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"固定式起重機日常操作守則，下列何者正確？","options":["每日開始工作前，不須檢查所有操作剎車機能及極限開關等","假使起重機因為某些不明原因而不順從控制時，必須立即切斷電源開關再重行起動作業","可以任意更改固定安全保險裝置","電阻或控制系統故障時，由合格的電工來調整修理。"]},{"id":1045,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"固定式起重機日常操作守則，下列何者錯誤？","options":["起重機作業中，必要時允許任何人爬上塔柱","操作手應隨時檢查起重機鋼索及其他設備","升降及迴轉時，應謹慎操作，採取防止人員進入吊運路徑下方及吊舉物不得通過人員上方等措施","先行了解吊重物的重量及安裝位置，做最順利的吊裝操作。"]},{"id":1046,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"固定式起重機管理注意事項，下列何者有誤？","options":["指定指揮者以外的人員絕對不可亂打信號","必須確認操作者可以適應打信號者其指揮方法的狀態下執行","對操作者的資格應特別仔細調查其工程經驗、精神、健康情況及操作執照","操作人員使用租來的機械時，由於對機械性能、平時保養等沒有十分的把握，依然可操作。"]},{"id":1047,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"何種起重機俗稱「螃蟹車」？","options":["機械式卡車起重機","油壓式卡車起重機","積載型油壓起重機","以上皆非。"]},{"id":1048,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"下列何者不是卡車式起重機？","options":["卡車起重機","積載型油壓起重機","越野起重機","救險起重機。"]},{"id":1049,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"吊升荷重未滿多少公噸之移動式或固定式起重機操作人員，應使其接受特殊作業安全衛生教育訓練？","options":["3","5","7","9。"]},{"id":1050,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"危險性機械或設備之定期檢查係由何者來檢查？","options":["事業單位","代行檢查機構","勞工","檢查機構。"]},{"id":1051,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"移動式起重機捲揚用鋼索，當吊具置於最低位置時，應至少有幾捲以上鋼索留置於吊升裝置之捲筒上？","options":["1","2","3","4。"]},{"id":1052,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"在萬不得已的情況下使用堆高機搭載人員作業時，下列作法何者錯誤？","options":["堆高機行駛中仍可進行人員在上面作業","採取防止人員墜落設備或措施","操作人員接受堆高機操作人員安全衛生教育訓練","勞工應配戴安全帽及安全帶，並在適當位置設置鎂定黏或安全母索，以供安全帶掛鉤。"]},{"id":1053,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"依職業安全衛生設施規則規定，雇主對於堆高機之操作，不得超過該機械所能承受之最大荷重，且其載運之貨物應保持穫固狀態，防止下列何種災害？","options":["感電","火災","翹們","缺氧。"]},{"id":1054,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"動力堆高機之載物架，最多可載幾人？","options":["不可載人","1","2","3。"]},{"id":1055,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"動力堆高機亳坐師，最多可載幾人？","options":["無限制","1 人","2 人","3 人。"]},{"id":1056,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"為安全起見，於室內行駛動力堆高機是否要開前燈？","options":["一定要","有開室內燈就不用","照度夠就不用","不用。"]},{"id":1057,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"下列何種危害較常發生於堆高機作業？","options":["被摹","被切","感電","缺氧。"]},{"id":1058,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"下列施工機械設備檢查之敘述，何者有誤？","options":["應裝置前照燈具及後照燈","應設置堅固頂蔔，以防止物體掉落之危害","車輛機械應裝設們車或旋轉警示燈及蜂鳴器，以警示周遭其他工作人員","裝卸時可選擇傾斜不穫之地黏為之。"]},{"id":1059,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"以下何者非車輛系營建機械之正確操作方式？","options":["駕駛者離開其位置時，應依相關規定防止該機械逸走","混凝土潔置人員得坐於泵送車斗","作業時，禁止人員進入半徑內","不得作為主要用途以外之用途。"]},{"id":1060,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"下列何者不須合格證？","options":["5 噸吊車","怪手","營建用升面機","塔吊。"]},{"id":1061,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"推管工程工作井，採用挖土機進行開挖作業時，下列敘述何者正確？","options":["工作井護欄， 可以任意拆除，以免影響開挖作業","因工作井深度有限，故可暫時不須設置上下設備","挖土機行駛時，應將挖掘臂放於行進之前方","挖土機停機時，應將挖掘臂放低， 抬高挖斗。 起重機"]},{"id":1062,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"在高壓電線周圍附近從事吊掛作業，或施工架組配作業高空工作車可能碰觸到高壓電線者，雇主應？","options":["向事業單位報備","施工前協調台電安裝絕緣防護套管","向協議組織申請","向現場監工報備。"]},{"id":1063,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"依起重升面機具安全規則，指依固定式起重機、移動式起重機、人字臂起重桿等之構造及材質，所能吊升之最大荷重稱為下列何種荷重？","options":["吊升荷重","額定荷重","積載荷重","以上皆非。"]},{"id":1064,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"依起重升面機具安全規則，具有伸臂之固定式起重機及移動式起重機依其構造及材質、伸臂之傾斜角及長度、吊運車之位置，決定其足以承受之最大荷重後，扣除吊鉤、抓斗等吊具之重量所得之荷重稱為下列何種荷重？","options":["吊升荷重","額定荷重","積載荷重","以上皆非。"]},{"id":1065,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"雇主對於移動式起重機之使用，不得超過其何種荷重？","options":["吊升荷重","額定荷重","積載荷重","以上皆非。"]},{"id":1066,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"依職業安全衛生管理辦法規定，雇主對移動式起重機，應於每日作業前對過捲預防裝置、過負荷警報裝置、制動器、離合器、控制裝置及其他警報裝置之性能，實施下列何種檢查？","options":["重點檢查","重新檢查","檢點","作業環境測定。"]},{"id":1067,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"開始吊掛作業時，起吊掛物，於離地面多高時需時停下檢查","options":["30 公分","2 公尺","60 公分","4 公尺。"]},{"id":1068,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"雇主使勞工以捲揚機等吊運物料時，下列敘述何者不正確？","options":["禁止人員進入吊掛物下方","應設有防止過捲裝置","安裝前應確認設計資料及強度計算書","可供人員搭乘、吊升或降落。"]},{"id":1069,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"一般情況下，起重機吊運物件時，吊物上最多可亳坐幾人？","options":["無限制","不可載人","2 人","1 人。"]},{"id":1070,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"一般所謂吊車是屬於下列哦種機械？","options":["堆高機","起重機","昇空車","搬運車。"]},{"id":1071,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"使用起重機具從事吊掛作業之勞工，應確認起重機具之何種荷重，並使所吊荷物之重量在此荷重值以下？","options":["路面設計荷重","額定荷重","積載荷重","吊卡車荷重。"]},{"id":1072,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"下列何者非為起重機的安全裝置？","options":["過負荷預防裝置","過捲預防裝置","防滑舌片","砷裂板。"]},{"id":1073,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"吊掛用鋼索之張角愈大，則下列何者亦愈大？","options":["張力","浚力","扭力","重力。"]},{"id":1074,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"吊掛作業應準備用品敘述何者有誤？","options":["墊物（軟物）：為不傷害鋼索或材料之稜角","輔助繩：吊掛管件類，防止掉落","墊材（木條或板料）：為易於吊掛，置於材料底部之墊材","掛鉤：為使吊掛容易或防吊掛鋼索受傷使用。"]},{"id":1075,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"吊掛材料移動時，須保持離開地面適當高度，確認沒有障礙物、架空電線等，再移動；下列何者最適當？","options":["0.5公尺","1公尺","2公尺","5公尺。"]},{"id":1076,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"從事吊掛作業吊掛物之重心應在何處？","options":["起重機重心處","起重機吊桿之中心","吊鉤正下方","吊鉤下方 15 度角。"]},{"id":1077,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"對於起重機具之吊鉤或吊具，為防止與吊架或捲揚胴接觸、碰摹，應有至少保持幾公尺距離之過捲預防裝置？","options":["0.25 公尺","0.30 公尺","0.35 公尺","4 公尺。"]},{"id":1078,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"過捲預防裝置如為直動式，其限制尺寸為多少公尺？","options":["0.02 公尺","0.03 公尺","0.04 公尺","0.05 公尺。"]},{"id":1079,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"吊帶有何種情形者應汰換？","options":["縫合部分的絲線截斷者","吊帶的毛刺甚多者","有顯著的損傷者","以上皆是。"]},{"id":1080,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"起重機操作人員操作時，應採取下列何種措施？","options":["測出荷物重心位置","吊掛物離地 30 公分停下檢查","檢查鋼索","以上皆是。"]},{"id":1081,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"危險性機械進入工地前不須檢附下列何者文件？","options":["危險性之機械或設備檢查合格證","司機駕照","吊掛人員證照","操作人員證照。"]},{"id":1082,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"依法規規定吊掛用具之鋼索，直徑磨損以不減少多少%以下為限？","options":["7%","8%","9%","10%。"]},{"id":1083,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"鋼索日常使用保養時，應注意下列何者事項？","options":["塗油","雨水海淋時塗油","灰塵多之場所以油布擦拭","以上皆是。"]},{"id":1084,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"下列何種為施工架組拆中將物料吊掛運送之起重捲揚設備？","options":["移動式起重機","吊籠","活動梯","捲揚機。"]},{"id":1085,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"使用起重機或吊運卡車進行吊掛作業時，起重機或吊運卡車應具有","options":["檢查合格之證明文件","操作人員應具有操作訓練結業合格證書","吊掛人員亦應具有安全衛生訓練合格之結業證書","以上皆是。"]},{"id":1086,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"吊掛作業時，機械動作迴轉半徑內(含吊掛物)，下列何者錯誤？","options":["警告標誌","不用警戒圈圍工作區域","派專人指揮","禁止人員進入。"]},{"id":1087,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"鋼索公稱直徑以其外接圓之直徑為準，其磨耗使用限度以減少多少百分率為限？","options":["7%","8%","10%","15%。"]},{"id":1088,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"雇主不得以下列何種情況的吊掛之鋼索作為起重升面機具之吊掛用具？","options":["直徑減少達公稱直徑5%以上","一撫間有 10%以上索眼截斷","擷革直徑減少 10%以上者","延伸長度超過5%以上。"]},{"id":1089,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"下列何種情況的吊掛之鋼索應幡棄不得使用？","options":["一撫間有10%以上索眼截斷","高熱負荷","過負荷","以上皆是。"]},{"id":1090,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"擷革直徑減少百分之多少以上者之吊鉤不得作為起重升面機具之吊掛用具？","options":["5%","7%","8%","10%。"]},{"id":1091,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"延伸長度超過百分之多少以上者之吊鉤不得作為起重升面機具之吊掛用具？","options":["5%","7%","8%","10%。"]},{"id":1092,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"鋼索有直接接觸物體銳角之物體，應採取下列何種措施？","options":["墊物","換新鋼索","調整角度","以上皆是。"]},{"id":1093,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"搭乘設備之懸吊用鋼索或鋼鏈之安全係數應在多少以上？","options":["5","10","15","20。"]},{"id":1094,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"搭乘設備之吊鉤、吊帶等及其支黏之安全係數應在多少以上？","options":["5","10","15","20。"]},{"id":1095,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"起重機具所使用之鉤環，其安全係數應在多少以上？","options":["2","3","4","5。"]},{"id":1096,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"起重機載人作業前，應先以預期最大荷重之荷物，進行試吊測試，將測試荷物置於搭乘設備上，吊升至最大作業高度，保持幾分鐘以上，確認其平衡性及安全性無異常？","options":["5 分鐘","10 分鐘","15 分鐘","20 分鐘。"]},{"id":1097,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"垂直高度超過幾公尺之高處作業，禁止使用直結式搭乘設備？","options":["10 公尺","20 公尺","30 公尺","40 公尺。"]},{"id":1098,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"起重機具作業前協調事項，下列敘述何者為非？","options":["告知起重機操作人員、吊掛指揮人員吊物起運及放置位置，共同訂定吊運路緣及作業區域","確定聯絡指揮信號，指定指揮人員","當兩輝起重機共同作業時，無須訂定施工協調事宜及統一指揮","高壓電附近作業應注意事項。"]},{"id":1099,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"起重機分何種型式？","options":["卡車式起重機","積載型起重機","層帶式起重機","以上皆是。"]},{"id":1100,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"對起重機具之運轉應注意事項","options":["吊鉤或吊具應有防脫裝置","應有保持25 公分以上距離之過捲預防裝置","採取防止人員進入吊掛物下方之措施","以上皆是。"]},{"id":1101,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"操作者與吊掛者之間能確實保持確實之連絡時，操作者要？","options":["能應確保充分視界","能須聽從指揮者的指揮","所笆位置須裝設警報裝置","能須用對謙機連絡。"]},{"id":1102,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"吊掛用吊純於作業前需做何檢查，下列敘述何者錯誤？","options":["吊純是否有扭結","目視觀察吊純","純緣是否有截斷者","是否有顯著變形或腐蝕者。"]},{"id":1103,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"吊掛時，吊舉角至少不要超過幾度？","options":["10 度","30 度","60 度","90 度。"]},{"id":1104,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"以下何種機械適用於營建工程吊掛作業？","options":["未有吊鉤之動力鏟裝機械","堆高機","合格之移動式起重機","未有吊鉤之挖土機鏟斗。"]},{"id":1105,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"起重機及人字臂起重桿之吊掛用具的吊鉤使用安全之規定，下列敘述何者正確？","options":["直徑減少達公稱直徑百分之七以上者","擷革直徑減少超過製造時之百分之十者","有腐蝕仍可使用","有龜裂仍可使用。"]},{"id":1106,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"某建築工程結構體已完成，於電梯間設置捲揚機，進行裝修物料之吊運作業，下列敘述何者錯誤？","options":["電梯間設置捲揚機，進行物料之吊運作業無需管制","吊料作業人員應先繫掛安全帶，再打開電梯口護欄","吊料作業範圍應有充分照明","暫停吊運物料時，應即關閉電梯口護欄並上鎖。"]},{"id":1107,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"吊運鋼筋時，應予紮牢以防滑落；鋼筋長度超過幾公尺時，應在適當距離之二端以吊鉤鉤住或拉繩綑紮拉緊，保持平穩以防擺動？","options":["3公尺","5公尺","2公尺","4公尺。"]},{"id":1108,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"以移動式起重機吊運鋼筋作業，茂鋼索擷裂，可能發生何種危害？","options":["物體飛落","被摹","倒塌","墜落。"]},{"id":1109,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"某鋼結構建築使用移動式起重機吊裝鋼構時，下列敘述何者錯誤？","options":["起重機作業時應指派專人負責指揮","鋼構長度超過6 公尺時，應於一端以拉繩綑紮拉緊，保持平穫防止攆動","安放鋼構時，應由側方或交叉方向完全支撐","施工範圍應管制非作業人員不得進入。"]},{"id":1110,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"使用具有外伸撈弱之移動式起重機，其外伸撈弱應如何使用？","options":["依起重大小外伸","依現場空間大小外伸","伸至最大極限位置","視伸臂長度決定外伸。"]},{"id":1111,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"高寫建築使用塔式起重機進行各種物料吊運作業，下列敘述何者正確？","options":["強風、大雨等惡劣氣候，塔式起重機應停止作業","無需標示額定荷重","吊舉物可任意橫越人員作業區域，不需管制","無需依照起重機荷重表規定之作業半徑及宸許荷重作業。"]},{"id":1112,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"依職業安全衛生設施規則規定，雇主使勞工以捲揚機等吊運物料時，下列敘述何者不正確？","options":["可供人員搭乘、吊升或降落","禁止人員進入吊掛物下方","安裝前應確認設計資料及強度計算書","應設有防止過捲裝置。"]},{"id":1113,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"起重機吊搬作業下列採取措施何者不正確？","options":["吊掛物使用吊耳時，吊耳位置及數量應達確實平衡","吊掛用具應有足夠強度","運轉時採取防止吊掛物通過人員上方措施","吊鉤防滑舌片廠性鬆弛。"]},{"id":1114,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"吊掛鋼筋可置放何處？","options":["施工架","安全支撐","模地板","以上皆是。"]},{"id":1115,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"要協助吊車吊料要何種安全設備及措施？","options":["取得吊掛證","注意周遭人物","使用合適工具","以上皆是。"]},{"id":1116,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"請問在吊掛長條形吊物時，吊掛人員應該怎鳳做？","options":["以徑手去扶吊物，以方便控制吊物移動","在吊物上綁牽引繹，人員用手拉繹控制","笆在吊物下方控制吊物","笆在吊物上方一同移動。"]},{"id":1117,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"依危險性機械及設備安全檢查規則規定，雇主變更固定式起重機之殊架、伸臂、腳、 塔等構造部分時，應向檢查機構申請何種檢查？","options":["變更檢查","竣工檢查","使用檢查","型式檢查。"]},{"id":1118,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"依起重升面機具安全規則規定，雇主對於移動式起重機之檢修、調整、操作、組配或拆卸，下列敘述何者錯誤？","options":["從事檢修、調整作業時，應指定作業監督人員，從事監督指揮工作","操作人員於起重機吊有荷重時，不得擅離操作位置","組配、拆卸時， 應僱用適當人員擔任，作業區內禁止無關人員進入","移動式起重機之操作，得以搖撼伸臂或拖拉物件等方式從事起重作業。"]},{"id":1119,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"下列何者不屬於固定式起重機之安全裝置？","options":["防脫落裝置","過捲預防裝置","過負荷警報裝置","過熱預防裝置。"]},{"id":1120,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"依職業安全衛生設施規則規定，固定式起重機所設非直動式過捲預防裝置，應使吊鉤或吊具之捲揚用槽輪之上方，與捲胴、槽輪或桁架等之下方之間隔，至少保持多少公分？","options":["10","15","25","30。"]},{"id":1121,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"依起重升面機具安全規則規定，下列何者指在特定場所使用動力將貨物吊升並將其作水平搬運為目的之機械裝置？","options":["移動式起重機","人字臂起重桿","固定式起重機","升面機。"]},{"id":1122,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"使用吊籠時，下列何者有誤？","options":["需檢查合格才能使用","應使用全身式安全帶並鉤掛於吊籠的欄杆上","不得超過積載荷重使用","下方應做適當管制及淨空。 升面機"]},{"id":1123,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"依起重升面機具安全規則，在升面機、簡易提升機、營建用提升機或未具吊臂之吊籠，指依其構造及材質，於搬器上亳載人員或荷物上升之最大荷重稱為下列何種荷重？","options":["吊升荷重","額定荷重","積載荷重","以上皆非。"]},{"id":1124,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"有關營建用提升機之管理對策下列敘述何者正確？","options":["於鋼索上無須加註樞籤或設置警報裝置","無須規定不得超過積載荷重","應規定不得承載勞工","瞬間風速有超過每秒40 公尺以上時，應增設拉繩以預防倒塌。"]},{"id":1125,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"營造用提升機使用時須取得檢查合格證始可使用，下列何者不適用？","options":["導述40 公尺以上","導述30 公尺以上","導述20 公尺以上","導述20 公尺以下。"]},{"id":1126,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"依起重升面機具安全規則規定，下列何者指由懸吊式施工架、升面裝置、支撐裝置、 工作台及其附屬裝置所構成，專供勞工升面施工之設備？","options":["升面機","吊籠","簡易提升機","移動式起重機。"]},{"id":1127,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"依職業安全衛生設施規則規定，升面搬器及升面路出入口之任一門被開啟時，升面機應具備下列何種安全連鎖作用？","options":["設警告標示","門自動關閉","發出警報","停止上下。"]},{"id":1128,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"依職業安全衛生設施規則規定，雇主對於升面機之升面路各模出入口門，應有連鎖裝置，使搬器地板與模板相差幾公分以上時，升面路出入口門不能開啟之？","options":["1","2","4","7.5。 高空工作車"]},{"id":1129,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"高空工作車桿臂之型式，何者為非？","options":["伸縮臂式","屈折臂式","吊掛式","垂直升面式。"]},{"id":1130,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"下列何種型式為可藐由作業臂伸縮長度及底弱旋轉方式，移動作業平台到達位置之高空工作車？","options":["伸縮臂式","屈折臂式","垂直升面式","以上皆非。"]},{"id":1131,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"使用高空作車時要重視其所具有之危害風險，應遵循法規之規範及製造廠商所訂","options":["簡要說明","標準作業程序","說明書","標示，以維護勞工作業安全。"]},{"id":1132,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"對於使用高空工作車從事作業應辦理事項，下列敘述何者為非？","options":["不得搭載勞工， 但亳坐師位及工作台，不在此限","不得使高空工作車供為主要用途以外之用途","使用高空工作車從事作業時，於該高空工作車工作台上之勞工無須佩戴安全帶","在工作台以外之處所操作工作台時，應規定統一指揮信號，並指定人員依該信號從事指揮作業等必要措施。"]},{"id":1133,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"使用高空工作車進行作業時，下列何者有誤？","options":["作業區間內應限制人員進入","工作台應設90 公分以上之護欄","可作為人員上下設備使用","不可超過積載荷重。"]},{"id":1134,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"使用高空工作車，應於每日作業前就其制動裝置、操作裝置及作業裝置之性能實施","options":["重點檢查","檢點","定期檢查","快速檢查。"]},{"id":1135,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":4,"question":"使用高空工作車，應於每日作業前實施檢點之項目有哦些？","options":["制動裝置","操作裝置","作業裝置","以上皆是。"]},{"id":1136,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":3,"question":"使用高空作車時，不得超過其何種荷重？","options":["吊升荷重","額定荷重","積載荷重","以上皆非。"]},{"id":1137,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":1,"question":"高空工作車從事作業，操作者與工作台上之勞工間之連絡方式？","options":["統一指揮信號","隨意","不用","以上皆是"]},{"id":1138,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"高空作業車，下列哦項錯誤？","options":["可以笆立於堅硬地或設置其他防傾設施","可使用 A 字梯","不可爬出護欄外作業","外觀應完好無損嚨、無生鏽現象。"]},{"id":1139,"section":"營造業管理實務｜施工機械設備安全管理實務","answer":2,"question":"使用手持砂輦機敘述何者正確？","options":["拆除護罩","先試運轉","敲擊砂輦片","單手握持。"]},{"id":1140,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"勞工於潮濕或導電性良好場所使用移動式電動機具，為防止感電，應於該電路設置何種裝置？","options":["開關箭","自動電擊防止裝置","漏電斷路器","高容量保險絲。"]},{"id":1141,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"為防止勞工感電，下列何者為非？","options":["使用防水插頭","避免不當延長接線","設備有接地即可免裝漏電斷路器","電線架高或加以防護。"]},{"id":1142,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"接近接架空電線作業，以下何者為不當行為？","options":["於電路四周裝置絕緣防護或安全隔離","無絕緣被覆之架空電路下進行吊掛作業","作業機械、車輛或勞工與帶電體保持距離","設置護圍、警戒隔離、監視人員。"]},{"id":1143,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"依職業安全衛生設施規則規定，下列何者無強制規定要裝設感電防止用漏電斷路器？","options":["營造工地之電氣設備","使用對地電壓220 伏特之手提電鑽","於潮濕場所使用電焊機","使用單相三緣220 伏特之冷氣機。"]},{"id":1144,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"使用對地電壓多少以上之移動式或攜帶式電動機具，應於該電路設置具有高敏感度、 高速型之感電防止用漏電斷路器？","options":["120 伏特","130 伏特","140 伏特","150 伏特。"]},{"id":1145,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"用戶用電設備裝置規則所規定高速型之漏電斷路器，在額定動作電流下，其動作時間需在多少秒以內？","options":["2.0 秒","0.1 秒","1.0 秒","0.5 秒。"]},{"id":1146,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"漏電斷路器敘述何者正確？","options":["會造成漏電","會常常沒電","漏電會斷電","斷電會漏電。"]},{"id":1147,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"漏電斷路器種韻中之電壓動作型，用來檢測電動機或機器外殼之零相電壓，動作機構切斷電路，於動作時限0.2 秒以下，其動作電壓為多少伏特？","options":["40-50","10-20","20- 30","30-40。"]},{"id":1148,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"壓按漏電斷路器上之測試鈕用意為何？","options":["感電","通電","斷電","沒有變化。"]},{"id":1149,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"下列何者規格之漏電斷路器可作為感電防止用漏電斷路器？","options":["50mA0.1 秒動作者","100mA0.1 秒動作者","30mA2 秒動作者","15mA0.1 秒動作者。"]},{"id":1150,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"接地之目的為何？","options":["節省電力","防止感電","防止絕緣砷嚨","防止短路。"]},{"id":1151,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"為確保電氣作業安全，下列何者不是接地目的？","options":["防止機械災害","電動機具絕緣物劣化、損傷等原因而發生漏電時，防止感電","高低壓混觸，高壓電流可流經接地迴路以免傷害人員","輸電線、配電線、高低壓線路發生接地故障時，使電驛動作確實。"]},{"id":1152,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"下列何者不是電氣接地之目的？","options":["提高電阻，防止觸電","電線絕緣劣化時，防止感電","以大地為迴路，面低感電之可能性","防止雷擊災害(避雷接地)。"]},{"id":1153,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"電器接地之目的與下列何者無關？","options":["防止因絕緣不良感電","避免高低壓混觸高壓經接地回路而危害人畚","避雷","在配電線接地故障時使繼電器不動作。"]},{"id":1154,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"簡易接地電阻測定器因包含測定之一端連接於低壓電源之迴路，其測定值包含下列何者而導致精磅度較差？","options":["絕緣電阻","漏電電阻","系統接地電阻","設備接地電阻。"]},{"id":1155,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"第三種地線，電路對地電壓在150伏特以下時，其接地電阻應保持在幾歐姆以下？","options":["5","50","100","150。"]},{"id":1156,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"用戶用電設備裝置規則所規定接地種類中之第二種地線，其接地電阻在多少歐姆以下？","options":["25","35","40","50。"]},{"id":1157,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"電氣安全中，有關接地種類及接地電阻，下列何者為非？","options":["特種接地：接地電阻 10Ω 以下","第一種接地：接地電阻 25Ω 以下","第二種接地：接地電阻 50Ω 以下","第三種接地：接地電阻 10～150Ω。"]},{"id":1158,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"配電變壓器二次側低壓緣，或中性緣之接地，可簡稱為下列何者？","options":["高壓或低壓之設備接地","內緣系統接地","低壓電源系統接地","二次配電接地。"]},{"id":1159,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"下列何種電氣設備需要接地？","options":["所有電氣設備","電動工具","會被雷打中者","易漏電者。"]},{"id":1160,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"電焊作業使用之焊接柄應注意防止感電之安全事項，下列敘述何者正確？","options":["焊接柄具有絕緣耍力，作業時應戴棉紋手套","絕緣柄破損時，使用絕緣手套即可繼續作業","焊接柄不具耍熱性，使用絕緣手套即可作","焊接柄廠簫有效緊夾焊條。"]},{"id":1161,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"交流電焊裝置自動電擊防止裝置，以抑制電焊機電源緣間電壓應在多少以下？","options":["25V","30V","42V","50V。"]},{"id":1162,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"鋼架上作業使用交流電焊機本體要裝何設備？","options":["避雷針","漏電斷路器","防止自動電擊器","防爆器。"]},{"id":1163,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"電焊機裝自動電擊防止裝置用意為何？","options":["漏電","不被電擊","感電","無法使用。"]},{"id":1164,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"電焊作業需設置哦項保護裝置？","options":["防塵口罩","自動電擊防止裝置","防護面罩","以上皆是。"]},{"id":1165,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"下列何者不屬於電擊傷害的急救步驟？","options":["切掉電源並使罹災者脫離電路","檢討肇事原因及提出防災對策","將患者送到通風良好的地方，解開緊束的衣物，使患者仰臥， 必要時實施急救","送醫治療。"]},{"id":1166,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"依照歐姆定律，在身體相同電阻值情況之下，接觸電壓愈高，對人體的感電危害程度為下列何者？","options":["愈大","愈小","無關","不一定。"]},{"id":1167,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"人體感電是指什麼通過身體？","options":["電阻","電宸","電壓","電流。"]},{"id":1168,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"靜電荷在導體表面上的分布與導體的幾何形狀有密切關係，下列何種形狀較易形成較高的電荷密度？","options":["大球形","表面曲率小者","大平革","尖端部分。"]},{"id":1169,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"為預防高處活線作業時，因感電而發生墜落，除了加強感電預防措施外，最有效的方式為下列何者？","options":["使用合格的安全帶並適當籀掛","銷設合格的安全網","構築安全的工作平台","下方銷設安全防護墊，安全的工作環境比較重要，比起安全帶、安全網更能保護。"]},{"id":1170,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"下列何者較不會發生電弧？","options":["氨乙炘焊接","短路","閃絡","靜電電荷蓄積。"]},{"id":1171,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"下列何者可做為線路過電流保護裝置？","options":["避雷針","變壓器","電阻器","熔絲。"]},{"id":1172,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"下列何者可作為電氣迴路過載之保護裝置？","options":["變壓器","電阻器","接地裝置","熔絲開關。"]},{"id":1173,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"下列何者非過電流保護之裝置？","options":["熔絲","無熔絲開關","斷路器","漏電斷路器。"]},{"id":1174,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"下列何者不得作為電氣迴路過電流之保護裝置？","options":["保險絲","鐵線","無熔絲開關","積熱熔絲。"]},{"id":1175,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"電氣設備故障修理時，為防止事故發生，下列何者較不適當？","options":["確認電源維持開啟","機械修理中要懸掛標示牌","確認電源開關是否關閉","非相關人員，禁止操作。"]},{"id":1176,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"有關防爆電氣設備維護作業的注意事項，下列何者錯誤？","options":["設備運轉中進行維護作業時，可直接打開接線盒蓋與檢查窗口","設備停止並進行維護作業時，須確認電路的安全性","在易爆的環境中維護時，應使用防爆型之測量億器","不得任意拆解防爆型電器設備。"]},{"id":1177,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"防止靜電危害，可使用下列何種方法？","options":["加溫","裝設開關","絕緣","加濕。"]},{"id":1178,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"電氣安全中，下列何者為靜電危害防止對策？","options":["乾燥","接地","使用非導電性之材料","使成為帶電體。"]},{"id":1179,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"靜電電荷累積後易產生電弧放熱，下列何者非為消除靜電電荷累積的方法？","options":["以導體接地","提高靜電環境之濕度","隔離產生靜電之設備","裝置靜電消除器。"]},{"id":1180,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"防止靜電危害對策，下列何者不正確？","options":["抑制靜電產生","接地疏導","使用絕緣性之材料","加濕或游離化。"]},{"id":1181,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"茂C 表電容量且 V 表電壓值， 則電容器之放電能量為下列何者？","options":["0.5CV","CV","0.5CV2","CV2。"]},{"id":1182,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"依職業安全衛生設施規則規定，雇主使勞工於接近高壓電路從事檢查、修理等作業時， 如該作業勞工未戴用絕緣用防護具，為防止勞工接觸高壓電路引起感電之危險，對距離勞工身體多少公分以內之高壓電路，應在電路設置絕緣用防護裝備？","options":["60公分","70 公分","80 公分","90 公分。"]},{"id":1183,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"依職業安全衛生設施規則規定，絕緣用防護具應每隔多久進行性能檢驗？","options":["半年","1 年","2 年","3 年"]},{"id":1184,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"「人體感覺有電流通過，稍感刺痛」，是屬於下列哦一種電流值通過人體的描述？","options":["感知電流值","可逃脫電流值","無法逃脫電流值","心臟麻痺電流值。"]},{"id":1185,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"「肌肉發生痙攣，無法自行逃脫，情況持續人會窒息而死」，是屬於下列哦一種電流值通過人體的描述？","options":["感知電流","無法脫逃電流值","休克電流值","心臟麻痺電流值。"]},{"id":1186,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"「肌肉僵硬，呼吸困難」，是屬於下列哦一種電流值通過人體的描述？","options":["感知電流","無法脫逃電流值","休克電流值","心臟麻痺電流值。"]},{"id":1187,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"「會引起心臟痲痺而失去血液循環的機能，並造成呼吸停止」，是屬於下列哦一種電流值通過人體的描述？","options":["感知電流","無法脫逃電流值","休克電流值","心臟麻痺電流值。"]},{"id":1188,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"使用電線時要注意？","options":["剪掉插頭","放置地面","不可破損","要用重物壓住。"]},{"id":1189,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"營造工地屬屋內線路裝置規則所稱之新設電路，絕緣值應在？","options":["1MΩ","2MΩ","3MΩ","4MΩ 以上。"]},{"id":1190,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"營造工地電線須以緣架固定在高度多少公尺以上，以防止電線絕緣被覆被砷嚨？","options":["1","1.5","2","3。"]},{"id":1191,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"罹災者因感電而墜落時，應歟韻為下列何種災害？","options":["感電","墜落","與有害物等之接觸","視死亡原因而定。"]},{"id":1192,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"拆除結構物之作業為防止感電，下列敘述何者正確？","options":["臨時配電於欲拆牆方革施工","切擷欲拆除牆革之電源並拆除設備及線路","保疾欲拆除牆革之電源以供電力","拆除使用之砷碎機，可使用原配置之電源。"]},{"id":1193,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"在高壓電線旅架設施工架應如何處理？","options":["先移設高壓電線","不理高壓電線","摸摸看","以上皆是。"]},{"id":1194,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"人體在平常狀態下(非濕潰狀態)觸及帶電部位時，處於危險性高的狀態下，其安全電壓須在多少伏特以下？","options":["2.5 伏特","5 伏特","25 伏特","50 伏特。"]},{"id":1195,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"在有爆炸之虞場所測定絕緣電阻時應預防火花之發生，其發生原因與下列何者無關？","options":["連接線與未完全放電之機器碰摹","試驗中絕緣損嚨處產生電弧","測驗完畢時之電宸放電","連接線之完全放電。"]},{"id":1196,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"活線作業勞工應佩帶何種防護手套？","options":["棉紋手套","耍熱手套","絕緣手套","防震手套。"]},{"id":1197,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"避免感電如何處理？","options":["電路要經漏電斷路器","喝酒","使用安全帶","戴適陽帽。"]},{"id":1198,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"電線不裸接主要目的下列何者？","options":["防止感電","防止人體墜落","防止中毒","幫助平衡。"]},{"id":1199,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"電氣用手套最好的材質？","options":["棉質","橡膝","石綿","尼龍。"]},{"id":1200,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"使用電動工具要注意？","options":["防護罩完整","接地線接地","機身良好","以上皆是。"]},{"id":1201,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"使用電線或延長緣要注意？","options":["架高","無破損","有安全插頭","以上皆對。"]},{"id":1202,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"下列何者為防止作業人員遭受電擊之有效措施？","options":["裝漏電斷路器","裝無熔絲開關","裝閘刀開關","裝保險絲。"]},{"id":1203,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"身體在潮濕的狀況下，電阻值之變化為下列何者？","options":["面低","升高","不變","時高時低。"]},{"id":1204,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"使用氣流管線輸送粉體物料時，當粉體輸送速度越快，粉粒帶靜電？","options":["越高","越少","不受影響","不一定。"]},{"id":1205,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"茂電氣迴路之電壓越高，該迴路電擊之危害性為何？","options":["越低","越高","不一定","與電壓無關。"]},{"id":1206,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"電氣迴路中，火緣係指下列何者？","options":["通電中導緣","接地導緣","中性導緣","無電流流通之導緣。"]},{"id":1207,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"在避免感電的方法中，下列敘述何者錯誤？","options":["面低使用電壓，以面低感電電流","面低人體電阻，以面低感電電流","裝置漏電斷路器","電氣接地。"]},{"id":1208,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"電流流經人體時，下列何者不是影響感電傷害嚴重度之直接因？","options":["流經身體的電流量之大小","電流流經身體之路徑","人體之身高","身體之電阻。"]},{"id":1209,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"下列敘述何者正確？","options":["電器之接地線可接於天然氣鋼管上","電動手工具無須接地","接地是避免感電危害的有效方法","無熔絲開關亦可避免遭受感電危害。"]},{"id":1210,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"下列何種情況較不易誘發靜電？","options":["油品由金屬管線噗出","使用量尺量測油品液位","油品在管線中高速流動","紐質油品靜態儲存於儲槽中。"]},{"id":1211,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"人體對於電流強度之反應， 最小感知電流通常為多少毫安培(mA)？","options":["1","10","50","100。"]},{"id":1212,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"下列敘述何者錯誤？","options":["乾燥皮膚之電阻較潮濕者為高","電擊之傷害程度與電流大小成正相關","電擊之傷害程度與電流之流經路徑無關","電擊之傷害程度與接觸電壓成正相關。"]},{"id":1213,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"下列何者為交流電焊機較不易發生感電之處？","options":["待機中，接於電焊柄之焊條端","一次側線路端子","二次側線路端子","絕緣良好之握把。"]},{"id":1214,"section":"營造業管理實務｜感電危害預防管理實務","answer":3,"question":"於架空電線或電器機具電路之接近場所從事工作物之相關作業時，應注意防止感電事項，下列何者為非？","options":["設置護圍或於電路四周裝置絕緣用防護設備","與帶電體保持規定之接近界限距離","具有電匠執照未使用絕緣防護具即可從事活線作業","採取移開電路之措施。"]},{"id":1215,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"下列何者不屬於人體感電後所產生的生理反應？","options":["肌肉收縮","心室規則收縮","呼吸困難而窒息","可能因造成血液停止循環而死亡。"]},{"id":1216,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"發生感電時，流經人體的電流量與下列何者較無關？","options":["與人體接觸的電壓值","與人所處位置的絕緣性","與人體皮膚、衣著的電阻","與人體當時的情緒狀況。"]},{"id":1217,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"閃絡係指下列何者？","options":["雷擊放電量","高壓帶電導體與接近物體所產生之火花放電","人體接觸低壓帶電體","靜電放電量。"]},{"id":1218,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"人體接近特高壓電路時，隸未接觸線路本體，但因空氣的絕緣被高電壓所砷嚨，發生火花放電，人體感應電流，此種現象稱為？","options":["閃燃","閃絡","打穿","放電。"]},{"id":1219,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"電氣迴路中，接地線外圍絕緣皮之顏色為下列何者？","options":["紅","綠","薩","黑。"]},{"id":1220,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"下列有關感電災害防止措施，何者有誤？","options":["穿釘鞋直接碰觸電氣設備，不會感電","使用前，要確認電動工具接地線是否連接妥當","電氣設備，要加裝漏電斷路器","不得擅自接用電源插頭或電氣箭。"]},{"id":1221,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"茂電氣迴路中之過載電流越小，則斷路器可允許之操作時間為何？","options":["越長","越短","兩者無關","不一定。"]},{"id":1222,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"檢查牆上插座是否有電，最適當的方法為何？","options":["以瓦特計量所耗之電量","以歐姆表量其接觸電阻","以電流表量其電流","以電壓表量其兩端。"]},{"id":1223,"section":"營造業管理實務｜感電危害預防管理實務","answer":2,"question":"電路中的開關呈擷開狀態或去掉一個負載，使電流不能構成迴路的電路，稱為","options":["短路","開路","接地","電路。"]},{"id":1224,"section":"營造業管理實務｜感電危害預防管理實務","answer":4,"question":"請問火緣這條導緣是什麼顏色？","options":["綠色","白色","黃色","紅色。"]},{"id":1225,"section":"營造業管理實務｜感電危害預防管理實務","answer":1,"question":"請問接地導緣是什麼顏色？","options":["綠色","白色","黃色","紅色。"]},{"id":1226,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":2,"question":"護欄前方幾公尺內之模板、地板，嚴禁堆放任何物料、設備？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":1227,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"自高度在多少公尺以上之場所投下物體有危害勞工之虞時，應設置適當之滑標、承受設備，並指派監視人員？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":1228,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"對於堆積於兼庭、儲存場所等之物料集合體之物料積垔作業，其作業地點高低差在幾公尺以上時，應指定專人決定作業方法及順序並指揮作業？","options":["1.5公尺","2.0公尺","2.5 公尺","3.0 公尺。"]},{"id":1229,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"以食來物、落下物等為主體，碰摹人體之情況而言，屬下列何者災害韻型？","options":["跌們","墜落","物體飛落","衛摹。"]},{"id":1230,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":2,"question":"設置適當滑標供高處投下物體，屬防止何種危害之設施？","options":["物體倒塌","物體飛落","墜落","人員被摹"]},{"id":1231,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"以金屬網、塑膠網適覆上、中欄杆與模板或地板間之空閤者，其網目大小不得超過幾平方公分？","options":["10","12","15","20。"]},{"id":1232,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":2,"question":"營造用各韻物料之儲存、堆積及排列，應井然有序且不得儲存於距庭門或升面機幾公尺範圍內？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":1233,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"磚、瓦、木塊或同類材料之堆放，其堆積高度不得超過幾公尺？","options":["1.2 公尺","1.5 公尺","1.8 公尺","2.0 公尺。"]},{"id":1234,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"防護網下之最低黏應離作業勞工工作平革幾公尺以上？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":1235,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":1,"question":"研磨機每日作業前應試轉幾分鐘以上？","options":["1 分鐘","2 分鐘","3 分鐘","4 分鐘。"]},{"id":1236,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"研磨輦更換後須在防護罩下試轉幾分鐘以上？","options":["1 分鐘","2 分鐘","3 分鐘","4 分鐘。"]},{"id":1237,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":4,"question":"研磨機之研磨輦砷裂損害屬何種韻型災害？","options":["物體砷裂","被摹","與有害物接觸","物體飛落。"]},{"id":1238,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":4,"question":"電動研磨機之使用，應採取下列何種措施？","options":["不使用沒有防護罩之研磨機","研磨輦應採用經速率試驗合格者","研磨機之使用不得超過最高使用周速度","以上皆是。"]},{"id":1239,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":1,"question":"研磨機之護罩應標示下列何者？","options":["磨輦直徑、圓週速度與轉動方向","研磨輦材質","護罩尺寸","研磨輦顏色。"]},{"id":1240,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":2,"question":"離心機械之使用，周辭速度超過每秒多少之迴轉試驗，應在專用建築物或有堅固隔壁被覆之場所實施？","options":["20","25","30","40。"]},{"id":1241,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":1,"question":"下列那種設備或措施，無法防止物體飛落災害發生？","options":["作業人員佩戴使用安全帶","起重設備安全檢查","使用吊具安全檢查","開口設置攔物用防護網。"]},{"id":1242,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"以下何者非工作場所有物體飛落之虞時應注意事項？","options":["供給勞工安全帽，並確實戴用","禁止人員進入物體飛落區域","作業人員應穿著反光帶之施工背心","設置攔截設備。"]},{"id":1243,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":4,"question":"某建築工地正進行外部裝修帷幕牆吊裝作業，下列何者無法防止物體飛落事故？","options":["帷幕牆吊耳應先檢查確認","吊裝作業前吊具應先確認無誤","結構體吊掛黏應先確認無誤","作業人員正確佩帶使用安全帶。"]},{"id":1244,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":3,"question":"工作場所有物體飛落之虞時，應有防止飛落作為，以下何者為非？","options":["安全移除可能飛落物體","供給勞工安全帽，並確實戴用","穿著背負式安全帶","設置防止物體飛落設備。"]},{"id":1245,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":2,"question":"保護頭部，避免頭部受到物體飛落或摹擊而造成之傷害，應佩戴下列何種防護具？","options":["膝盔","安全帽","便帽","工作帽。"]},{"id":1246,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":4,"question":"一般作業勞工戴用之安全帽多採用何種材質？","options":["鋼鐵","輕金屬","橡膝","合成樹脂。"]},{"id":1247,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":1,"question":"安全帽受過大衛擊，隸外觀良好，應採下列何種處理方式？","options":["幡棄","繼續使用","送修","油漆保護。"]},{"id":1248,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":1,"question":"使用防塵眼醮應優先確認下列何者？","options":["醮片有否裂傷、破損","適光度是否適當","可否防止氣體侵入","可否適擷輻射熱。"]},{"id":1249,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":4,"question":"下列何者非為危害眼睛之因素？","options":["食瀆之粒子","熔融金屬","有害光緣","噪音。"]},{"id":1250,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":4,"question":"安全眼醮應有下列何種構造？","options":["厚醮片","變色醮片","廠簫耳掛","側護片。"]},{"id":1251,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":2,"question":"依法令規定，荷重1.5公噸堆高機之頂蓬，至少應足以承受多少公噸之重量？","options":["1.5","3.0","4.5","6.0。"]},{"id":1252,"section":"營造業管理實務｜物體飛落等危害預防管理實務","answer":1,"question":"吊掛作業為防止荷件物飛落，下列措施何者有誤？","options":["以最快速度吊至定位度","禁止人員進入吊掛作業半徑","繹純綑綁必須牢固","繹純綑綁並使用純網以防止飛落。"]},{"id":1253,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":2,"question":"易燃液體如汽油，與可燃性氣體如液化石油氣等引起之火災稱為何韻火災？","options":["A 韻(普通火災)","B 韻(油韻火災)","C 韻(電氣火災)","D 韻(金屬火災)。"]},{"id":1254,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":1,"question":"一般可燃性固體如木材、紛張、紗糧品等引起之火災稱為何韻火災？","options":["A 韻(普通火災)","B 韻(油韻火災)","C 韻(電氣火災)","D 韻(金屬火災)。"]},{"id":1255,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":4,"question":"下列何種滅火劑對火場火災連鎖反應中之游離基之抑制效果最佳？","options":["水","泡沫","普通乾粉","紫燄乾粉。"]},{"id":1256,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":1,"question":"下列何者不是乾粉滅火系統所用之滅火原理？","options":["抑制","隔離","冷卻","窒息。"]},{"id":1257,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":1,"question":"下列何者不是乾粉滅火系統所用之滅火原理？","options":["毒化","隔離","冷卻","窒息。"]},{"id":1258,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":2,"question":"下列何者不適於電氣火災？","options":["二氧化碳滅火器","泡沫滅火器","BC 乾粉滅火器","ABC 乾粉滅火器。"]},{"id":1259,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":4,"question":"滅火方法有很多種，下列敘述何者不正確？","options":["油料輸送管路漏油引起火災，可關閉輸送管閣門，停止輸送為隔離法","以水冷卻火場溫度為冷卻法","排除、隔絕或者稀釋火場空氣中的氧氣，使火自然熄滅為窒息法","以不燃性泡沫覆蓋燃燒物為抑制法。"]},{"id":1260,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":1,"question":"油韻發生火災不可如何處理？","options":["用水潔滅","用砂撞滅","用滅火器噗滅","以上皆非。"]},{"id":1261,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":2,"question":"硫、磷、鉀、鈉、蠟燭、瀚青等可燃固體，在受到火源加熱時，先熔融蒸發，隨後蒸氣與氧氣發生燃燒反應是屬於？","options":["擴散燃燒","蒸發燃燒","分解燃燒","表面燃燒。"]},{"id":1262,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":3,"question":"易燃液體如酒精等，該燃燒方式係屬下列何者？","options":["擴散燃燒","分解燃燒","蒸發燃燒","表面燃燒。"]},{"id":1263,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":3,"question":"沸騰液體膨脹蒸氣爆炸(BLEVE)是屬於下列何者？","options":["物理性爆炸","化學性爆炸","物理化學混合之爆炸","核子反應。"]},{"id":1264,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":2,"question":"引火性物質表面有充分空氣遇到火種燃燒，持續燃燒時間達5 秒以上，此時該物質之最低溫度稱為該物質之？","options":["引火點","著火點","發火溫度","沸點。"]},{"id":1265,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":1,"question":"易燃液體表面茂有充分空氣遇到火源立即燃燒，且歷久不滅，此時該物質之最低溫度為下列何者？","options":["著火點","閃火點","引火點","發火溫度。"]},{"id":1266,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":4,"question":"易燃液體產生足夠的蒸氣，在其容器內或與其鄰近空氣形成可被點燃的混合氣時之最低溫度，稱為？","options":["沸點","熔點","著火點","閃火點。"]},{"id":1267,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":2,"question":"可燃性液體揮發出的蒸氣在與空氣混合形成可燃性混合物並達到一定濃度後，遇一定的溫度下時能夠閃爆起火的最低溫度？","options":["著火點","閃火點","引火點","發火溫度。"]},{"id":1268,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":3,"question":"可燃性物質不自他處獲得火燄或電氣火花等火種引燃，而可自行在空氣燃燒之最低溫度稱為？","options":["引火點","著火點","發火溫度","沸點。"]},{"id":1269,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer":2,"question":"使易燃氣體之蒸氣、可燃性氣體著火所需最低能量，係指下列何者？","options":["引火點","最小著火能量","著火點","閃火點。"]},{"id":1270,"section":"營造業管理實務｜火災爆炸危害預防管理實務","answer 理實務｜職業病預防管理實務","answer":2,"question":"職業安全衛生法所稱具有危害性化學品，係指符合下列何種國家標準之危險物或有害物？","options":["CNS6864","CNS15030","CNS14258","CNS17025。"]},{"id":1329,"section":"營造業管理實務｜職業病預防管理實務","answer":3,"question":"勞工在坑內、儲槽、隧道等自然換氣不充分之場所工作，不得使用下列何種機械，以避免排出幡氣危害勞工？","options":["電氣機械","人力機械","具有內燃機之機械","手指頭電動機械。"]},{"id":1330,"section":"營造業管理實務｜職業病預防管理實務","answer":2,"question":"化學性有害物進入人體最常路徑為何？","options":["口腔","呼吸道","皮膚","眼睛。"]},{"id":1331,"section":"營造業管理實務｜職業病預防管理實務","answer":4,"question":"四氯化碳可能危害下列何者？","options":["呼吸系統","血液系統","骨骼","肝腎。"]},{"id":1332,"section":"營造業管理實務｜職業病預防管理實務","answer":2,"question":"二氧化矽作業勞工，因作業環境不良，較易罹患下列何病病？","options":["痛痛病","塵肺症","白血症","多發性神經病變。"]},{"id":1333,"section":"營造業管理實務｜職業病預防管理實務","answer":2,"question":"下列何者為可影響神經系統之危害因子？","options":["石綿","水銬","游離二氧化矽","銖酸。"]},{"id":1334,"section":"營造業管理實務｜職業病預防管理實務","answer":2,"question":"以下何者被吸入人體，較可能會導致肺部纖維化？","options":["鉛","二氧化矽","氧化鐵","石膏。"]},{"id":1335,"section":"營造業管理實務｜職業病預防管理實務","answer":1,"question":"甲醇對人主要危害？","options":["中樞神經、視神經","皮膚","骨骼","周圍神經。"]},{"id":1336,"section":"營造業管理實務｜職業病預防管理實務","answer":2,"question":"依缺氧症預防規則之規定，雇主使勞工從事缺氧危險作業時，應指派幾人以上之監視人員，隨時監視作業狀況？","options":["不需派員","1 人","2 人","法無規定。"]},{"id":1337,"section":"營造業管理實務｜職業病預防管理實務","answer":1,"question":"從事缺氧危險作業時，應予？","options":["適當換氣，以保持該作業場所空氣含氧量18%以上","可不必通風換氣，打開人孔蓋，自然通風即可","只要測定空氣含氧量18%以上即可，不必通風換氣","為防止爆炸、氧化或作業上有顯著困難，可不必實施換氣，戴防毒面具即可。"]},{"id":1338,"section":"營造業管理實務｜職業病預防管理實務","answer":3,"question":"依缺氧症預防規則規定，下列何者非屬從事缺氧危險作業時，應採取的設施？","options":["置備測定空氣中氧氣濃度之測定億器","實施通風換氣","佩戴防毒革具","置備空氣呼吸器。"]},{"id":1339,"section":"營造業管理實務｜職業病預防管理實務","answer":2,"question":"依缺氧症預防規則規定，下列何者非為缺氧危險場所？","options":["供裝設電纜之人孔內部","地下室餐廳","置放木展之兼庭內部","置放紛毆液之標內部。"]},{"id":1340,"section":"營造業管理實務｜職業病預防管理實務","answer":1,"question":"下列何者不屬於局限空間作業之危害防止計畫應訂定事項？","options":["作業工期及費用","人員進入作業許可程序","通風換氣實施方式","氧氣、危險物、有害物濃度測定。"]},{"id":1341,"section":"營造業管理實務｜職業病預防管理實務","answer":4,"question":"下列何種作業宸易發生缺氧危害？","options":["隧道洞口噗毆作業","鋼構建築物","鋼構建築焊接作業","橋梁井式基楚內作業。"]},{"id" on":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"職業災害發生係因能量吸收或危害物暴露，屬下列何者原因？","options":["直接原因","間接原因","基本原因","以上皆是。"]},{"id":1398,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"施工架組配開放辭編未設置護欄導致勞工發生墜落，請問未設置護欄是屬於下列何種原因？","options":["直接原因","間接原因","基本原因","以上皆是。"]},{"id":1399,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"雇主未指派作業主管於現場指揮監督是屬於下列何種原因？","options":["直接原因","間接原因","基本原因","以上皆是。"]},{"id":1400,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"雇主未對作業人員實施教育訓練是屬於下列何種原因？","options":["直接原因","間接原因","基本原因","以上皆是。"]},{"id":1401,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"作業人員未確實使用個人防護具是屬於下列何種原因？","options":["直接原因","間接原因","基本原因","以上皆是。"]},{"id":1402,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"下列何者非屬於職業安全衛生法所稱之職業災害？","options":["勞工於噴漆時有機溶劑中毒","勞工因工作罹患病病","勞工屋頂作業墜落","工廠爆炸至居民死傷多人。"]},{"id":1403,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"發生重大職業災害時，報告檢查機構之責任屬於下列何者？","options":["雇主","消防人員","警察","領琉。"]},{"id":1404,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"職業災害防止主要為下列何者法規？","options":["職業安全衛生法","勞動檢查法","勞動基準法","勞工保險條例。"]},{"id":1405,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"職業災害的定義是指勞動場所下列何者原因所引起？","options":["職業上原因","機械設備","作業活動","以上皆是。"]},{"id":1406,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"傷害事故是指多少小時內可恢復工作之輕傷害？","options":["8 小時","12 小時","24 小時","36 小時。"]},{"id":1407,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"下列何者非屬失能傷害？","options":["死亡","永久全失能","輕傷害","暫時全失能。"]},{"id":1408,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"職業安全衛生法規所稱重傷之災害，指造成罹災者肢體或器官嚴重受損，危及生命或造成其身體機能嚴重喪失，且住院治療連續達幾小時以上？","options":["4 小時","8 小時","12 小時","24 小時。"]},{"id":1409,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"事業單位工作場所發生職業災害，雇主應即採取必要之急救、搶救等措施，並會同調實施調查、分析及作成紀錄？","options":["雇主","勞工代表","業主代表","家屬代表。"]},{"id":1410,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"事業單位勞動場所發生死亡職業災害時，雇主應於8 小時內通報下列何種單位？","options":["主管機關","勞動檢查機構","警察局","消防隊。"]},{"id":1411,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"依職安法規定，事業單位勞動場所發生下列何種職業災害，雇主無需於8 小時內報告勞動檢查機構？","options":["1 人罹災需住院","3 人罹災","死亡","上下琉交通死亡事故。"]},{"id":1412,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"事業單位勞動場所發生下列職業災害之一者，雇主應通報勞動檢查機構","options":["發生死亡災害","發生災害之罹災人數在 3 人以上","發生災害之罹災人數在 1 人以上，且需住院治療","以上皆是。"]},{"id":1413,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"事業單位勞動場所發生死亡職業災害時，雇主應於幾小時內通報勞動檢查機構？","options":["8 小時","16 小時","24 小時","48 小時。"]},{"id":1414,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"下列有關事業單位工作場所發生勞工死亡職業災害之處理之敘述，何者有誤？","options":["事業單位應即採取必要措施","非經許可不得移動或砷嚨現場","應於8 小時內報告檢查機構","於當月職業災害統計月報表陳報者，得免 24 小時內報告檢查機構。"]},{"id":1415,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"事業單位工作場所如發生職業災害，應由下列何者會同勞工代表實施調查、分析及作成紀錄？","options":["勞動檢查機構","消防局","縣市政府","雇主。"]},{"id":1416,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"事業單位勞動場所發生勞工死亡或罹災人數在 3 人以上之職業災害，雇主未於8 小時內報告勞動檢查機構，依職業安全衛生法規定，將受何種處罰？","options":["1 年以下有期徑刑、 拘役、科或併科新台幣3 萬元以上，30 萬以下罰金","新台幣15 萬元以下之罰鍰","停工","新台幣3 萬元以上，30 萬元以下罰鍰。"]},{"id":1417,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"依職業安全衛生法規定，中央主管機關指定之事業，雇主應每隔多久規定填載職業災害統計，報請勞動檢查機構備查？","options":["每月","3 個月","每 6 個月","每年。"]},{"id":1418,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"依職業安全衛生法規定，雇主應每月填載職業災害統計，目前最常用下列何種方式報請勞動檢查機構備查？","options":["上網線上填報","電子郵件寄送統計表電子檔條","填妥書面表桃傳真","填妥書面表桃郵寄。"]},{"id":1419,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"有關中央主管機關指定之事業，雇主應每月填載職業災害統計，請問指定之事業是指勞工人數在多少人以上之事業？","options":["30 人","50 人","100 人","300 人。"]},{"id":1420,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"依勞動基準法相關規定，勞工因職業災害死亡，雇主應於幾日內給予其遺屬喪葬費？","options":["3 日","5 日","10 日","15 日。"]},{"id":1421,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"依勞動基準法相關規定，勞工因職業災害死亡，雇主應於幾日內給予其遺屬死亡補償？","options":["3 日","5 日","10 日","15 日。"]},{"id":1422,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"勞工如於職業災害期間不能工作，需請假就醫或治療，其請假期間薪資應如何計算？","options":["不給薪","給全薪","給半薪","給1/3 薪。"]},{"id":1423,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"依勞工職業災害保險及保護法規定，下列何者情形，雇主不得預告終止與職業災害勞工之勞動契約？","options":["職業災害勞工經醫療終止後，經公立醫療機構認定心神喪失或身體殘幡不堪勝任工作者","歇業或重大虧損，報經主管機關核定","事業單位業務緊縮致改組","因天災、事變或其他不可抗力因素，致事業不能繼續經營，報經主管機關核定。"]},{"id":1424,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"勞動場所發生職業災害，災害搶救中第一要務為何？","options":["24 小時內通報勞動檢查機構","搶救罹災勞工迅速送醫","搶救材料減少損失","災害場所持續工作減少損失。"]},{"id":1425,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"職業災害發生槽式中，以某一要素為基源，由此一要素衫生一新要素，此一新要素再衫生另一新要素，各要素分別為次一要素之原因由此等要素間連鎖發展並逐次擴大規槽形成災害，此為下列何種槽式？","options":["聚合型","集中型","褐合型","連鎖型。"]},{"id":1426,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"所謂失能傷害係指損失日數在多少日以上？","options":["3 日","2 日","4 日","1 日。"]},{"id":1427,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"職業災害統計，有關失能傷害之損失日數，不包括下列何者？","options":["受傷當日","受傷後經過之星期日","受傷後經過之休假日","受傷後經過之工廠停工日。"]},{"id":1428,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"有關危害認知之對策，下列敘述何者有誤？","options":["作業前實施風險評估","落實進場前教育訓練","無須使用個人防護具","有效設置安全設施。"]},{"id":1429,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"勞工於2 公尺以上場所作業，未有合規定之工作台或防護網等措施，因此導致之災害， 其原因歟韻為下列何者？","options":["不安全狀態","不安全動作","不注意","無法歟韻。"]},{"id":1430,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"下列何者屬於作業現場的不安全環境或設備？","options":["人員未按標準作業程序工作","施工架未設置護欄","未接受安全衛生教育訓練，致欠缺安全意識","疏忽大意及判擷錯誤。"]},{"id":1431,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"下列何者屬於工作人員的不安全行為或動作？","options":["未佩帶雇主提供之安全帶、安全帽","施工架未設置護欄","施工架板料寬度、強度不足或無防脫活扣","施工架超搭。"]},{"id":1432,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"何種作業較少發生人體墜落災害？","options":["利用高架作業","作業時配戴安全帶","利用合梯作業","地面作業。"]},{"id":1433,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"下列何者為不安全狀態？","options":["錯誤的操作","使安全裝置失效","機械防護措施之缺陷","使用指定外之機械。"]},{"id":1434,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"職業災害調查處理對於設備故障未修理及維修不良之不安全狀態，屬下列何者？","options":["設備之放置、作業場所的缺陷","防護具、服裝等的缺陷","設備本身的缺陷","設備之防護措施的缺陷。"]},{"id":1435,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"當災害發生時，對罹災者施以急救是非常重要的事，為減少人員之傷亡，急救之處置平常應作好的工作下列何者為是？","options":["將單位急救用具放置在闆密地方，以避免人員亂用","預定罹災者送醫的醫療機構","為免造成人員工作上之困擲，可不用定期實行演締","各作業場所配置之急救人員只要有配置就好。"]},{"id":1436,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"下列有關急救的目的，何者為是？","options":["挪救生命","防止病情惡化","使傷患及早獲得治療","以上皆是。"]},{"id":1437,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"下列何者不是急救的目的？","options":["維持呼吸功能","維持血液循環功能","防止傷情惡化","施予治療。"]},{"id":1438,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"下列何者非設立急救人員之主要目的？","options":["災害現場證人","幫助勞工維持生命","急救處理","避免不必要傷亡。"]},{"id":1439,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"事業單位應參照工作場所大小、分布、危險狀況及勞工人數，設置合格急救人員，每 1 琉次應至少 1 人，勞工人數超過50 人者，每增加 50 人應再設置幾人？","options":["1 人","2 人","3 人","4 人。"]},{"id":1440,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"事業單位應參照工作場所大小、分佈、危險狀況及勞工人數，設置合格急救人員，每 1 琉應至少 1 人，某事業單位日琉勞工人數160 人，日琉應設置多少急救人員？","options":["1 人","2 人","3 人","4 人。"]},{"id":1441,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"依勞工健康保護規則規定，急救人員不得有那種身體因素，足以妨礙急救情形？","options":["色盲","心臟病","失聰","高血壓。"]},{"id":1442,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"急救藤品與器材，應置於適當固定處所，至少每幾個月定期檢查並保持清潔？","options":["1 個月","2 個月","3 個月","6 個月。"]},{"id":1443,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"民眾版簡易CPR 口訣為叫叫壓，其主要施作內容不包括下列何者？","options":["胸部按壓","呼救","人工呼吸","檢查意識。"]},{"id":1444,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"急救叫叫 CAB 中的第1 個叫為何者？","options":["進行人工呼吸","求救","確認患者的意識及呼吸","按壓胸部。"]},{"id":1445,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"急救叫叫 CAB 中的第2 個叫為何者？","options":["確認患者意識","暢通呼吸道","胸部按壓","求救。"]},{"id":1446,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"急救叫叫 CAB 中的C 為何者？","options":["確認患者意識","暢通呼吸道","求救","胸部按壓。"]},{"id":1447,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"急救叫叫 CAB 中的A 為何者？","options":["求救","胸部按壓","確認患者意識","暢通呼吸道。"]},{"id":1448,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"急救叫叫 CAB 中的B 為何？","options":["按壓胸部","進行人工呼吸","確認患者的意識及呼吸","求救。"]},{"id":1449,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"下列何者為燒傷急救之口訣？","options":["沖脫泡蓋送","叫叫壓","拉拉壓","快狠準。"]},{"id":1450,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"皮膚燒傷至感覺消失，屬幾級燒傷？","options":["一","二","三","四。"]},{"id":1451,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"中暑死亡率遠高於熱衰竭，下列那者屬於中暑德狀？","options":["臉色蒼白","皮膚表面濕冷","體溫上升到攝氏 38 度","脈搏快而強慢慢轉快而徒。"]},{"id":1452,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"對於發生中暑之勞工最優先的急救方法為下列何者？","options":["儘快有效面溫","原地休息","等待就醫","減輕工作。"]},{"id":1453,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"下列何者非屬休克的可能症狀？","options":["臉色潸紅","自訴寒冷甚至發抖","噁心、嘔吐","呼吸快而淺。"]},{"id":1454,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"骨折急救時下列何者不可充當護木使用？","options":["雨傘","拐杖","衣服","木板。"]},{"id":1455,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"一氧化碳中毒時，不宜採取下列何種措施？","options":["保持患者呼吸道暢通","多給患者保暖","頻詢問患者","儘早給予吸入氧氣。"]},{"id":1456,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"勞工發生一氧化碳中毒時，應立即供給下列何種氣體呼吸？","options":["二氧化碳","氧氣","空氣","稀釋氦氨給予刺激。"]},{"id":1457,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"受傷嚴重部分如以止血帶止血，於送醫途中，應每隔幾分鐘將止血帶鬆開一次，以防止造成傷害？","options":["5 分鐘","10 分鐘","15 分鐘","20 分鐘。"]},{"id":1458,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"為確保安全系統及工作實務被遵守，工作者及作業系統必須被監控，必要時，應實施在職訓練，訓練及指導包含下列何者？","options":["作業活動及現場誘導","在安全作業方法的說明措施","事故、受傷或緊急應變事件的程序","以上皆是。"]},{"id":1459,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"勞工在作業場所有任何墜落危害情形者，應立即報告","options":["朋友","同行人員","現場作業主管","以上皆可。"]},{"id":1460,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"營造業職災死亡人數高達76%以上，根據以往調查統計發現，不安全的環境與不安全的行為，為造成職業安全衛生事故的兩個原因，其中不安全的行為及人為因素佔多少 %？","options":["60","70","80","90。"]},{"id":1461,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"消除不安全的狀況及行為所採4E 政策係指除工程、教育、執行外，遽包括下列何者？","options":["教養","永恆","熱心","宣傳。"]},{"id":1462,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"造成事故的危害因子，除人的因素、物料因素、環境因素外，尚包括下列何種因素？","options":["客戶因素","設備因素","品質因素","成本因素。"]},{"id":1463,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"以不適當的姿勢做重複性的動作，為下列何種危害因子？","options":["化學性","物理性","生物性","人因工程。"]},{"id":1464,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"下列何者最不可能為肌肉骨骼傷害的原因？","options":["過度施力","姿勢不當","無適當的休息","吵雜的環境。"]},{"id":1465,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"坐姿姿勢不良屬於下列何種危害？","options":["化學性","人因工程","物理性","生物性。"]},{"id":1466,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"在提舉重物時，為避免發生人因工程危害，應儘量利用人體之下列何種部位？","options":["背部","腿部","腰部","腹部。"]},{"id":1467,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"下列何者不易造成累積性肌肉骨骼傷害？","options":["重覆性作業","低作業頻率","長時間作業","不自然的姿勢。"]},{"id":1468,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"手腕隧道症候群是手腕之何種組織受傷？","options":["肌肉","骨骼","神經","血管。"]},{"id":1469,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"金屬瀏煙熱之主要症狀與下列何者類似？","options":["感冒","手腕隧道症候群","中暑","鉛中毒。"]},{"id":1470,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"造成金屬瀏煙熱之主要暴露途徐為下列何者？","options":["吸入","首入","皮膚接觸","注屑"]},{"id":1471,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"勞工從事下列何種粉塵作業較易罹患塵肺症？","options":["裝卸麵粉","裝卸塑膠粉","裝卸石茁粉","裝卸糖粉。"]},{"id":1472,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"下列何者較際進入人體肺泡區？","options":["奈米微粒","氧氣","胸腔性微粒","可呼吸性微粒。"]},{"id":1473,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"下列何種微粒可進入到人體肺泡區？","options":["落塵","可吸入性微粒","胸腔性微粒","可呼吸性微粒。"]},{"id":1474,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"通常粒徐小於100nm 之微粒，稱為下列何種微粒？","options":["奈米","微米","毫米","釐米。"]},{"id":1475,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"下列何種作用方式可形成瀏煙？","options":["經由噴霧作用產生","高溫氣態分子冷凝","機械力產生","完全燃燒。"]},{"id":1476,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"氨乙炘焊接時，茂發生回火，應如何緊急處置？","options":["先關乙炘，再關氧氣","以水滅火","兩者一起關","先關氧氣，再關乙炘。"]},{"id":1477,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"依勞工健康保護規則之規定，雇主對於從事特別危害健康之勞工應實施特殊健康，並依規定實施分級健康管理，試問共分為幾級？","options":["2","3","4","5。"]},{"id":1478,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"依勞工健康保護規則規定， "options":["55 個月","50 個月","45 個月","40 個月。"]},{"id":1492,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"依勞動檢查法施行細則規定，勞工發生下列何者情況屬重大職業災害？","options":["發生罹災 1 人之輕傷害","氦洩漏2 人罹災但無需住院","光氣洩漏1 人罹災需住院","發生罹災 2 人需住院。"]},{"id":1493,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"某常日琉勞工上午因工作受傷，中午開始請公傷假24 小時後，隔天下午恢復上琉，則此事故是否為職業災害？","options":["視受傷嚴重度","否","視勞工是否提出申請","是。"]},{"id":1494,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"某常日琉勞工上午因工作受傷，中午開始請公傷假，隔天下午恢復上琉，則損失工作日數為多少日？","options":["2","1","0.5","0。"]},{"id":1495,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"某常日琉勞工上午因工作受傷，中午開始請公傷假24 小時後，隔天下午恢復上琉，則此勞工缺師兩個半天之工資應如何處理？","options":["領兩倍薪","領半薪","不領薪","領全薪。"]},{"id":1496,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"依勞工保險職業災害給付條件統計，下列何者災害韻型較常發生？","options":["墜落","被夾、被捲","感電","火災、爆炸。"]},{"id":1497,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"勞工發生職業災害，雇主應負無過失責任之職業災害補償，另依職業災害勞工保護法之規定，如浮及損害賠償時，過失之舉證責任為下列何者？","options":["雇主","勞工","主管機關","公正第三者。"]},{"id":1498,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"依職業災害勞工保護法之規定，勞工或雇主對於職業病病診斷有異議時，得檢附相關資料向下列何單位申請認定？","options":["直轄市、縣(市)主管機關","中央主管機關","勞動檢查機構","代行檢查機構。"]},{"id":1499,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"政府為保障職業災害勞工之權益，加強職業災害之預防，促進就業安全及經濟發展， 所制定之法律為下列何者？","options":["職業災害勞工保護法","職業安全衛生法","勞動檢查法","勞動基準法。"]},{"id":1500,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"下列何種情況屬於永久部分失能？","options":["損失雙目","損失單目","一隻眼及一隻手臂失去機能","死亡。"]},{"id":1501,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"勞工在一次事故中受傷使雙眼失明是屬下列何者？","options":["輕傷害","暫時全失能","永久部分失能","永久全失能。"]},{"id":1502,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"職業災害統計中對於暫時全失能定義為下列何者？","options":["死亡","部分永久全失能","輕傷害","暫時不能恢復工作 1 日以上。"]},{"id":1503,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"某事業單位有在廠區內提供午餐，故明定如果私自外出午餐出車禍，則不算職業災害。 此規定是否合法？","options":["視是否有經勞保局核准","視是否有向主管機關報備","是","否。"]},{"id":1504,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"4 月 28 日為下列何種紀念日？","options":["工殤日","和平紀念日","國際勞工節","全國減碳日。"]},{"id":1505,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"下列有關職業災害調查必要對象之敘述，何者有誤？","options":["勞動檢查員","作業主管","安全衛生人員","工作場所負責人。"]},{"id":1506,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"勞工由於智力或體力不能配合其現任工作是屬於不安全動作因素中之範圍？","options":["不知","不顧","不能","不理。"]},{"id":1507,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"勞工因工作傷害雙目失明，依國家標準(CNS)其損失日數為多少日？","options":["3000 日","4000 日","5000 日","6000 日。"]},{"id":1508,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"永久全失能之損失天數應以多少天來計算？","options":["6000 日","1000 日","500 日","100 日。"]},{"id":1509,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"傷害損失日數之計算每次應按損失登記？","options":["1000 日","1 日","6000 日","10000 日"]},{"id":1510,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"下列何者非屬職業病病診斷所考量之因素？","options":["勞工薪資","家族病史","危害暴露","時序性。"]},{"id":1511,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"失能傷害頻率公式中之分子為何？","options":["總損失日數","傷害損失日數","總經歷工時","失能傷害次數。"]},{"id":1512,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"失能傷害頻率=FR≤數值之表示方式，取小數點第幾位數？","options":["0","2","1","無規定。"]},{"id":1513,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"失能傷害頻率公式中之分母為何？","options":["總損失日數","傷害損失日數","總經歷工時","失能傷害次數。"]},{"id":1514,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"請問失能傷害頻率公式中， 其分子為失能傷害次數亳以 10 的幾次方？","options":["2","4","5","6。"]},{"id":1515,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"失能傷害頻率(FR)數值之表示方式，取小數點第幾位數？","options":["0","2","1","無規定。"]},{"id":1516,"section":"營造業管理實務｜職業災害調查處理與統計","answer":1,"question":"失能傷害嚴重率公式中之分子為何？","options":["總損失日數","傷害損失日數","總經歷工時","失能傷害次數。"]},{"id":1517,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"失能傷害嚴重率公式中之分母為何？","options":["總損失日數","傷害損失日數","總經歷工時","失能傷害次數。"]},{"id":1518,"section":"營造業管理實務｜職業災害調查處理與統計","answer":4,"question":"失能傷害嚴重率(SR)數值之表示方式，取小數點第幾位數？","options":["3","2","1","取整數。"]},{"id":1519,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"一般而言，失能傷害頻率(FR)與失能傷害嚴重率(SR)之數值相較為","options":["前者較大","後者較大","相同","不一定何者較大。"]},{"id":1520,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"職業災害統計，有關失能傷害頻率計算公式，下列何者正確？","options":["失能傷害人次數亳以 106亳以總經歷工時","失能傷害人次數亳以 106除以總經歷工時","總損失日數亳以 106 亳以總經歷工時","總損失日數亳以 106 除以總經歷工時。."]},{"id":1521,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"下列敘述何者錯誤？","options":["失能傷害頻率=(失能傷害人(次)數×百萬工時)/總經歷工時","失能傷害千人率=(傷害損失日數×百萬工時)/總經歷工時","失能傷害每人次平均損失日數=失能傷害損失總日數/失能傷害人(次)數","失能傷害每人次平均損失日數=失能傷害嚴重率/失能傷害頻率。"]},{"id":1522,"section":"營造業管理實務｜職業災害調查處理與統計","answer":3,"question":"關於事業單位安全的衡量標準，下列敘述何者有誤？","options":["失能傷害頻率定義為每百萬工時所發生之損失事故的件數","傷害嚴重率定義為每百萬工時所損失的工作日數","事業場所的失能傷害頻率與傷害嚴重率關聯性很高，因此傷害嚴重率僅做為參考","每一件嚴重傷害的損失工作日數，係依據傷害程度而有所規定。"]},{"id":1523,"section":"營造業管理實務｜職業災害調查處理與統計","answer":2,"question":"綜合傷害指數之計算公式為何？","options":["失能傷害次數×10⁶／員工全部工時","（失能傷害頻率×失能傷害嚴重率／1000）的平方根","傷害損失天數×10⁶／員工全部工時","失能傷害次數×10⁶／員工全部工時。"]}];
const ABC=['A','B','C','D'];
let session=[],idx=0,answers={},checked={},examMode=false;
const $=s=>document.querySelector(s);
const loadStore=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}};
const saveStore=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hideAll=()=>['home','chapterPage','historyPage','quiz'].forEach(id=>$('#'+id).classList.add('hidden'));
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function goHome(){hideAll();$('#home').classList.remove('hidden');updateStats();window.scrollTo(0,0)}
function updateStats(){const w=loadStore('wrong',[]),h=loadStore('history',[]);$('#totalCount').textContent=QUESTIONS.length.toLocaleString();$('#wrongCount').textContent=w.length;$('#histCount').textContent=h.length;$('#bestScore').textContent=h.length?Math.max(...h.map(x=>x.score))+'%':'—'}
function startRandom(n){begin(shuffle(QUESTIONS).slice(0,n),false)}
function startExam(){begin(shuffle(QUESTIONS).slice(0,50),true)}
function customStart(){let n=parseInt(prompt('請輸入題數（10～200）','100')||'0');if(n>=10&&n<=200)startRandom(n)}
function startWrong(){let ids=loadStore('wrong',[]);if(!ids.length){alert('目前沒有錯題。');return}begin(shuffle(QUESTIONS.filter(q=>ids.includes(q.id))),false)}
function showChapters(){hideAll();$('#chapterPage').classList.remove('hidden');let groups={};QUESTIONS.forEach(q=>groups[q.section]=(groups[q.section]||0)+1);$('#chapterList').innerHTML=Object.entries(groups).map(([s,n])=>`<button class="mode" data-chapter="${esc(s)}"><h3>${esc(s)}</h3><p>${n} 題</p></button>`).join('');document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>startChapter(b.dataset.chapter));window.scrollTo(0,0)}
function startChapter(s){begin(QUESTIONS.filter(q=>q.section===s),false)}
function showHistory(){hideAll();$('#historyPage').classList.remove('hidden');let h=loadStore('history',[]);$('#historyList').innerHTML=h.length?h.slice().reverse().map(x=>`<p><b>${x.score}%</b>　${x.correct} / ${x.total}　${x.date}</p>`).join(''):'尚無測驗紀錄。'}
function begin(list,exam){session=list;idx=0;answers={};checked={};examMode=exam;hideAll();$('#quiz').classList.remove('hidden');render();window.scrollTo(0,0)}
function render(){if(!session.length)return goHome();const q=session[idx],total=session.length,pct=Math.round((idx+1)/total*100);$('#counter').textContent=`第 ${idx+1} 題 / 共 ${total} 題`;$('#pct').textContent=pct+'%';$('#bar').style.width=pct+'%';$('#chapter').textContent=q.section;$('#qtext').textContent=q.question;let selected=answers[q.id],isChecked=checked[q.id];$('#choices').innerHTML=q.options.map((o,i)=>{let cls='choice';if(selected===i+1)cls+=' selected';if(isChecked&&!examMode){if(i+1===q.answer)cls+=' correct';else if(selected===i+1)cls+=' wrong'}return `<button class="${cls}" onclick="pick(${i+1})" ${isChecked&&!examMode?'disabled':''}><span class="radio"></span><span><b>(${ABC[i]})</b> ${esc(o)}</span></button>`}).join('');const fb=$('#feedback');fb.className='feedback';fb.textContent='';if(isChecked&&!examMode)showFeedback();$('#confirmBtn').textContent=isChecked&&!examMode?(idx===total-1?'完成測驗':'下一題'):(examMode&&idx===total-1?'交卷':'確認答案');$('#answerCard').innerHTML=session.map((qq,i)=>`<button class="${answers[qq.id]?'done':''} ${i===idx?'now':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('')}
function pick(v){const q=session[idx];if(checked[q.id]&&!examMode)return;answers[q.id]=v;render()}
function confirmAnswer(){const q=session[idx];if(checked[q.id]&&!examMode){if(idx<session.length-1){idx++;render();window.scrollTo(0,0)}else finish();return}if(!answers[q.id]){alert('請先選擇答案。');return}checked[q.id]=true;if(!examMode){updateWrong(q);render()}if(examMode){if(idx<session.length-1){idx++;render();window.scrollTo(0,0)}else finish()}}
function showFeedback(){const q=session[idx],ok=answers[q.id]===q.answer,fb=$('#feedback');fb.className='feedback '+(ok?'ok':'bad');fb.innerHTML=ok?`✓ 答對了。正確答案：(${ABC[q.answer-1]})`:`✕ 答錯了。正確答案：(${ABC[q.answer-1]}) ${esc(q.options[q.answer-1])}`}
function updateWrong(q){let w=loadStore('wrong',[]),ok=answers[q.id]===q.answer;if(!ok&&!w.includes(q.id))w.push(q.id);if(ok)w=w.filter(x=>x!==q.id);saveStore('wrong',w)}
function prevQ(){if(idx>0){idx--;render();window.scrollTo(0,0)}}
function jumpQ(i){idx=i;render();window.scrollTo(0,0)}
function finish(){if(examMode)session.forEach(q=>updateWrong(q));let correct=session.filter(q=>answers[q.id]===q.answer).length,total=session.length,score=Math.round(correct/total*100);let h=loadStore('history',[]);h.push({date:new Date().toLocaleString('zh-TW'),correct,total,score});saveStore('history',h);alert(`測驗完成！\n答對 ${correct} / ${total} 題\n成績 ${score} 分`);goHome()}
$('#darkBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');updateStats();
</script>

<script id="readingModeScript">
function showReading(){
  document.querySelectorAll('.view').forEach(v=>v.style.display='none');
  const rv=document.getElementById('readingView'); if(rv) rv.style.display='block';
  const sel=document.getElementById('bankSection');
  if(sel && !sel.dataset.ready){
    const secs=[...new Set(QUESTIONS.map(q=>q.section))];
    sel.innerHTML='<option value="">全部章節</option>'+secs.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
    sel.dataset.ready='1';
  }
  renderReading(); window.scrollTo({top:0,behavior:'smooth'});
}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderReading(){
  const box=document.getElementById('bankList'); if(!box)return;
  const kw=(document.getElementById('bankSearch')?.value||'').trim().toLowerCase();
  const sec=document.getElementById('bankSection')?.value||'';
  let arr=QUESTIONS.filter(q=>{
    const blob=[q.id,q.question,...q.options].join(' ').toLowerCase();
    return (!kw||blob.includes(kw))&&(!sec||q.section===sec);
  });
  document.getElementById('bankCount').textContent=`共 ${arr.length.toLocaleString()} 題`;
  box.innerHTML=arr.map(q=>`
    <article style="padding:18px 0;border-top:1px solid #e5e7eb">
      <div style="font-size:13px;color:#368bc1;font-weight:800;margin-bottom:7px">${escapeHtml(q.section||'')}</div>
      <div style="font-size:18px;font-weight:800;line-height:1.65">第 ${q.id} 題　${escapeHtml(q.question)}</div>
      <div style="margin-top:10px;line-height:1.8">${q.options.map((o,i)=>`<div style="${i+1===q.answer?'font-weight:800;color:#16803b':''}">(${String.fromCharCode(65+i)}) ${escapeHtml(o)}${i+1===q.answer?'　✓':''}</div>`).join('')}</div>
    </article>`).join('');
}
</script>

<script id="directNextQuestion">
(function(){
  function scrollQuizTop(){
    const q=document.getElementById('quiz');
    if(!q || q.classList.contains('hidden')) return;
    const top=q.getBoundingClientRect().top+window.pageYOffset-10;
    window.scrollTo({top:Math.max(0,top),behavior:'auto'});
  }

  const oldBegin=window.begin;
  if(typeof oldBegin==='function'){
    window.begin=function(){
      const r=oldBegin.apply(this,arguments);
      setTimeout(scrollQuizTop,0);
      return r;
    };
  }

  const oldConfirm=window.confirmAnswer;
  if(typeof oldConfirm==='function'){
    window.confirmAnswer=function(){
      const before=window.idx;
      const r=oldConfirm.apply(this,arguments);
      setTimeout(()=>{
        if(window.idx!==before || (document.getElementById('quiz') && !document.getElementById('quiz').classList.contains('hidden'))){
          scrollQuizTop();
        }
      },0);
      return r;
    };
  }

  const oldPrev=window.prevQ;
  if(typeof oldPrev==='function'){
    window.prevQ=function(){
      const r=oldPrev.apply(this,arguments);
      setTimeout(scrollQuizTop,0);
      return r;
    };
  }

  const oldJump=window.jumpQ;
  if(typeof oldJump==='function'){
    window.jumpQ=function(){
      const r=oldJump.apply(this,arguments);
      setTimeout(scrollQuizTop,0);
      return r;
    };
  }
})();
</script>
