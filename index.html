<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e86c1">
<title>營造業甲種職業安全衛生業務主管線上題庫</title>
<style>
:root{--blue:#2e86c1;--blue2:#1f78b4;--bg:#f4f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#dce4ee;--soft:#eaf4fb;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 22px 24px}
.header-inner{max-width:860px;margin:auto}
.brand-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.brand{font-size:clamp(24px,6vw,38px);font-weight:800;line-height:1.28}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.top-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin-top:24px}
.nav button{border:0;background:transparent;color:#fff;font-weight:700;font-size:18px;padding:6px 0;text-align:left}
.wrap{max-width:860px;margin:auto;padding:26px 18px 70px}
.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
.hero h1{margin:8px 0 14px;font-size:clamp(32px,8vw,54px);line-height:1.13}
.kicker{color:var(--blue);font-weight:800;font-size:20px}
.hero p{font-size:18px;line-height:1.8;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.stat b{display:block;font-size:34px;margin-bottom:4px}
.section-title{font-size:24px;margin:28px 0 14px}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mode{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;text-align:left;min-height:120px}
.mode h3{margin:0 0 8px;font-size:22px}.mode p{margin:0;color:var(--muted);line-height:1.5}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;font-weight:800;font-size:19px}
.progress{height:14px;background:#e3e9f0;border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress>div{height:100%;background:var(--blue);width:0;transition:.25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,32px);box-shadow:0 8px 28px rgba(15,23,42,.06)}
.chapter{display:inline-block;background:var(--soft);color:var(--blue);font-size:19px;font-weight:800;border-radius:14px;padding:10px 14px;margin-bottom:18px}
.qtext{font-size:clamp(27px,6.5vw,40px);font-weight:800;line-height:1.5;margin:0 0 24px;padding-top:20px;border-top:1px solid var(--line);word-break:break-word}
.choice{display:flex;align-items:flex-start;gap:16px;width:100%;border:3px solid #e3e8ef;background:#fff;border-radius:18px;padding:20px 18px;margin:14px 0;text-align:left;color:var(--text);font-size:clamp(21px,5vw,29px);line-height:1.45}
.choice .radio{flex:0 0 38px;width:38px;height:38px;border:4px solid #999;border-radius:50%;display:grid;place-items:center}
.choice.selected{border-color:var(--blue);background:#f2f9fd}.choice.selected .radio::after{content:"";width:18px;height:18px;background:var(--blue);border-radius:50%}
.choice.correct{border-color:var(--ok);background:#effcf3}.choice.wrong{border-color:var(--bad);background:#fff1f2}
.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:14px;margin-top:22px}
.action{border-radius:16px;padding:17px 15px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:21px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.feedback{margin-top:20px;border-radius:16px;padding:18px;font-size:19px;line-height:1.6;display:none}
.feedback.ok{display:block;background:#ecfdf3;color:#166534}.feedback.bad{display:block;background:#fff1f2;color:#991b1b}
.answer-card{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.answer-card button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px}
.answer-card button.done{background:#dbeafe;border-color:#93c5fd}.answer-card button.now{outline:3px solid var(--blue)}
.footer-note{margin-top:28px;color:var(--muted);font-size:14px;line-height:1.6}
.hidden{display:none!important}
body.dark{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#cbd5e1;--line:#334155;--soft:#172554}
body.dark .hero,body.dark .stat,body.dark .mode,body.dark .choice,body.dark .action,body.dark .answer-card button{background:#111827;color:#f8fafc}
body.dark .choice.selected{background:#10243a}
@media(max-width:620px){.nav{grid-template-columns:repeat(2,1fr)}.brand-row{display:block}.top-actions{justify-content:flex-start;margin-top:16px}.mode-grid{grid-template-columns:1fr}.wrap{padding-left:14px;padding-right:14px}}
</style>

<style id="legalStyles">
.legal-footer{max-width:980px;margin:24px auto 40px;padding:18px 20px;border-top:1px solid #dfe5ec;color:#64748b;font-size:14px;line-height:1.8;text-align:center}
.legal-footer .legal-links{display:flex;justify-content:center;gap:8px 18px;flex-wrap:wrap;margin-bottom:8px}
.legal-footer button{border:0;background:transparent;color:#2563eb;font:inherit;font-weight:700;padding:3px;cursor:pointer}
.legal-footer .mini{font-size:12px;color:#94a3b8}
.legal-modal{position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.legal-modal.show{display:flex}
.legal-box{width:min(720px,100%);max-height:82vh;overflow:auto;background:#fff;color:#1e293b;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.legal-box h2{margin:0 0 14px;font-size:24px;color:#0f172a}
.legal-box h3{margin:20px 0 6px;font-size:17px;color:#1d4ed8}
.legal-box p{margin:6px 0;line-height:1.8}
.legal-box ul{padding-left:22px;line-height:1.8}
.legal-close{float:right;border:0;border-radius:10px;background:#eef2ff;color:#1d4ed8;font-size:18px;padding:7px 11px;cursor:pointer}
body.dark .legal-footer{border-color:#334155;color:#94a3b8}
body.dark .legal-box{background:#172033;color:#e2e8f0}
body.dark .legal-box h2{color:#f8fafc}
body.dark .legal-box h3{color:#93c5fd}
</style>



<style id="compactTypography">
/* 整體字級調整：手機閱讀更接近參考網站，不再過度放大 */
body{font-size:15px}
.header{padding:calc(15px + env(safe-area-inset-top)) 18px 17px}
.header-inner,.wrap{max-width:820px}
.brand{font-size:clamp(20px,4.8vw,30px);line-height:1.25}
.top-btn{font-size:14px;padding:8px 11px;border-radius:11px}
.nav{gap:8px 16px;margin-top:17px}
.nav button{font-size:15px;padding:5px 0}
.wrap{padding:18px 14px 56px}
.hero{border-radius:18px;padding:19px}
.hero h1{font-size:clamp(27px,6.4vw,42px);margin:6px 0 10px}
.kicker{font-size:16px}
.hero p{font-size:15px;line-height:1.65}
.stats{gap:10px;margin:13px 0}
.stat{border-radius:15px;padding:15px}
.stat b{font-size:27px}
.section-title{font-size:20px;margin:22px 0 11px}
.mode-grid{gap:10px}
.mode{border-radius:16px;padding:16px;min-height:96px}
.mode h3{font-size:18px;margin-bottom:6px}
.mode p{font-size:14px}
.quiz-top{font-size:15px;margin-bottom:8px}
.progress{height:10px;margin-bottom:15px}
.card{border-radius:18px;padding:clamp(16px,4vw,23px)}
.chapter{font-size:14px;padding:7px 10px;border-radius:10px;margin-bottom:13px}
.qtext{font-size:clamp(21px,5vw,29px);line-height:1.5;margin-bottom:17px;padding-top:14px}
.choice{gap:12px;border-width:2px;border-radius:14px;padding:15px 14px;margin:10px 0;font-size:clamp(17px,4.1vw,21px);line-height:1.48}
.choice .radio{flex-basis:29px;width:29px;height:29px;border-width:3px}
.choice.selected .radio::after{width:13px;height:13px}
.actions{gap:10px;margin-top:16px}
.action{border-radius:13px;padding:13px 11px;font-size:17px}
.feedback{margin-top:14px;border-radius:13px;padding:13px;font-size:16px}
.answer-card{gap:6px;margin-top:14px}
.answer-card button{font-size:13px;padding:8px 3px}
.quiz-secondary{margin-top:18px;padding:15px 2px 0;border-top:1px solid var(--line)}
.quiz-secondary-title{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:9px}
.quiz-secondary-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quiz-secondary-actions button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 8px;font-size:14px;font-weight:700}
.legal-footer{font-size:12px}
@media(max-width:620px){
  .header{padding-left:14px;padding-right:14px}
  .top-actions{margin-top:11px}
  .nav{grid-template-columns:repeat(2,1fr);margin-top:13px}
  .wrap{padding-left:11px;padding-right:11px}
  .qtext{font-size:22px}
  .choice{font-size:17px}
}
</style>

</head>
<body>
<header class="header">
<div class="header-inner">
<div class="brand-row">
<div class="brand">甲種職業安全衛生<br>業務主管線上題庫</div>
<div class="top-actions">
<button class="top-btn" id="darkBtn">🌙 深色模式</button>
<button class="top-btn" onclick="goHome()">⌂ 回首頁</button>
</div>
</div>
<nav class="nav">
<button onclick="startRandom(20)">快速20題</button>
<button onclick="startRandom(50)">隨機50題</button>
<button onclick="showChapters()">章節練習</button>
<button onclick="startExam()">考場模式</button>
<button onclick="startWrong()">錯題複習</button>
<button onclick="showHistory()">我的成績</button>
<button onclick="showReading()">閱讀模式</button><button onclick="goHome()">題庫首頁</button>
</nav>
</div>
</header>
<main class="wrap">
<section id="home">
<div class="hero">
<div class="kicker">營造業｜甲種職業安全衛生業務主管</div>
<h1>甲種職業安全衛生<br>業務主管線上題庫</h1>
<p></p>
</div>
<div class="stats">
<div class="stat"><b id="totalCount"></b><span>題庫總題數</span></div>
<div class="stat"><b id="wrongCount">0</b><span>目前錯題本</span></div>
<div class="stat"><b id="histCount">0</b><span>歷史測驗次數</span></div>
<div class="stat"><b id="bestScore">—</b><span>歷史最佳成績</span></div>
</div>
<h2 class="section-title">開始練習</h2>
<div class="mode-grid">
<button class="mode" onclick="startRandom(20)"><h3>⚡ 快速練習 20 題</h3><p>隨機抽題，答完立即看正確答案。</p></button>
<button class="mode" onclick="startRandom(50)"><h3>🎯 隨機測驗 50 題</h3><p>完整作答與計分。</p></button>
<button class="mode" onclick="showChapters()"><h3>📚 章節練習</h3><p>依原題庫章節分類選題。</p></button>
<button class="mode" onclick="startExam()"><h3>⏱️ 考場模式</h3><p>50題、不立即顯示答案，最後統一計分。</p></button>
<button class="mode" onclick="startWrong()"><h3>📝 錯題複習</h3><p>只練曾經答錯的題目。</p></button>
<button class="mode" onclick="customStart()"><h3>🔢 自訂題數</h3><p>自訂 10～200 題。</p></button>
</div>
<div class="footer-note"></div>
</section>
<section id="chapterPage" class="hidden"><div class="card"><h2>選擇章節</h2><div id="chapterList" class="mode-grid"></div></div></section>
<section id="historyPage" class="hidden"><div class="card"><h2>我的成績</h2><div id="historyList"></div></div></section>
<section id="quiz" class="hidden">
<div class="quiz-top"><span id="counter"></span><span id="pct"></span></div>
<div class="progress"><div id="bar"></div></div>
<div class="card">
<div class="chapter" id="chapter"></div>
<div class="qtext" id="qtext"></div>
<div id="choices"></div>
<div id="feedback" class="feedback"></div>
<div class="actions">
<button class="action" onclick="prevQ()">上一題</button>
<button class="action primary" id="confirmBtn" onclick="confirmAnswer()">確認答案</button>
</div>
<div class="answer-card" id="answerCard"></div>
</div>
<div class="quiz-secondary">
  <div class="quiz-secondary-title">其他學習方式</div>
  <div class="quiz-secondary-actions">
    <button onclick="showReading()">📖 閱讀模式</button>
    <button onclick="showChapters()">📚 章節練習</button>
    <button onclick="startWrong()">📝 錯題複習</button>
    <button onclick="showHistory()">📊 我的成績</button>
  </div>
</div>
</section>

<section id="readingView" class="view" style="display:none">
  <div class="card">
    <div class="chapter-pill">📖 完整題庫閱讀模式</div>
    <h2 style="margin-top:18px">題庫總覽</h2>
    <p style="color:var(--muted,#64748b)">可依題號、題目文字或選項搜尋，並依章節篩選；適合逐題背誦與查找。</p>
    <div style="display:grid;grid-template-columns:1fr;gap:10px;margin:16px 0">
      <input id="bankSearch" oninput="renderReading()" placeholder="搜尋題號、題目或選項…" style="width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #dbe3ec;border-radius:12px;font-size:16px">
      <select id="bankSection" onchange="renderReading()" style="width:100%;padding:14px 16px;border:1px solid #dbe3ec;border-radius:12px;font-size:16px;background:var(--card,#fff)"></select>
    </div>
    <div id="bankCount" style="font-weight:700;margin:8px 0 16px"></div>
    <div id="bankList"></div>
  </div>
</section>

</main>
<script>
const QUESTIONS=[{"id":1,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"下列何者非安全衛生運動設計的理念？","options":["尊重生命","關懷安全","保障勞工生命安全與健康","雇主的利益。"]},{"id":2,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"下列何者非有效溝通的基本原則？","options":["設身處地","心胸開放","就事論事","固執己見。"]},{"id":3,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"安全溝通的特色中，以下何者為非？","options":["強制性","專業性","正確性","一致性。"]},{"id":4,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"在進行溝通前，必須先有一個目的？","options":["方法","目的","對象","程序。"]},{"id":5,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"下列何者為發揮安全衛生之功能的主要關鍵？","options":["建立安全衛生管理計畫","研議安全衛生教育訓練計畫","良好溝通與協調","研議各項安全衛生提條。"]},{"id":6,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"溝通協調可以活化安全教育成效，比諸堂上的講授更具功效，下列何者不為溝通協調之主要目的？","options":["安全協調","安全接受","安全會議","安全器材。"]},{"id":7,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"在溝通過程中，我俺要把訊息傳送給他人，不但要透過不同的管道，也要經由編碼與解碼的過程，所以在傳送上茂有下列何種情況，則會有溝通障礙的產生？","options":["環境干擾","距離較近","組織不大","工具靈活。"]},{"id":8,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"安全衛生教育訓練之時機，與下列何者無關？","options":["薪資調整時","組織或職掌有變更時","士氣低落意外事故頻傳時","承辦業務或推行新工作時。"]},{"id":9,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"人性化管理組織注重隨時設身處地笆在對方立場思考問題，而不是嚴守本身立場，所以大家宸易溝通，此種為下列何種溝通方式？","options":["威權式","同理心","指揮式","高壓式。"]},{"id":10,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"下列情況哦一種最宸易表現敬業精神？","options":["自己喜歡又能勝任","喜歡但不勝任","勝任卻不喜歡","不喜歡又不勝任之工作。"]},{"id":11,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"溝通的最高境界就要善於傾聽，表達尊重瞭解對方給予溫暖的接受，也就是隨時地善用下列何者使之發揮於無形？","options":["忌妒心","平常心","同理心","批評心。"]},{"id":12,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"事業單位之勞工將事業單位的資料、圖表攜出給他人時，是犯下刑法下之何種罪？","options":["竊盜罪","侵占罪","背信罪","工商秘密罪。"]},{"id":13,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"組織問題發生衛突，導火緣往往是由於下列何種不良情況引發的？","options":["傳達與溝通","溝通與協調","協調與態度","傳達與協調。"]},{"id":14,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"有高度專業知能而缺乏工作倫理和責任感，對事業單位的長久經營而言，其影響為下列何者？","options":["正數","負數","加成作用","無關因數。"]},{"id":15,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"與人相處發生衛突時，宜採取下列何者措施？","options":["要求別人尊重自己的意見和感受","提出砷嚨性的批評","思考各種解決方式","惡言相向、提高聲勢。"]},{"id":16,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"服從事業單位所制定之安全規範，以維護工作安全，避免意外事件之發生為下列何者？","options":["敬業","協同","守紀","服務。"]},{"id":17,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"下列何者為組織中最會影響溝通的效果？","options":["刻板印象","知覺差異","文化差異","身分差異。"]},{"id":18,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"勞工的安全行為通過何種影響，其結果是知道危險，並不代表會去避開危險？","options":["組織氣候","組織技巧","組織管理","組織文化。"]},{"id":19,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"勞工不冤職，完整履行勞動契約，契約結束時業務要移交清楚，契約結束後不與原雇主做營業之競爭，是屬下列何者？","options":["忠誠","誠信","敬業","守紀。"]},{"id":20,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"需要的物品要能很快的捎到，是指5S 中之下列何者？","options":["整頓","整理","清掃","清潔。"]},{"id":21,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"下列何者非5S？","options":["整頓","整理","安全","教養。"]},{"id":22,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"將要與不要的物品加以區分，不要的加以清除，是指5S 中之哦一項？","options":["整理","整頓","清掃","清潔。"]},{"id":23,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"安全衛生工作能否落實有效籀乎於？","options":["政府法規是否訂定完整","勞動檢查人員是否確實執行檢查","企業是否有正確的安全衛生理念","勞工是否在乎安全的工作環境。"]},{"id":24,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"對於安全檢查應如何確保成效？","options":["存檔備查","虛應一番","向下責緹","發現缺失後，確實執行改善。"]},{"id":25,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"組織內部的安全衛生工作要推動，要落實安全衛生管理事項，須有賴於？","options":["命令的發布","規定的宣布","協調與溝通","拜託員工遵守規定。"]},{"id":26,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"工作帶來在專業知識、技術、實務經驗及個人能力等的增進，並因而帶來身分與地位的提昇，成長越多，所獲得之肯定也會如何？","options":["不變","愈小","不一定","愈大。"]},{"id":27,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"在組織中，那種不是心理或行為所引起協調與溝通不良的原因？","options":["刻板印象","文化差異","飲首差異","知覺差異。"]},{"id":28,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"如果一個人在其負責的區域看見紙屑會撿起來，這是廠場整潔教導或管理的成功；但如果任何人在任何區域看見紙屑會撿起來，此種現象為下列何者所形成？","options":["安全衛生文化","安全衛生檢查","安全衛生計畫","安全衛生組織。"]},{"id":29,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"溝通的過程槽式之流程包含 a.解碼b.編碼c.管道d.接收者e.傳送者，其正確的流程排列為下列何者？","options":["d-c-a-b-e","b-e-c-a-d","e-c-b-a-d","e-b-c-a-d。"]},{"id":30,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"安全衛生政策是安全衛生工作的最高書面指導原則，一般而言，安全政策由下列何者擬訂、簽署並頒發？","options":["事業經營負責人","職業安全衛生業務主管","職業安全衛生管理師 (員)","現場監督、管理、指揮主管。"]},{"id":31,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"由於勞動者的「勞心」與「勞力」，造就成有形或無形的功業，改善了人類的生活，所以勞動環境的本質是以下列何者為中心？","options":["人","事","時","地。"]},{"id":32,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"下列何者構成組織溝通協調之阻力？","options":["高階主管的支持與認同","相似的資源、目標及需要","利益大於成本","專業訓練互異，缺乏共同語言。"]},{"id":33,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"下列何者因素不致造成組織的衛突？","options":["異議","共譜","對立","障礙。"]},{"id":34,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"部屬對上司的溝通屬於下列何種情況？","options":["角色地位不同","用小人之心，度君子之腹","利益衛突","主觀猜測。"]},{"id":35,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"口語、文字、態度、觀念或習慣等認知差異均造成影響溝通的因素，下列何者屬口語因素？","options":["話不投機半句多","道不同，不相為謀","臭氣相投","井水不犯河水。"]},{"id":36,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"下列何者非組織衛突之起因？","options":["資源分配平均","職掌、權責等不明磅","權力與利益遭受瓜分","溝通不良。"]},{"id":37,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"工地實施人員進場管制，依公司規定應管制事項應有哦些？","options":["勞工安全衛生教育訓練","勞工應加入勞工保險","勞工進場前應簽署工作環境危害告知單","以上皆是。"]},{"id":38,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"下列何者為成員共享的安全價值，信念與規範，表德於個人及組織的行動與態度、政策及程序等過程，強調成員共享的安全知覺？","options":["職業災害調查","職業災害防止計畫","自動檢查計畫","安全文化。"]},{"id":39,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"有關臺灣職業安全衛生管理系統指引中之組織設計，主要項目不包括下列何者？","options":["文件化","能力與訓練","目標","溝通。"]},{"id":40,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"下列何者不屬於雙向溝通之條件？","options":["謙迦","傾聽","主觀","瞭解。"]},{"id":41,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"依職業安全衛生管理辦法風險分韻，建築工程業屬第幾韻事業？","options":["第一類事業","第二類事業","第三類事業","未分韻事業。"]},{"id":42,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"下列何者非勞工義務？","options":["接受健康檢查","接受安全衛生教育訓練","提供安全衛生設備及措施","遵守工作守則。"]},{"id":43,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"組織中之安全溝通與協調方式，下列何者不是有效的溝通原則？","options":["就事論事不攻訐別人","設身處地運用同理心","以統御命令式口氣指導","心胸開放不預設立場。"]},{"id":44,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"下列何者非安全溝通之目的？","options":["提供安全資訊","主張個人安全看法","達成安全意識","提高安全績效。"]},{"id":45,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"上包商參與工程競標時，為壓低標價或便宜行事，往往將安全衛生經費的編列計算方式？","options":["轉嫁下包商分攤","量化計量計價","一式計價","自行吸收。"]},{"id":46,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"職業道德必須具備下列何者行為？","options":["利己性","唯物性","合法性","機會性。"]},{"id":47,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"對於安全檢查應如何確保成效？","options":["存檔備查","虛應一番","向下責緹","發現缺失後，確實改善。"]},{"id":48,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"職業災害發生時，對企業的影響可分為有形的及無形的，下列何者為無形的？","options":["財產損失","公共形象損失","雜項損失","醫療損失。"]},{"id":49,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"有立即發生危險之虞，工作場所負責人下令停止作業，並讓勞工退避安全場所屬？","options":["強制性溝通協調","權威式溝通協調","專業性溝通協調","支持性溝通協調。"]},{"id":50,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"營造工程寫寫轉包中，安全衛生設施及其經費常未列入考量，一般營造廠常常會認為增加？","options":["直接成本","無形成本","營業利潰","間接成本。"]},{"id":51,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"事業單位均須遵守職業安全衛生法令，可以強制員工參加教育訓練是屬？","options":["強制性","權威性","專業性","支持性。"]},{"id":52,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"下列何項不屬安全衛生協調與溝通的特色？","options":["分歧性","強制性","權威性","專業性。"]},{"id":53,"section":"法規與通識｜企業經營風險與安全衛生","answer":1,"question":"逢迎方式，試著取悖別人或似向人道歉，但有感受不到真心，誠意稱為？","options":["討好型","責備型","打岔型","電腦型。"]},{"id":54,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"有效協調與溝通的基礎中，最好的溝通方式是？","options":["自言自語","交叉式溝通","互補式溝通","良好的互補式溝通。"]},{"id":55,"section":"法規與通識｜企業經營風險與安全衛生","answer":3,"question":"亞伯拉罕.馬斯洛(Abraham Maslow)的需求寫理論包括A.尊嚴需求 B.安全需求 C.自我實現需求 D. 生理需求 E. 愛的需求， 其需求由低到高( 下而上 ) 順序為何？","options":["BDAEC","DBAEC","DBEAC","CEABD。"]},{"id":56,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"危害控制優先順序，下列何者正確？","options":["工程改善→消除→行政管理","消除→取代→隔離 →行政管理","消除→使用防護具→行政管理","使用防護具→重新設計→行政管理。"]},{"id":57,"section":"法規與通識｜企業經營風險與安全衛生","answer":2,"question":"消除或面低危害最優先考慮的方法，為下列何者？","options":["健康管理","工程改善","教育訓練","使用防護具。"]},{"id":58,"section":"法規與通識｜企業經營風險與安全衛生","answer":4,"question":"風險管理之順序，下列何者正確？","options":["風險評估→風險控制→危害辨識","風險控制→危害辨識→風險評估","危害辨識→風險控制→風險評估","危害辨識→風險評估→風險控制。"]},{"id":59,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何種法規之制定與修正，需經立法院三讀通過？","options":["機械器具型式檢定實施辦法","起重升面機具安全規則","職業安全衛生法","營造安全衛生設施標準。"]},{"id":60,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"職業安全衛生法係由下列何者公布？","options":["總統","行政院","立法院","行政院勞動部。"]},{"id":61,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者非主管機關？","options":["勞動部","直轄市政府","縣市政府","職業安全衛生中心。"]},{"id":62,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"職業安全衛生法之立法意旨為保障工作者安全與健康，防止下列何種災害？","options":["職業災害","交通災害","公共災害","天然災害。"]},{"id":63,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列哦一項不是職業安全衛生法的立法目的？","options":["防止職業災害","保障工作者安全","保障工作者健康","規定勞動條件最低標準。"]},{"id":64,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"職業安全衛生法以調的責任為主，保障工作者安全與健康之義務？","options":["雇主及工作場所負責人","工地主任","作業主管","職業安全衛生管理員。"]},{"id":65,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法令，「工作場所負責人」負責為","options":["共同作業時指揮及協調工作","立即危險時下令退避","相關承攬事業間勞工安全衛生教育之協助與指導","以上皆是。"]},{"id":66,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"有關職業安全衛生法適用範圍之敘述，下列為何正確？","options":["適用各業","僅適用於製造業","不適用於服務業","沒有特定適用對象。"]},{"id":67,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列有關職業安全衛生法規之敘述何者正確？","options":["勞工保險條例之主管機關已配合全民健康保險之開辦，移由衛生福利部主管","工作場所建築物應依建築法規及職業安全衛生法規之相關規定設計","為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展，特訂定職業安全衛生法","危險性工作場所審查及檢查辦法係依職業安全衛生法訂定。"]},{"id":68,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生法之規定，僱用勞工從事工作之機構稱為下列何者？","options":["企業","公司","事業單位","工廠。"]},{"id":69,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"所謂「工作者」指","options":["勞工","自營作業者","其他受工作場所負責人指揮或監督從事勞動之人","以上皆是。"]},{"id":70,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"獨立從事勞動或技藝工作，獲致報酬，且未僱用有酬人員幫同工作者，稱為？","options":["勞工","技工","自營作業者","雇主。"]},{"id":71,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"受僱從事工作獲致工資者，稱為？","options":["自營作業者","勞工","工作者","雇主。"]},{"id":72,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"職業安全衛生法之中央主管機關為下列何者？","options":["內政部","行政院國家永續發展委員會","勞動部","衛生福利部。"]},{"id":73,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法規定，工程之設計或施工者，應於設計施工規劃階段實施何者，致力防止工程施工時，發生職業災害？","options":["風險評估","危害之告知","風險控制","作業環境監測。"]},{"id":74,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定，所謂合理可行範圍，包括下列何者？","options":["安全衛生法令、指引","一般社會通念","雇主明知或可得而知勞工所從事之工作，有致其生命、身體及健康受危害之虞","以上皆是。"]},{"id":75,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生法規定，中央主管機關指定之機械、設備或器具，其構造性、能及防護非符合安全標準者，不得產製運出廠場、輸入或供應，下列何者非指定之對象？","options":["動力衛剪機械","動力堆高機","移動式起重機","防爆電氣設備。"]},{"id":76,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者為中央主管機關指定之機械、設備或器具，其構造、性能及防護非符合安全標準者，不得產製運出廠場、輸入、租賃、供應或設置？","options":["鍋爐","升面機","動力堆高機","電焊機。"]},{"id":77,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法規定，雇主設置下列何種機械應符合中央主管機關所定防護標準？","options":["動力衛剪機械","起重機","升面機","吊籠。"]},{"id":78,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定，對於中央主管機關指定之機械、設備或器具，其構造、性能及防護非符合安全標準者，不得產製運出廠場、輸入、租賃、供應或設置。此規定不適用於下列何者？","options":["製造者","輸入者","供應者","勞工。"]},{"id":79,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定，製造者或輸入者對於中央主管機關公告列入型式驗證之機械、設備或器具，非經中央主管機關認可之下列何者實施型式驗證合格及張貼合格標章，不得產製運出廠場或輸入？","options":["勞動檢查機構","代行檢查機構","作業環境監測機構","驗證機構。"]},{"id":80,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定，製造者或輸入者對於中央主管機關公告列入型式驗證之機械、設備或器具，非經中央主管機關認可之驗證機構實施下列何項措施，不得產製運出廠場或輸入？","options":["熔接檢查","重新檢查","作業環境測定","型式驗證合格及張貼合格標章。"]},{"id":81,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"下列何者非機械防護器具設計時之考慮要黏？","options":["提高產能速度","堅固耍用","不致造成新的危害","便利檢查、調整、維護與潤滑。"]},{"id":82,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依法令規定，勞工執行職務發現有立即發生危險之虞者，得在不危及其他工作者安全情形下，採取何種措施？","options":["自行停止作業及退避至安全場所，並立即向直屬主管報告","立即下令工作場所停工","無須告知主管，並儘速離開工作場所","疾在原地不動， 等待救援。"]},{"id":83,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依照職業安全衛生法規定，勞工執行職務發現有立即發生危險之虞時，得在不危及其他工作者安全情形下，自行停止作業及退避至安全場所，並向何人報告？","options":["檢查員","同事","醫護人員","直屬主管。"]},{"id":84,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"危險性機械或設備不包含下列何項？","options":["人字臂起重桿","高壓氣體特定設備","堆高機","鍋爐。"]},{"id":85,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"高溫作業場所，每日不得超過","options":["4 小時","6 小時","8 小時","10 小時。"]},{"id":86,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"事業單位勞工人數在幾人以上者，應置勞工健康服務人員或委託勞工健康服務專業機構，辦理健康管理、職業病預防及健康促進等勞工健康保護事項？","options":["30 人","40 人","50 人","60 人。"]},{"id":87,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主施行體格檢查，其檢查費用應由下列何者負擔？","options":["勞工","雇主","雇主及勞工各負擔一半","沒有規定。"]},{"id":88,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主僱用勞工時，對實施一般體格檢查，下列何者為非規定之檢查項目？","options":["既往病歷及作業經歷之調查","胸部X 光=大片≤攝彈檢查","血色索及白血球數檢查","心電圖檢查。"]},{"id":89,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"為能依據勞工體能、健康狀況，適當選配勞工於適當之場所作業，雇主於僱用勞工時， 應實施下列何種健康檢查？","options":["一般健康檢查","一般體格檢查","特殊健康檢查","健康追蹤檢查。"]},{"id":90,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何者非屬雇主對在職勞工應實施之健康檢查？","options":["一般健康檢查","體格檢查","特殊健康檢查","特定對象及特定項目之檢查。"]},{"id":91,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者非屬雇主對在職勞工應實施之健康檢查？","options":["一般健康檢查","特殊健康檢查","特定對象及特定項目之健康檢查","癌症篩選。"]},{"id":92,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"雇主對在職勞工應施行健康檢查，而健康檢查費用應由下列何者負擔？","options":["勞工","雇主","雇主及勞工各負擔一半","雇主、勞工與政府均攤。"]},{"id":93,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主對在職勞工應施行健康檢查，其檢查週期為下列何者？","options":["未滿40 歲，5 年一次","40 歲以上，未滿65 歲，3 年一次","65 歲以上，每年一次","以上皆是。"]},{"id":94,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定，雇主應會同下列何者訂定適合其需要之安全衛生工作守則， 報經勞動檢查機構備查後，公告實施？","options":["承攬商","安全衛生顧問公司","醫療機構","勞工代表。"]},{"id":95,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"訂定安全衛生工作守則時，下列敘述何者錯誤？","options":["要有勞工代表會同訂定","訂定後要報經勞動檢查機構備查","屬於雇主責任不可以轉嫁給勞工","只要合理即可不需考慮其可行性。"]},{"id":96,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者非屬安全衛生工作守則之內容？","options":["事業之安全衛生管理及各級之權責","機械、設備或器具之操作規範與作業程序、維護及檢查","環境汙染預防","工作安全衛生標準。"]},{"id":97,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"有關事業單位訂定安全衛生工作守則之規定為何錯誤？","options":["應依職業安全衛生法及有關規定訂定適合其需要","會同勞工代表訂定","應報經地方主管機關備查","報經檢查機構備查後公告實施。"]},{"id":98,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"事業單位僱用勞工多少人以上才需要制定安全衛生工作守則？","options":["1 人","5 人","15 人","30 人。"]},{"id":99,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"事業單位所訂安全衛生工作守則報請勞動檢查機構備查公告實施其效力所及，下列敘述何者正確？","options":["已離職之勞工仍應遵行","效力不及於當初未表同意之勞工","效力及於在職之全體勞工","公告實施後，新受僱之勞工如不同意亦不受拘束。"]},{"id":100,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"僱用勞工從事作業時，於各項職業安全衛生管理措施中，應報請勞動檢查機構備查者為何？","options":["實施勞工體格檢查結果","新僱勞工之安全衛生教育訓練","職業安全衛生管理計畫","安全衛生工作守則。"]},{"id":101,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法施行細則規定，會同訂定安全衛生工作守則及參與實施職業災害調查分析之勞工代表的推派或推選，依優先順序，其第一優先為下列何者？","options":["由工會推派","由全體員工推選","由雇主派任","由勞資會議之勞方代表推選。"]},{"id":102,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生法規定，雇主未提供必要安全衛生設備致發生勞工死亡職業災害，最高可處幾年以下有期徑刑？","options":["1 年","3 年","5 年","7 年。"]},{"id":103,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法規定，勞工如不接受法定之職業安全衛生教育訓練者，可能受到下列何種處分？","options":["處新臺幣3,000 元以下罰鍰","處新臺幣4,000 元以下罰鍰","處新臺幣5,000 元以下罰鍰","處新臺幣6,000 元以下罰鍰。"]},{"id":104,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"勞工不遵守安全衛生工作守則之處罰，由調處罰？","options":["當地檢查機構","雇主","當地主管機關","法院裁決。"]},{"id":105,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"對於吹哨者保護規定，下列敘述何者有誤？","options":["事業單位不得對勞工申訴人終止勞動契約","勞動檢查機構受理勞工申訴必須保密","為實施勞動檢查必要時得告知事業單位有關勞工申訴人身分","任何情況下事業單位都不得有不利勞工申訴人之行為。"]},{"id":106,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"勞動檢查結果通知書送達後，受檢單位如有不服，依訴願法及勞動檢查法規定，下列對於救濟途徐之敘述何者有誤？","options":["可於次日起10 日內以書面迦明理由向勞動檢查機構提出異議","可於該次日起30 日內繕具訴願書經向裁處機關提出訴願","不得分別提起訴願、異議","可同時併提訴願及異議。"]},{"id":107,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"某縣有一事業單位因違反職業安全衛生法規，經當地檢查機構與以罰鍰處分，該單位如有不服，得依法向機關提起訴願？","options":["縣市政府","直轄市政府","勞動部","行政院。"]},{"id":108,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"工作場所有立即發生危險之虞時，雇主或工作場所負責人未即令停止作業，並使勞工退避至安全場所。其罰則為？","options":["處3 年以下有期徑刑、拘役或科或併科新台幣100 萬元以下罰金","處1 年以下有期徑刑、拘役或科或併科新台幣18 萬元以下罰金","處新臺幣3 萬元以上 15 萬元以下罰鍰","處新臺幣3 萬元以上 4 萬元以下罰鍰。"]},{"id":109,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"事業單位與承攬人分別雇用勞工共同作業時，未設置協議組織，處新臺幣多少元罰鍰？","options":["3 萬元以上 30 萬元以下","3 萬元以上 15 萬元以下","3 萬元以上 75 萬元以下","30 萬元以上 300 萬以下。"]},{"id":110,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生法規定，規避，妨礙或拒絕檢查、調查，處新臺幣多少元罰鍰？","options":["3 萬元以上 30 萬元以下","5 萬元以上 300 萬元以下","3 萬元以上 15 萬元以下","30 萬元以上 300 萬以下。"]},{"id":111,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生法規定，經中央主管機關指定具有危險性之機械或設備操作人員，雇主應僱用經中央主管機關認可之訓練或經技能檢定合格之人員充任之，如違反者雇主應受何種處罰？","options":["處新臺幣3 仟元以下罰鍰","處新臺幣5 萬元以上 300 萬元以下罰鍰","處新臺幣3 萬元以上 30 萬元以下罰鍰","處1 年以下有期徑刑、拘役、科或併科新台幣9 萬元以下罰鍰。"]},{"id":112,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"違反職業安全衛生法規定之重大職業災害通報義務，處新臺幣多少元罰鍰？","options":["一年以下有期徑刑、拘役、科或科新台幣9 萬元以下罰金","新台幣3~30 萬元以下罰鍰","新台幣3~15 萬元以下罰鍰","新台幣5~300 萬元以下罰鍰。"]},{"id":113,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生法規定，下列何種情形得處五年以下有期徑刑？","options":["雇主僱用勞工時未施行體格檢查","移動式起重機超過規定使用期間未經再檢查而繼續使用而發生死亡職業災害","未設置安全衛生組織或管理人員","未對勞工施以從事工作必要之安全衛生教育訓練。"]},{"id":114,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法規定，下列何者非屬勞工之義務？","options":["參加工會","接受健康檢查","接受安全衛生教育訓練","遵守安全衛生工作守則。"]},{"id":115,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"勞工不遵守工作守則之處罰，是由何者機關處分？","options":["主管機關","雇主","法院","警察機關。"]},{"id":116,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"實施職業安全衛生檢查的機構為？","options":["勞工局","警察局","勞動檢查機構","勞保局。"]},{"id":117,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"於勞動契約存續中，由雇主所提示，使勞工履行契約提供勞務之場所，為職業安全衛生法所稱之何種場所？","options":["職業場所","工作場所","作業場所","勞動場所。"]},{"id":118,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"勞動場所中，接受雇主或代理雇主指示處理有關勞工事務之人所能支配、管理之場所稱之為何種場所？","options":["作業場所","就業場所","運作場所","工作場所。"]},{"id":119,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"從事特定工作目的之場所，屬於以下何者？","options":["職業場所","工作場所","作業場所","勞動場所。"]},{"id":120,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"工作場所有立即發生危險之虞時，雇主或工作場所負責人應優先採取下列何種處置？","options":["報告檢查機構","報告主管機關","繼續作業","下令停止作業，使其退避安全場所。"]},{"id":121,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法施行細則之規定，事業單位之職業安全衛生管理，由雇主或對事業具有管理權限之雇主代理人綜理，由下列何者負執行之責？","options":["職業安全衛生管理部門主管","職業安全衛生業務主管","人事部門主管","事業各部門主管。"]},{"id":122,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法施行細則第33 條，其所指的「職業安全衛生人員」不包括下列何者？","options":["職業安全衛生管理員","職業安全管理師","職業安全衛生業務主管","施工架組配作業主管。"]},{"id":123,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依危害性化學品標示及通識規則之規定，下列何者非屬危害性化學品應標示之內容？","options":["危害成分","警示語","用途說明","危害警告訊息。"]},{"id":124,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何者非屬職業安全衛生法之附屬法規？","options":["職業安全衛生設施規則","勞工保險被保險人因執行職務而致傷病審查準則","起重升面機具安全規則","有機溶劑中毒預防規則。"]},{"id":125,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法之規定，下列何者為雇主不得使產後未滿一年之女工從事之危險性或有害性工作？","options":["堆高機操作之工作","有害輻射散布場所之作業","噪音作業","鑿岩機及其他有顯著捕動之作業。"]},{"id":126,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法之規定，雇主執行勞工體格檢查、健康檢查，應由中央主管機關會商下列何單位認可之醫療機構之醫師為之？","options":["職業病病鑑定委員會","勞動檢查機構","職業傷病防治中心","中央衛生主管機關。"]},{"id":127,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法之規定，下列何者為雇主不得使妊娣中之女性勞工從事之危險性或有害性工作？","options":["文書作業","噪音作業","電子零件裝配作業","起重機運轉工作。"]},{"id":128,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依女性勞工母性健康保護實施辦法規定，有關母性健康保護措施，下列何者有誤","options":["危害評估與控制","醫師革受指導","風險分級管理","勞工代表參與。"]},{"id":129,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"對於變更管理，下列何者非必要之採行措施？","options":["採取矯正措施","實施風險評估","有關人員應被告知","有關文件資料應一併檢討修正。"]},{"id":130,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依勞工作業環境監測實施辦法之規定，高溫作業場所應每隔多久測定綜合溫度熱指數一次以上？","options":["3 個月","6 個月","1 年","2 年。"]},{"id":131,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依勞工作業環境監測實施辦法之規定，鉛作業之作業場所，應每隔多久測定其濃度一次以上？","options":["1 個月","3 個月","6 個月","1 年。"]},{"id":132,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依勞工作業環境監測實施辦法之規定，特定粉塵作業場所，應每隔多久測定其濃度一次以上？","options":["1 個月","3 個月","6 個月","1 年。"]},{"id":133,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依法令規定，有關職業安全衛生諮詢會之敘述，下迦何者正確？","options":["置委員7 人至 12 人","任期3 年","由中央主管機關召開","各公(協)會團體推派代表組成。"]},{"id":134,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者非屬職業安全衛生法之附屬法規？","options":["職業安全衛生管理辦法","危險性機械及設備安全檢查規則","技術士技能檢定及發證辦法","缺氧症預防規則。"]},{"id":135,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定之特殊危害作業，應減少勞工工作時間，下列何者非屬該作業？","options":["高溫作業","精密作業","高架作業","幡棄物處理作業。"]},{"id":136,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法規定，勞工因職業上原因不能適應原有工作時，雇主應採取之措施， 下列何者有誤？","options":["予以解雇","予以醫療","變更勞工工作場所","縮短其工作時間。"]},{"id":137,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"代表雇主從事管理、指揮或監督勞工從事工作之人員，於職業安全衛生法規中係指何人？","options":["各級業務主管","實際經營負責人","工作場所負責人","安全衛生業務主管。"]},{"id":138,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依勞工作業環境監測實施辦法之定義，指作業期間不超過1 個月，且磅知自該作業終了日起6 個月，不再實施該作業者，為下列何者？","options":["假設性作業","異常性作業","作業期間短暫","非例行性作業。"]},{"id":139,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"職業安全衛生教育訓練規則係依下列何種法規之第32 條規定所訂？","options":["勞動基準法","勞工保險條例","職業安全衛生法","工會法。"]},{"id":140,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生法規定，下列何者非化學品分級管理據以評估健康危害風險等級之項目？","options":["火災爆炸危害等級","使用量","散布狀況","健康危害分韻。"]},{"id":141,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生法規定，事業單位應依其規槽、性質，訂定下列何種管理文件？","options":["職業災害防止計畫","安全衛生管理規章","職業安全衛生管理計畫","損失控管計畫。"]},{"id":142,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生管理辦法規定，雇主應依其事業單位之規槽及下列何者，以訂定職業安全衛生管理計畫？","options":["產品","範圍","行業","性質。"]},{"id":143,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"職業安全衛生管理計畫總共有幾項？","options":["4 項","8 項","15 項","24 項。"]},{"id":144,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生法施行細則規定，職業安全衛生管理計畫內容對下列何者不須實施調查處理及統計分析？","options":["虛驚事件","職業災害","不合格品","影響身心健康事件。"]},{"id":145,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生法施行細則規定，事業單位訂定職業安全衛生管理計畫所應包括之事項，下列何者為非？","options":["虛驚事故統計","個人防護具之管理","營業績效評估","作業環境監測。"]},{"id":146,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依照法令規定，幾人以上之事業單位應訂定職業安全衛生管理計畫？","options":["5 人","30 人","30 人","100 人。"]},{"id":147,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者是訂定職業安全衛生管理計畫，先要磅立的重黏？","options":["計畫項目","計畫期間","計畫目標","基本方針。"]},{"id":148,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"有關職業安全衛生管理計畫之敘述，下列何者正確？","options":["安全衛生目標，應交由專業團體協助訂定","應藐由持續不擷的稽核制度發現問題，並等有經費再行採取糾正措施","計畫之內容應一致，無須考量規槽、性質","須應用規劃、實施、查核及改進等管理手法提升改善。"]},{"id":149,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"事業單位勞工人數在多少人以上，應訂定執行職務遭受不法侵害預防計畫，並據以執行？","options":["100 人","200 人","300 人","400 人。"]},{"id":150,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"雇主為預防勞工於執行職務，因他人行為遭受身體或精神上不法侵害，應採取暫力預防措施，相關執行紀錄應保存多久？","options":["3 年","5 年","7 年","10 年。"]},{"id":151,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依照職業安全衛生法規定，僱用勞工人數達幾人以上，應訂定職場霸凌申訴管道，並在工作場所公開揭示？","options":["5 人","10 人","30 人","100 人。"]},{"id":152,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"雇主對於職場霸凌事件之調查或協調，應秉持客觀、公正、公平原則；於調查時，除給予當事人充分陳述意見及答辯機會外，並應遵守利益迴避規定。雇主僱用勞工人數達100 人以上者，應組成調查小組；其調查小組外聘成員比例不得少於？","options":["1/2 人","1/3","1/4","1/5。"]},{"id":153,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"勞工遭受職場霸凌，應向雇主提起申訴。但被申訴人為最高負責人時，得逕向何者提起申訴？","options":["直轄市或縣=市≤主管機關","中央主管機關","勞動檢查機構","警察局。"]},{"id":154,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"最高負責人經認定有職場霸凌之行為者，處新臺幣多少錢？","options":["1 萬元以上，100 萬元以下罰鍰","5 萬元以上，75 萬元以下罰鍰","3 萬元以上，300 萬元以下罰鍰","100 萬元以上，300 萬元以下罰鍰。 職業安全衛生管理辦法"]},{"id":155,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"有關職業安全衛生委員會應置委員幾人以上？","options":["4 人","5 人","6 人","7 人。"]},{"id":156,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"職業安全衛生委員會之委員中由工會推派或勞工推選之代表應佔委員人數之多少以上？","options":["四分之一","二分之一","三分之一","五分之一。"]},{"id":157,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，職業安全衛生委員會應每幾個月舉行會議1 次？","options":["1","2","3","4。"]},{"id":158,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，事業單位達到那些規定以上者應設職業安全衛生管理單位？","options":["第一類事業之事業單位勞工人數200 人","第一類事業之事業單位勞工人數 100 人","第二類事業之事業單位勞工人數200 人","第二類事業之事業單位勞工人數 100 人。"]},{"id":159,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，對於僅須置職業安全衛生業務主管，而不須置職業安全管理師、職業衛生管理師及職業安全衛生管理員的事業單位，則該業務主管之負責為何？","options":["督導安全衛生管理事項","協調及建議安全衛生管理事項","規劃及推動安全衛生管理事項","寬議及主管安全衛生管理事項。"]},{"id":160,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，對於置有職業安全衛生管理員、職業安全管理師或職業衛生管理師的事業單位，其職業安全衛生業務主管之主要負責為何？","options":["擬訂安全衛生管理事項","寬議安全衛生事項","督導安全衛生管理事項","協調安全衛生事項。"]},{"id":161,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"各級主管之負責為何？","options":["依負責指揮、監督所屬執行安全衛生管理事項，並協調及指導有關人員實施","擬訂、規劃及推動安全衛生管理事項，並指導有關部門實施","對雇主擬訂之安全衛生政策提出建議，並寬議、協調及建議安全衛生相關事項","以上皆是。"]},{"id":162,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"下列針對職業安全衛生組織、人員、工作場所負責人及各級主管之負責之敘述，何者正確？","options":["職業安全衛生管理單位為擬訂、規劃、督導及推動安全衛生管理事項，並指導有關部門實施","職業安全衛生委員依職權指揮、監督所屬執行安全衛生管理事項， 並協調及指導有關人員實施","職業安全=衛生≤管理師、職業安全衛生管理員為針對雇主擬訂之安全衛生政策提出建議，並寬議、協調及建議安全衛生相關事項","工作場所負責人及各級主管負責為擬訂之安全衛生政策提出建議，並寬議、協調及建議安全衛生相關事項。"]},{"id":163,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"自動檢查計畫之內容包括那些？","options":["對象、項目","時間、方法","單位及人員、經費","以上皆是。"]},{"id":164,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何種不是自動檢查之種韻？","options":["機械設備之作業檢點","設備之重新檢查","機械之定期檢查","設備之重點檢查。"]},{"id":165,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何種不是自動檢查之種韻？","options":["機械、設備之重點檢查","機械、設備之不定期檢查","機械、設備之作業檢點","作業檢點。"]},{"id":166,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"事業單位各部門提出之自動檢查執行計畫係由下列何者彙整？","options":["雇主","職業安全衛生人員","勞工代表","人事主管。"]},{"id":167,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依規定實施之定期檢查，重點檢查應記錄事項，除檢查年月日、方法、部分外有","options":["檢查結果","實施檢查者姓名","依檢查結果應採取改善措施之內容","以上皆是。"]},{"id":168,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"雇主對營建工程施工架設備、支撐架設備、露天開挖擋土支撐設備等，應於多久檢點該設備有無異常或變形？","options":["每日作業前及使用終了後","每週","每月","每年。"]},{"id":169,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"雇主對於施工架之構築，應多久定期檢查一次？","options":["每日","每週","每月","每年。"]},{"id":170,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主對營造工程之施工架，每週應就下列那些事項定期實施檢查一次？","options":["架材之損傷、安裝狀況","基腳之下沈及滑動狀況","立柱、踢腳殊、橫檔等之損傷狀況","以上皆是。"]},{"id":171,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"雇主對使用中之施工架應實施檢查，依職業安全衛生法令規定，下列何者有誤？","options":["每次停工之復工前亦應實施檢查","每當惡劣氣候侵襲後應實施檢查","至少應每月檢查 1 次","應由極富經驗之工程人員事前依營造安全衛生設施標準及其他安全規定檢查後，始得使用。"]},{"id":172,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"安全衛生管理之執行，應疾存紀錄備查，並保存紀錄幾年？","options":["1 年","2 年","3 年","5 年。"]},{"id":173,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"事業單位應僱用多少勞工以上才要實施自動檢查？","options":["100 人以上","50 人以上","30 人以上","無規定。"]},{"id":174,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"雇主僱用勞工人數在 100 人以上者，應設置何種職業安全衛生業務主管？","options":["甲","乙","丙","丁。"]},{"id":175,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"雇主僱用勞工人數在 30 人以上，未滿100 人者，應設置何種職業安全衛生業務主管？","options":["甲","乙","丙","丁。"]},{"id":176,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"雇主僱用勞工人數未滿30 人者，應設置何種職業安全衛生業務主管？","options":["甲","乙","丙","丁。"]},{"id":177,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"第二類及第三類事業單位，勞工人數在 5 人以下，應設置何種職業安全衛生業務主管？","options":["甲","乙","丙","丁。"]},{"id":178,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"某公司勞工人數未滿30 人，依職業安全衛生管理辦法規定，有關其職業安全衛生人員之設置，下列何者正確？","options":["至少置甲種職業安全衛生業務主管1 人","職業安全衛生業務主管得由該公司經營負責人擔任","所置職業安全衛生人員應報檢查機構備查","職業安全衛生人員應為專職。"]},{"id":179,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，勞工人數在幾人以上，所置職業安全衛生人員應報檢查機構備查？","options":["5 人","30 人","100 人","200 人。"]},{"id":180,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"事業單位勞工人數未滿幾人者，其應置之職業安全衛生業務主管得由事業經營負責人或其代理人擔任？","options":["10 人","50 人","30 人","100 人。"]},{"id":181,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依法令規定，於僱用勞工人數在多少人以上之事業單位，應訂定職業安全衛生管理規章？","options":["30 人","50 人","90 人","100 人。"]},{"id":182,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依法令規定，第一類事業，勞工人數在多少人以上之事業單位，應建置職業安全衛生管理系統？","options":["100 人","200 人","300 人","500 人。"]},{"id":183,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依法令規定，第二類事業，勞工人數在多少人以上之事業單位，應建置職業安全衛生管理系統？","options":["100 人","200 人","300 人","500 人。"]},{"id":184,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生管理辦法規定，下列何種行業勞工人數達到 200 人以上時，必須建置及推動職業安全衛生管理系統？","options":["醫療服務業","保全業","大眾傳撮業","水電燃氣業之電力供應業。"]},{"id":185,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"有關事業分散於不同地區者，應於各該地區之事業單位設職業安全衛生管理單位及管理人員，下列敘述何者有誤？","options":["事業單位勞工人數之計算，以各該地區事業單位作業勞工之總人數為準","設有總機構者，應另於總機構或其地區事業單位設綜理全事業之職業安全衛生事務之管理單位及置管理人員","第一類事業設有總機構且勞工人數在五百人以上者，應設綜理全事業且直接隱屬雇主之專責一級管理單位","前項勞工人數之計算，以總機構作業勞工之人數為準。"]},{"id":186,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，下列何者不屬第一類事業(具顯著風險者)？","options":["機械設備製造業","電力供應業","大眾傳撮業","土木工程業。"]},{"id":187,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"營造業之事業單位對於橋梁、道路、隧道或輸配電等距離較長之工程，應於每多少公里內增置營造業丙種職業安全衛生業務主管一人？","options":["5 公里","10 公里","20 公里","30 公里。"]},{"id":188,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依照職業安全衛生管理辦法，請問營造業屬下列何種事業單位？","options":["第一類","第二類","第三類","第四韻。"]},{"id":189,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"事業單位訂定要求各級主管及管理、指揮、監督等有關人員執行與職業安全衛生有關之內部管理程序等文件稱為下列何者？","options":["職業安全衛生管理規章","公司章程","工廠管理規則","施工計畫。"]},{"id":190,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依法令規定，職業安全衛生管理計畫應由下列何者擬訂？","options":["雇主","作業勞工","人事人員","勞工。"]},{"id":191,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"有關職業安全衛生管理規章之敘述，下列何者正確？","options":["直接奘用他廠規章，以方便管理","規章之結構應含制定目的、適用範圍","屬公司內部規則，無須頒布","一般組織管理經驗或文獻資料屬研究範圍不可作為依據。"]},{"id":192,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"有關職業安全衛生管理規章之敘述，下列何者有誤？","options":["屬事業單位內部管理程序等文件","目的在要求執行職業安全衛生有關事項","用以要求各級主管及管理、指揮、 監督等有關人員","對員工不具有強制的規範。"]},{"id":193,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"事業單位訂定要求各級主管及管理、指揮、監督等有關人員執行與職業安全衛生有關之內部管理程序等文件稱為下列何者？","options":["職業安全衛生管理規章","公司章程","工廠管理規則","庶務規則。"]},{"id":194,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者為事業單位內負責寬議、協調、考核及建議職業安全衛生有關業務之組織？","options":["職業安全衛生管理單位","醫療管理單位","職業安全衛生委員會","安全衛生協議組織。"]},{"id":195,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生管理辦法規定，雇主應執行之職業安全衛生事項不包括下列何者？","options":["虛驚事故調查處理與統計","安全衛生資訊之蒐集","防護具之管理","消防損失。"]},{"id":196,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，雇主依規定實施之定期檢查表單，下列何者非屬應記錄事項？","options":["檢查年月日","檢查方法","檢查態度","檢查結果。"]},{"id":197,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，有關職業安全衛生業務主管，雇主應自該事業單位之何者選任？","options":["僅可由相關主管選任","僅由從辦理職業安全衛生事務者選任","可由相關主管或辦理職業安全衛生事務者選任","可由辦理職業安全衛生或人資事務者選任。"]},{"id":198,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，事業單位置職業安全管理師或職業衛生管理師達2 人以上者，其中至少 1 人應為下列何者？","options":["職業安全衛生業務主管","職業安全管理師","職業衛生管理師","工業安全技師。"]},{"id":199,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，政府機關(構)應設之職業安全衛生組織或人員，因其他法規限制，得在組織修編完成前，以報經中央主管機關核定之下列何種文件替代之： a.職業災害防止計畫、b.職業安全衛生管理計畫、c.職業安全衛生管理規章、d.自動檢查訂？","options":["ab","bc","cd","ac。"]},{"id":200,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，雇主對高空工作車，應於每日作業前就其制動裝置、 操作裝置及作業裝置之性能實施下列何者？","options":["竣工檢查","重新檢查","檢點","作業環境測定。"]},{"id":201,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生管理辦法規定，事業單位向勞動檢查機構陳報職業安全衛生管理單位或人員設置報備書時，應由下列何人具名陳報？","options":["事業經營負責人","職業安全衛生人","工作場所負責人","工會理事長。"]},{"id":202,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法之規定，局部排氣裝置或除塵裝置於開始使用、拆卸、改裝或修理時，應實施何種檢查？","options":["定期檢查","重點檢查","竣工檢查","熔接檢查。"]},{"id":203,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，第一類事業勞工人數在 200 人以上之事業單位，應依事業單位之潛在風險，訂定緊急狀況預防、準備及應變之計畫，並定期實施演締其執行紀錄，應至少保存多少年？","options":["2 年","3 年","5 年","10 年。"]},{"id":204,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，雇主依規定實施之自動檢查，於發現有異常時，應採取下列何種措施？","options":["穠改自動檢查紀錄","立即檢修及採取必要措施","可忽略而繼續工作","無需採取任何措施。"]},{"id":205,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，第一類事業其人數至少應超過多少人以上時，所設置之職業安全衛生管理人員應為專職？","options":["30 人","100 人","200 人","300 人。"]},{"id":206,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，雇主對機械、設備實施定期檢查、重點檢查或作業檢點，應訂定下列何種計畫？","options":["災害防止計畫","機械設備維修計畫","自動檢查計畫","損失防止計畫。"]},{"id":207,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生管理辦法規定，雇主實施自動檢查應訂定下列何種計畫？","options":["緊急應變計畫","職業災害防止計畫","自主管理計畫","自動檢查計畫。"]},{"id":208,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，雇主依規定實施之定期檢查表單，下列何者非屬應記錄事項？","options":["實施檢查者之姓名","部門主管","檢查部分","檢查方法。"]},{"id":209,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"職業安全衛生人員因故未能執行職務時，依職業安全衛生管理辦法規定，雇主指定之代理人，其代理期間不得超過幾個月？","options":["1","2","3","4。"]},{"id":210,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何者為事業單位內擬訂、規劃、推動及督導職業安全衛生有關業務之組織？","options":["環保管理單位","職業安全衛生管理單位","職業安全衛生委員會","人力資源部門。"]},{"id":211,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"達成失能傷害頻率在 0.13 以下，是職業安全衛生管理計畫中之那一項？","options":["基本方針","計畫目標","實施細目","預定進度。"]},{"id":212,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法規定，下列何種機械應每月實施定期檢查？","options":["研磨機","抽水機","高空工作車","數位加工機。"]},{"id":213,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，事業單位設職業安全衛生委員會時，應製作名冊並如何處理？","options":["自行疾存","上網登錄報檢查機構備查","報主管機關備查","未有明定。"]},{"id":214,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者非屬危險物？","options":["爆炸性物質","著火性物質","可燃性氣體","致癌物。"]},{"id":215,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生管理辦法之規定，應實施採購管理的事業單位，於設備或物料完成採購驗收後，應將相關執行紀錄保存幾年？","options":["1 年","2 年","3 年","4 年。"]},{"id":216,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"某公司承攬一輸配電工程，工程距離全長達29 公里，請問依職業安全衛生管理辦法規定，該工程應如何增置職業安全衛生人員？","options":["每 5 公里增置急救人員1 人","每 10 公里增置丙種職業安全衛生業務主管1 人","每 5 公里增置作業主管1 人","每 10 公里增置急救人員1 人。"]},{"id":217,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，某些特殊機械設備，於其完成設置開始使用前；或拆卸、改裝、修理後，就其部分重要處實施下列何種檢查？","options":["定期檢查","重點檢查","變更檢查","重新檢查。"]},{"id":218,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生管理辦法規定，捲揚裝置於開始使用、拆卸、捲揚、改裝或修理時， 應實施下列何種檢查？","options":["竣工檢查","重點檢查","熔接檢查","型式檢查。"]},{"id":219,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生管理辦法規定，下列何者非屬職業安全衛生委員會應辦理之事項？","options":["寬議安全衛生教育訓練計畫","考核現場安全衛生績效","對雇主擬訂之職業安全衛生政策提出建議","擬訂安全衛生作業標準。"]},{"id":220,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生管理辦法規定，雇主對於高壓電氣設備及低壓電氣設備，應每隔多久定期實施檢查一次？","options":["每年","每 2 年","每 3 年","每 4 年。"]},{"id":221,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生管理辦法規定，雇主對固定式起重機應每隔多久就該機械之整體定期實施檢查一次？","options":["每年","每 2 年","每 3 年","每 4 年。"]},{"id":222,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"勞動檢查法之立法意旨為實施勞動檢查，貫徹下列何種法令之執行、維護勞雇雙方權益、安定社會、發展經濟？","options":["環境保護法令","勞動法令","消防法令","交通法令。"]},{"id":223,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者非勞動檢查法明定之立法目的？","options":["發展經濟","安定社會","人力發展","貫徹勞動法令之執行。"]},{"id":224,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依勞動檢查法規定，下列何者為中央主管機關指定為辦理危險性機械或設備檢查之行政機關、學術機構、公營事業機構或非營利法人？","options":["代行檢查機構","勞動檢查機構","研究機構","學術機構。"]},{"id":225,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依勞動檢查法施行細則規定，下列何者係指每百萬工時之失能傷害總損失日數？","options":["失能傷害頻率","失能傷害嚴重率","失能傷害千人率","事故率。"]},{"id":226,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依勞動檢查法施行細則規定，下列何者係指每百萬工時之失能傷害次數","options":["失能傷害頻率","失能傷害嚴重率","失能傷害千人率","事故率。"]},{"id":227,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者得由代行檢查機構實施？","options":["勞工作業環境監測","危險性工作場所審查或檢查","職業災害檢查","具有危險性之機械或設備定期檢查。"]},{"id":228,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"事業單位有違反勞動法令規定之檢查結果，勞動檢查機構應於幾日內以書面通知立即改正或限期改善？","options":["5 日","8 日","10 日","15 日。"]},{"id":229,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"如勞動檢查機構認定雇主有違反勞動法令規定事項者，雇主應於違規場所顯明而易見處所公告幾日以上？","options":["3 日","5 日","7 日","10 日。"]},{"id":230,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依勞動檢查法，勞動檢查機構於受理勞工申訴後，應儘速就其申訴內容派勞動檢查員實施檢查，並應於幾日內將檢查結果通知申訴人？","options":["7 日","10 日","14 日","30 日。"]},{"id":231,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依勞動檢查法規定，下列敘述何者正確？","options":["勞動檢查機構接獲勞工申訴後，應於10 日內將檢查結果通知申訴人","執行職業災害檢查，不得事先通知事業單位","無故拒絕勞動檢查，處新臺幣3 萬元以上 15 萬元以下罰鍰","事業單位應於違規場所顯明易見處，公告檢查結果14 日以上。"]},{"id":232,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者非勞動檢查法明定之勞動檢查事項範圍？","options":["勞動基準法","職業安全衛生法","首品安全衛生法","勞工福利、就業服務及其他相關法令。"]},{"id":233,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依勞動檢查法規定，下列何者為領有勞動檢查證執行勞動檢查職務之人員？","options":["穀查員","代行檢查員","職業安全衛生管理員","勞動檢查員。"]},{"id":234,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"經勞動檢查機構以書面通知之檢查結果，事業單位茂以違反單一事業內容公告時，應於下列何顯明意見處公告？","options":["該違規之機具設備或場所","餐廳、宿舍、及各作業場所","經協商同意之場所","管制出勤之場所。"]},{"id":235,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"工作者如發現事業單位違反職業安全衛生法令時，其申訴的對象不包括下列何者？","options":["雇主","主管機關","勞動檢查機構","目的事業主管機關。"]},{"id":236,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"勞動檢查員執行職務除下列何者事項外，不得事先通知事業單位？","options":["勞動檢查法第 26 條規定之審查或檢查","危險性機械或設備檢查","職業災害檢查","以上皆是。"]},{"id":237,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依勞動檢查法施行細則規定，勞動檢查員對各事業單位工作場所實施安全衛生檢查時，發現勞工有立即發生危險之虞，得就該場所以書面通知事業單位逕予先行停工， 下列何者非屬停工通知書應記載？","options":["停工理由","停工範圍","申請復工之條件與程序","復工日期。"]},{"id":238,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依勞動檢查法規定，事業單位對未持勞動檢查證者，得否拒絕檢查？","options":["得拒絕","不得拒絕","未有規定","得免派員陪同檢查。"]},{"id":239,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"勞動檢查員執行下列何種職務，不得事前通知事業單位？","options":["危險性工作場所審查或檢查","危險性機械或設備檢查","職業災害檢查","專條檢查。"]},{"id":240,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"危險性工作場所非經勞動檢查機構審查或檢查合格，事業單位不得使勞工在該場所作業，係屬何種法令所規範？","options":["勞動基準法","勞動檢查法","職業安全衛生法","職業災害勞工保護法。"]},{"id":241,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危險性工作場所審查及檢查辦法規定，下列何者為營造工程之危險性工作場所？","options":["甲韻","乙韻","丙韻","丁類。"]},{"id":242,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"建築物頂模模版高度在多少公尺以上之建築工程屬於丁類危險性工作場所？","options":["50 公尺","60 公尺","70 公尺","80 公尺。"]},{"id":243,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危險性工作場所審查及檢查辦法規定，須執行施工安全評估，是屬於下列何種危險性工作場所？","options":["甲韻","乙韻","丙韻","丁類。"]},{"id":244,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依危險性工作場所審查及檢查辦法規定，事業單位向檢查機構申請審查丁類工作場所前，應組成評估小組實施評估，下列何者非必要人員？","options":["職業安全衛生人員","專任工程人員","潟悉該場所作業之顧問","工作場所負責人。"]},{"id":245,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危險性工作場所審查及檢查辦法規定，事業單位對於經檢查機構審查合格之丁類工作場所，於施工過程有下列何種情況時，應重新評估後報經檢查機構審查？","options":["變更施工人員","改變施工機具","變更承攬人","變更主要分項工程施工方法。"]},{"id":246,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依危險性工作場所審查及檢查辦法規定，事業單位向檢查機構申請審查丁類工作場所之審查結果，檢查機構應於受理申請後幾日內，以書面通知事業單位？","options":["10 日","20 日","30 日","40 日。"]},{"id":247,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"被通知停工之事業單位，依勞動檢查法規定，勞動檢查機構未允許復工前，茂私自復工，可對其處以何種處理？","options":["罰鍰","有期徑刑、拘役或科或併科罰金","已函通知改善","移送法院強制執行。 職業安全衛生設施規則"]},{"id":248,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，低壓係指多少伏特以下之電壓？","options":["220 伏特","600 伏特","380 伏特","110 伏特。"]},{"id":249,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，高壓係指多少伏特之電壓？","options":["低於600 伏特","超過 600 伏特未滿22800 伏特","超過22800 伏特","超過34500 伏特。"]},{"id":250,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，特高壓係指多少伏特之電壓？","options":["低於600 伏特","超過600 伏特未滿22800 伏特","超過22800 伏特","超過34500 伏特。"]},{"id":251,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，1 萬伏特之電壓係屬下列何者？","options":["低壓","高壓","特高壓","超高壓。"]},{"id":252,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"職業安全衛生設施規則中，對於供電電壓分韻下列何者為非？","options":["低壓","中壓","高壓","特高壓。"]},{"id":253,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，下列何者非屬著火性物質？","options":["易燃固體","易燃液體","自燃物質","禁水性物質。"]},{"id":254,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，下列何者非屬著火性物質？","options":["鍍粉","硝化乙二鄱","賺璪畔韻","黃磷。"]},{"id":255,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"黃磷、赤磷、硫化磷等物質放置於常溫空氣中，給予加熱或戮擦易起火燃燒，該韻物質依職業安全衛生設施規則規定，屬下列何種危險物？","options":["爆炸性物質","氧化性物質","易燃液體","著火性物質。"]},{"id":256,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則之規定，下列何者不是著火性物質？","options":["金屬鉀","碳化鈣","硫化磷","硝化甘油。"]},{"id":257,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，下列何者屬爆炸性物質？","options":["過氧化丁鉈","金屬鋰","過氧化鉀","氯酸鈉。"]},{"id":258,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，雇主對物料堆放應符合之規定中，下列敘述何者錯誤？","options":["得超過堆放地最大安全負荷","不得影響照明","不得妨礙機械設備之操作","不得阻矇交通或出入口。"]},{"id":259,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，雇主設置之安全門及其通道，應如何辦理？","options":["安全門於勞工工作期間內得上鎖，其通道得堆置物品","安全門於勞工工作期間內不得上鎖， 其通道不得堆置物品","安全門於勞工工作期間內不得上鎖，其通道得堆置物品","安全門於勞工工作期間內得上鎖，其通道不得堆置物品。"]},{"id":260,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則規定，雇主對室內工作場所應符合之規定中，下列敘述何者錯誤？","options":["主要人行道不得小於1 公尺","各機械間通道不得小於80 公分","主要人行道及安全門應有明顯標示","自路面起算2 公尺高度範圍內，得有障礙物。"]},{"id":261,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則規定，對於勞工日時量平均音壓級超過多少分貝之噪音作業場所，應使勞工戴用有效之耳塞或耳罩？","options":["70","75","80","85。"]},{"id":262,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則之規定，工作場所噪音超過多少分貝時，即應採取工程控制、 減少勞工噪音暴露時間，以符合宸許暴露標準？","options":["80","90","115","140。"]},{"id":263,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，噪音超過多少分貝之工作場所，應標示並公告其危害之預防事項，供勞工周知？","options":["90","95","80","85。"]},{"id":264,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，勞工工作場所噪音音壓級90 分貝，工作日容許暴露時間最多為多少小時？","options":["8","4","2","1。"]},{"id":265,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，勞工工作場所噪音音壓級95 分貝，工作日容許暴露時間最多為多少小時？","options":["8","4","2","1。"]},{"id":266,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"我國職業安全衛生法規定，噪音每增多少分貝，勞工宸許暴露時間即減半？","options":["2","4","5","6。"]},{"id":267,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"雇主對於高度在多少公尺以上之場所投下物料有危害勞工之虞者，應設置適當之滑標、承受設備，並指派監視人員？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":268,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"雇主對於使用之合梯，以下何者錯誤？","options":["梯腳與地面之角度應在 75 度以上","兩梯腳間有金屬等硬質繫材扣牢","腳部有防滑絕緣腳套","安全防滑梯腳。"]},{"id":269,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"有關合梯作業，下列敘述何者錯誤？","options":["有安全防滑梯腳","梯腳與地面夾角任何角度皆可，且兩梯腳間無需繫材扣牢","合梯材質不可有顯著損傷","合梯須有堅固結構。"]},{"id":270,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"何者非安全合梯使用方式？","options":["可夾著合梯移動","高度2 公尺內使用","2 人協同作業","不可單側使用。"]},{"id":271,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"使用合梯作業時，高度達多少公尺以上必須設置工作台或使用安全帶等防墜措施？","options":["1.5 公尺","1.8 公尺","1 公尺","2 公尺。"]},{"id":272,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則規定，設置之固定梯長超過6 公尺時，應每隔多少公尺以下設一平台？","options":["6 公尺","8 公尺","7 公尺","9 公尺。"]},{"id":273,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"關於固定梯之規定何者正確？","options":["踢條與牆壁間之淨距離不得超過15 公分","梯子頂端應凸出板面60 公分以上","梯長連續超過6 公尺，應每隔12 公尺以下設一平台","未設護籠或其他保護裝置。"]},{"id":274,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"固定梯之踢條應與牆壁間保持多少公分以上淨距？","options":["13.5 公分","14.5 公分","15.5 公分","16.5 公分。"]},{"id":275,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"固定梯子梯長連續超過6 公尺時，應於距離梯底 2 公尺以上部分設下列何者？","options":["護圍","護籠","斜籠","支撐。"]},{"id":276,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"有關爬護籠梯敘述何者有誤？","options":["檢查固定","雙手捎工具","使用捲揚式防墜器","要全神貫注。"]},{"id":277,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"移動梯之寬度應在多少公分以上？","options":["15 公分","20 公分","25 公分","30 公分。"]},{"id":278,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，500公斤以上物品，應以何種方式搬運為宜？","options":["以機動車輛或其他機械搬運","以人力搬運","以人力車輛搬運","以手工具搬運。"]},{"id":279,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，40公斤以上物品，應以何種方式搬運為原則？","options":["以機動車輛或其他機械搬運","以人力搬運","以人力車輛或工具搬運","以手工具搬運。"]},{"id":280,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則規定，雇主對勞工於石綿板、瓦、木板、苣草等材料構築之屋頂從事作業時，為防止勞工踢穿墜落，應於屋架上設置適當強度，且寬度至少在幾公分以上之板料？","options":["10 公分","15 公分","20 公分","30 公分。"]},{"id":281,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"高差超過多少公尺應設安全上下設備？","options":["1.0 公尺","1.5 公尺","2.0 公尺","2.5 公尺。"]},{"id":282,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"二公尺以上之工作台、開口部份等場所，為防止勞工墜落應設置之防護措施係指","options":["佩掛安全帶","設置護欄、護蓋","設置警示緣系統","限制勞工進入管制區。"]},{"id":283,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則規定，雇主對於高度至少在幾公尺以上之作業場所，有遇強風、大雨等惡劣氣候致勞工有墜落危險時，應使勞工停止作業？","options":["1","1.2","1.5","2。"]},{"id":284,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依國家標準CNS9328「安全用顏色通則」規定，緊急停止按鈕表面應為下列何種顏色？","options":["紅色","黃色","綠色","棕色。"]},{"id":285,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生設施規則規定，對於輸送腐蝕物質管線，無須標示下列何者？","options":["物質名稱","輸送方向","閣之開閉狀態","部門名稱。"]},{"id":286,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則之規定，除特殊情形外，勞工於坑內作業，其溫度應保持在攝氏幾度以下？","options":["32 度","35 度","37 度","40 度。"]},{"id":287,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，可燃性氣體、有毒性氣體及氧氣之鋼瓶，應如何儲存？","options":["全部分開","僅可燃性氣體及毒性氣體鋼瓶需分開","僅可燃性氣體及氧氣鋼瓶需分開","無需分開。"]},{"id":288,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，雇主對於堆高機之操作，不得超過該機械所能承受之最大荷重，且其載運之貨物應保持穫固狀態，防止下列何種災害？","options":["感電","火災","翹們","缺氧。"]},{"id":289,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，對於良導體設備內從事檢修作業使用之手提式照明燈，其電壓不得超過多少伏特？","options":["9 伏特","12 伏特","24 伏特","110 伏特。"]},{"id":290,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"使勞工從事局限空間作業","options":["應訂定危害防止計畫","應採取連續確認氧氣、危害物質濃度之措施","經現場作業主管簽署始得進入","以上皆是。"]},{"id":291,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依法令規定，雇主不得使未滿幾歲者，從事坑內工作等危險性或有害性工作？","options":["6 歲","12 歲","18 歲","20 歲。"]},{"id":292,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生法規定，17 歲男性工作者可從事下列何種工作？","options":["坑內工作","處理易燃性物質","有害輻射散布場所","有機溶劑作業。"]},{"id":293,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主架設之通道，通道路如用漏空桃條製成，其縫間隙不得超過下列何者？","options":["8 公咺","12 公咺","16 公咺","30 公咺。"]},{"id":294,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，一般辦公場所之照明應為多少米燭光以上？","options":["200 米燭光","300 米燭光","500 米燭光","1000 米燭光。"]},{"id":295,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，對於作業場所之走道照明，其照度至少應為多少米燭光以上？","options":["10 米燭光","50 米燭光","100 米燭光","300 米燭光。"]},{"id":296,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依法令規定，自高度在幾公尺以上之場所，投下物體有危害勞工之虞時，應設置適當之滑標及承受設備？","options":["2 公尺","3 公尺","4 公尺","5 公尺。"]},{"id":297,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，雇主設置工作用階梯應符合之規定中，下列敘述何者錯誤？","options":["斜度不得大於60 度","梯級革深度不得小於15 公分","斜度應小於30 度","應有適當之扶手。"]},{"id":298,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，雇主對於高壓氣體容器之使用，下列敘述何者錯誤？","options":["高壓氣體容器應樞明所裝氣體之品名，不得任意灌裝或轉裝","容器使用時應加固定","焊接時得在容器上試焊","磅知容器之用途無誤者，方得使用。"]},{"id":299,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"高壓氣體容器，不誰盛裝或空容器，搬運時之注意事項，下列何者正確？","options":["非與其他氣體混載不可時，應將容器之頭尾反方向或隔置相當間隔","以手移動容器，應磅知護蓋旋緊後","運載可燃性氣體時，要置備吸收劑、中和劑、防毒革具","溫度應保持在攝氏 50 度以下。"]},{"id":300,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生設施規則規定，雇主對於可燃性高壓氣體之貯存，下列敘述何者錯誤？","options":["容器應保持在攝氏 40 度以下","應安穩置放並加固定","可燃性氣體、有毒性氣體及氧氣之鋼瓶，應合併貯存","貯存場所應禁止煙火接近。"]},{"id":301,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則之規定，對於勞工經常工作之室內作業場所，每一勞工原則上應有多少立方公尺以上之空間？","options":["5 立方公尺","10 立方公尺","15 立方公尺","200 立方公尺(3)900 立方公尺。"]},{"id":302,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，在通風及換氣部分，雇主對於勞工經常作業之室內作業場所，其窗戶及其他開口部分等可直接與大氣相通之開口部分面積，應為地板面積多少比例以上？","options":["1:20","1:50","1:40","1:30。"]},{"id":303,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生設施規則規定，雇主對於麻袋、塑膠袋等袋裝容器構成之積垔，高度在 2 公尺以上者， 其積垔與積垔間下端之距離應為多少公分以上？","options":["5","10","15","20。"]},{"id":304,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生設施規則規定，雇主如設置傾斜路代替模梯時，其斜度不得大於多少度？","options":["20 度","30 度","40 度","50 度。 職業安全衛生教育訓練規則"]},{"id":305,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生教育訓練規則規定，辦理新進或調換一般勞工之職業安全衛生教育訓練時數不得少於多少小時？","options":["3 小時","6 小時","12 小時","18 小時。"]},{"id":306,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生教育訓練規則規定，辦理新進或調換之營造作業勞工，其職業安全衛生教育訓練時數不得少於多少小時？","options":["3 小時","6 小時","12 小時","18 小時。"]},{"id":307,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"事業單位以數位方式經營商品交易或運送，且交付無僱傭關係之個人親自履行外送作業時，對於新加入者，應使其接受安全衛生教育訓練，至少多少小時？","options":["1 小時","3 小時","6 小時","12 小時。"]},{"id":308,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"下列何者不屬於職業安全衛生教育訓練規則之營造作業主管？","options":["高壓室內作業主管","屋頂作業主管","施工架組配作業主管","隧道等挖掘作業主管。"]},{"id":309,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生教育訓練規則規定，營造作業主管在職教育訓練時數為下列何者？","options":["2 年至少 3 小時","2 年至少 6 小時","3 年至少 3 小時","3 年至少 6 小時。"]},{"id":310,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依職業安全衛生教育訓練規則規定，職業安全衛生業務主管在職教育訓練時數為下列何者？","options":["2 年至少 3 小時","2 年至少 6 小時","3 年至少 3 小時","3 年至少 6 小時。"]},{"id":311,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生教育訓練規則規定，移動式起重機操作人員之在職教育訓練為每 3 年至少多少小時？","options":["3 小時","6 小時","9 小時","12 小時。"]},{"id":312,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"辦理下列何種安全衛生教育訓練不必於事前報請當地主管機關備查？","options":["營造作業主管","現場安全衛生監督人員","危險性機械、設備操作人員","職業安全衛生人員。"]},{"id":313,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"下列何者非工地辦理之教育訓練應保存之文件？","options":["工程進度表","課程及時間表","上諸人員簽名冊","課程內容及謙義。"]},{"id":314,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主對勞工應施以必要之安全衛生教育訓練，所辦理之教育訓練至少應包含下列要素？","options":["辨譜及說明作業場所墜落危害","組立、檢查、保養、使用及拆除墜落防護系統之正確程序","相關墜落防護法規、標準之規定內容","以上皆是。"]},{"id":315,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生教育訓練規則規定，雇主對新僱勞工或在職勞工於變更工作前應使其接受適於各該工作必要之安全衛生教育訓練，並應將計畫、受訓人員名冊、簽到紀錄、 課程內容等實施資料保存幾年？","options":["1 年","2 年","3 年","4 年。"]},{"id":316,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業安全衛生教育訓練規則規定，在職勞工於變更工作前，是否要接受適於各該工作必要之安全衛生教育訓練？","options":["工作環境及性質與變更前相當者，可不用","無誰如何一定要","不用","沒規定。"]},{"id":317,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依職業安全衛生教育訓練規則規定，雇主對下列何種操作人員無須使其接受特殊作業安全衛生教育訓練？","options":["小型鍋爐操作人員","荷重在 1 公噸以上之堆高機操作人員","電焊機操作人員","使用起重機具從事吊掛作業人員。 職業災害勞工保護法"]},{"id":318,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業災害勞工保護法規定，職業災害未認定前，勞工無法上琉時，應如何處理？","options":["先請普通傷病假","先以公傷病假處理","先請事假","先予疾職停薪。"]},{"id":319,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業災害勞工保護法施行細則規定，未加入勞工保險而遭遇死亡職業災害之勞工， 且雇主未依勞動基準法規定予以補償時，得比照勞工保險條例之標準申請職業災害死亡補助，其申請補助之第一順位為何？","options":["配偶及子女","父母","神父母","兄弟、姊妹。"]},{"id":320,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者非屬職業災害勞工保護法提供之各項補助範圍？","options":["家屬補助","看護補助","職業訓練生活津貼","育嬰津貼。"]},{"id":321,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業災害勞工保護法之規定，事業單位、職業訓練機構及相關團體辦理加強職業災害預防及職業災害勞工之重建事項，得向下列何單位申請補助？","options":["當地勞工主管機關","勞動檢查機構","直轄市、縣(市)政府","勞工保險局。"]},{"id":322,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依職業災害勞工保護法規定，勞工保險之保險人，在保險有效期間，罹患職業病病， 喪失部分或全部工作能力，經請領勞工保險各項職業災害給付後，得向勞工保險局請領生活津貼之補助，合訂以幾年為限？","options":["5 年","3 年","7 年","2 年。"]},{"id":323,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依勞工職業災害保險及保護法規定，因職業傷病致喪失全部或部分生活自理能力，磅需他人扶助，得向勞工保險局申請何種補助？","options":["生活津貼","殘幡生活津貼","器具補助","照護補助。"]},{"id":324,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依勞工職業災害保險及保護法規定，因歇業或重大虧損，報經主管機關核定者，雇主得預告終止與職業災害勞工之勞動契約，並應依勞動基準法之規定，發給職業災害勞工何種費用？","options":["資遣費","慼問金","生活津貼","退休金。"]},{"id":325,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依職業安全衛生教育訓練規則規定，職業安全衛生委員會成員之職業安全衛生在職教育訓練時數，為下列何者？","options":["每年 2 小時","每年 3 小時","每 2 年 3 小時","每 3 年 3 小時。"]},{"id":326,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"勞工參加有關之職業安全衛生教育訓練，缺課時數達課程總時數多少以上時，則訓練單位應通知其退訓？","options":["二分之一","三分之一","四分之一","五分之一。 危害性化學品標示及通識規則"]},{"id":327,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"下列何者不是危害性化學品標示及通識規則應採取之措施？","options":["危害物質標示","製備安全資料表","機械器具型式檢定","訂定危害通識計畫。"]},{"id":328,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依危害性化學品標示及通識規則之規定，禁水性物質之危害圖式符號為何？","options":["火焰","骷髏頭與二根交叉骨","爆炸炸彈","圓圈上一團火焰。"]},{"id":329,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依危害性化學品標示及通識規則之規定，氧化性固體之危害圖式符號為何？","options":["火焰","圓圈上一團火焰","爆炸炸彈","骷髏頭與二根交叉骨。"]},{"id":330,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依危害性化學品標示及通識規則之規定，骷髏頭與二根交叉骨之圖式符號代表為何？","options":["急毒性物質","可燃性物質","金屬腐蝕物","致癌物質。"]},{"id":331,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危害性化學品標示及通識規則規定，致癌物質之危害圖式，鍽下列何者？","options":["驚歐號","骷髏頭","癌細胤","人頭及胸腔。"]},{"id":332,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依危害性化學品標示及通識規則之規定，下列何者非屬危害性化學品應標示之內容？","options":["危害成分","警示語","用途說明","危害警告訊息。"]},{"id":333,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者非屬危害性化學品標示及通識規則規定應採取之措施？","options":["危害物質標示","製備安全資料表","訂定危害通識計畫","訂定作業環境監測計畫。"]},{"id":334,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依危害性化學品標示及通識規則之規定，容器之宸積在多少以下者，得僅標示名稱、 危害圖式及警示語？","options":["10 毫升","100 毫升","500 升","1 公升。"]},{"id":335,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依危害性化學品標示及通識規則之規定，下列危害圖式及顏色，何者正確？","options":["白底、 黑色圖式符號、紅桓","紅底、白色圖式符號、黑桓","白底、紅色圖式符號、黑桓","白底、黑色圖式符號、黑桓。"]},{"id":336,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"依危害性化學品標示及通識規則規定，標示危害圖示形狀為何？","options":["圓形","三角型","直立 45 度角之正方形","六角形。"]},{"id":337,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"有害物質之容器應明顯標示但於小型容器上無法表標示時，應如何標示？","options":["得依比例縮小但仍應辨譜清楚","得免標示","得標示即可","得標示內容即可。"]},{"id":338,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危害性化學品標示及通識規則之規定，安全資料表應列內容項目共分為幾大項？","options":["10","12","15","16。"]},{"id":339,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"依危害性化學品標示及通識規則危害性之化學品，分為危險物或有害物依據國家哦一標準？","options":["CNS6864","CNS15030","ISO9001","OHSAS18001。"]},{"id":340,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危害性化學品標示及通識規則，下列何者係歸屬「容器」？","options":["袋、筒、瓶、箭、罐、 桶","反應器、儲槽","管路","以上皆是。"]},{"id":341,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"首品與飲料等物品攸關全民之飲首衛生，前迦物品不須檢附下列何種資料，即可買賢與飲用？","options":["成分","製造日期","有效期限","安全資料表。"]},{"id":342,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"依危害性化學品標示及通識規則規定，關於安全資料表內容之正確性，下列何者最適當？","options":["每一年檢討","每三年檢討","每五年檢討","依實際情況隨時更新檢討。"]},{"id":343,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"危害性化學品管理通常不包含下列何者？","options":["危險性機械設備","危害標示及教育訓練","危害清單及通識訂劃","安全資料表。"]},{"id":344,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"依危害性化學品標示及通識規則之立法精神，製造商及供應商提供安全資料表給事業單位，是屬何種性質？","options":["義務","權利","職業道德","做功影。"]},{"id":345,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"雇主對於具有危害性化學品，下列何者非必要採取措施？","options":["標示","製備化學品清單","揭示安全資料表","環境監測。"]},{"id":346,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者最不可能是影響化學性危害的因？","options":["毒性物質本身的毒性","毒性物質的濃度","暴露途徐","環境照明。"]},{"id":347,"section":"法規與通識｜職業安全衛生相關法規","answer":3,"question":"雇主使勞工從事下列何種有害物質作業時，應使該勞工就其作業有關事項實施檢點？","options":["高溫作業","露天開挖作業","有機溶劑作業","異常氣壓作業。"]},{"id":348,"section":"法規與通識｜職業安全衛生相關法規","answer":1,"question":"下列何種通風設備可用於儲槽內之第一種有機溶劑作業？","options":["局部排氣","整體換氣","自然換氣","溫差換氣。"]},{"id":349,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"下列何者非屬可燃性氣體？","options":["氫氣","乙炘","甲焗","甲醇。"]},{"id":350,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何者非屬可燃性氣體？","options":["氫","乙醚","乙炘","丙焗。"]},{"id":351,"section":"法規與通識｜職業安全衛生相關法規","answer":4,"question":"對於防止化學品引起之職業災害，下列何種措施應列為最優先考量？","options":["工程改善","使用防護具","作業檢點","尋求無害之替代物。"]},{"id":352,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"下列何者被吸入人體，最可能會導致肺部纖維化？","options":["鉛","游離二氧化矽","氧化鐵","石膏。"]},{"id":353,"section":"法規與通識｜職業安全衛生相關法規","answer":2,"question":"醜銖作業易使勞工暴露於銖酸霪滴，易造成下列何種病病？","options":["青光眼","麼中膈穿孔","白指症","白內隙。"]},{"id":354,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"下列何種職業安全衛生法規主要適用於從事營造作業之有關事業？","options":["林場安全衛生設施規則","磕頭裝卸安全衛生設施標準","危險性機械及設備安全檢查規則","營造安全衛生設施標準。"]},{"id":355,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"營造安全衛生設施標準是依據職業安全衛生法第幾條之規定訂定之？","options":["第一條","第三條","第五條","第六條。"]},{"id":356,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於工作場所暴露之鋼筋、鋼材、鐵件、鋁件及其他材料等易生職業災害者，下列何者非應採取之防護設施？","options":["彎曲尖端","加蓋","加裝護奘","行走時小心即可。"]},{"id":357,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主使勞工於營造工程工作場所作業前，應指派所何者實施危害調查、評估，並採適當防護設施，以防止職業災害之發生？","options":["職業安全衛生人員、工作場所負責人或專任工程人員等專業人員","領琉","監工","勞工。"]},{"id":358,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，工作場所儲存有下列何種物品時，雇主應有防止太陽直接照屑之適蔗物外，並應隔離儲存、設置禁止煙火之警告標誌及適當之滅火器材？","options":["乙炘鋼瓶","槽板","鋼筋","塑膠管料。"]},{"id":359,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"雇主對工作場所中原有之電線、電力配管、電信管線、電線桿及拉線、給水管、石油及石油產品管線、危險物或有害物管線等，如有妨礙工程施工安全者，應確實掌握狀況予以妥善處理；如有安全之虞者，非經那個單位，不得任意挖掘、剪接、移動或於其鄰近從事加熱工作？","options":["主管機關","勞動檢查機構","管線權責單位","以上皆可。"]},{"id":360,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"施工內容浮及下列何種作業，均須依照流程辦理作業許可申請，以達到事前控管及安全確認","options":["高架作業","吊掛作業","高壓電線周圍作業","以上皆是。"]},{"id":361,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"使用道路作業、鄰近道路作業或有導致交通事故之虞之工作場所作業安全應注意事項，以下何者非？","options":["設置交通引導人員","依規定設置適當交通號誌、標示或柵欄","應注意屋頂作業安全","夜間柵欄應設有照明或反光片等設施。"]},{"id":362,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"遷水作業中為使勞工安全作業，預防溺斃災害之發生，以下何種防災作為並不適當？","options":["勞工著用救生衣","勞工有落水者之虞者，應設置防止勞工落水之設施","防汛期間應派遣勞工不顧危險於行水區域固守機具","工作場所或其附近設置救生設備。"]},{"id":363,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"堆放磚、瓦、木塊或同類材料應距離開口部分多少公尺以上？","options":["1 公尺","1.5 公尺","2 公尺","2.5 公尺。"]},{"id":364,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"堆放磚、瓦、木塊之高度，不得超過多少公尺？","options":["1 公尺","1.5 公尺","1.8 公尺","2 公尺。"]},{"id":365,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"對於工作場所相關之安全衛生注意事項，下列何者不正確？","options":["設置之護蓋為柵狀構造者，柵條間隔不得大於3 公分","對於幡止使用之開口部分應予封閉，以防止勞工墜落","合梯高度以頂部之梯革至梯腳間之垂直距離計算，高度不得超過2 公尺","為提高合梯的穩定性，合梯的角應儘量加大。"]},{"id":366,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準第17 條規定，雇主對於高度2 公尺以上之工作場所，勞工作業有墜落之虞者，應訂定？","options":["物體飛落災害防止計畫","墜落災害防止計畫","感電災害防止計畫","倒塌崩塌災害防止計畫。"]},{"id":367,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準17 條規定，有關墜落災害防止事項之敘述中，下列採取之先後優先順序，何者為正確？a.張掛安全網b.限制作業人員進入管制區c.設置護欄、 護蓋d.經由設計或工法之選擇，儘量使勞工於地面完成作業，減少高處作業項目 e.設置警示緣系統f.經由施工程序之變更，優先施作永久構造物之上下設備或防墜設施 g. 使勞工佩掛安全帶","options":["d.f.c.a.e.b.g","c.d.e.f.g.a.b","d.e.f.c.a.b.g","a.b.d.c.e.f.g。"]},{"id":368,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，勞工於屋頂作業，其屋頂斜度大於多少度時，應設適當之護欄？","options":["25 度","30 度","33 度","34 度。"]},{"id":369,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，於屋頂作業時，雇主應指派何人於現場辦理規定事項","options":["安全衛生管理員","專人","屋頂作業主管","職業安全衛生業務主管。"]},{"id":370,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，於易踢穿材料構築之屋頂作業時，雇主應指派何人於現場辦理規定事項","options":["安全衛生管理員","專人","屋頂作業主管","職業安全衛生業務主管。"]},{"id":371,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，使勞工於易踢穿材料構築之屋頂作業時，為防止屋頂踢穿災害，得不設置下列何者安全衛生設施？","options":["護欄","安全網","安全通道","適當強度、寬度之板料。"]},{"id":372,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，於屋頂作業時所設之工作臺寬度應在","options":["40 公分","30 公分","20 公分","10 公分以上。"]},{"id":373,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，於易踢穿材料構築之屋頂作業時，應先規劃安全通道， 並設置適當強度且寬度在多少公分以上之板料？","options":["10 公分","20 公分","30 公分","40 公分。"]},{"id":374,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，勞工有遭受墜落危險之虞者，應於該處設置防護設備下列何者為非？","options":["護欄","護蓋","降落傘","安全網。"]},{"id":375,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"護欄旅2 公尺內不可以做何種行為？","options":["堆放鋼筋","使用合梯","停放貨車下貨","以上皆是。"]},{"id":376,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"施作護欄前要注意下列何者事項？","options":["先拆臨時護欄","先做防墜設施","先量尺寸","先拆安全網。"]},{"id":377,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"開口護欄要有設何種設施？","options":["上中欄杆及腳趾板","天花板","扶手","模梯。"]},{"id":378,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，設置之護欄的高度應在幾公分以上？","options":["75 公分","85 公分","90 公分","100 公分。"]},{"id":379,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，設置之護欄其上欄杆、中欄杆及地皺革與模板面間之上下開口距離，應不大於幾公分？","options":["35 公分","45 公分","55 公分","65 公分"]},{"id":380,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，設置護欄時，其腳趾板以木材構成者，其高度應在幾公分以上，並密接於地皺革或模板面艓設？","options":["10 公分","20 公分","30 公分","40 公分。"]},{"id":381,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，護欄以木材構成者，其上欄杆應平整，且其擷革應在多少平方公分以上？","options":["15 平方公分","20 平方公分","25 平方公分","30 平方公分。"]},{"id":382,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，護欄以木材構成者，其中欄杆應平整，且其擷革應在多少平方公分以上？","options":["15 平方公分","20 平方公分","25 平方公分","30 平方公分。"]},{"id":383,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，護欄以木材構成者，其杆柱相遷間距不得超過多少公尺？","options":["2 公尺","2.5 公尺","3 公尺","3.5 公尺。"]},{"id":384,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"下列何者為護欄的構件？","options":["上欄杆及中欄杆","腳趾板","杆柱","以上皆是。"]},{"id":385,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，設置之護欄如以鋼管製成者，其直徑不得小於幾公分？","options":["1.8 公分","2.8 公分","3.8 公分","4.8 公分。"]},{"id":386,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，設置之護欄如以鋼管製成者，杆柱相遷間距不得超過幾公尺？","options":["1 公尺","1.5 公尺","2 公尺","2.5 公尺。"]},{"id":387,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"鋼管施工架應於頂寫設置護欄，高度應在多少公分以上，並應包括上欄杆，中欄杆， 腳趾板及杆柱等構材？","options":["30 公分","60 公分","90 公分","120 公分。"]},{"id":388,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定設置之護欄，應使整個護欄具有抵抗於上欄杆之任何一黏，於任何方向加以幾公斤之荷重，沒有明顯變形？","options":["75 公斤","85 公斤","90 公斤","100 公斤。"]},{"id":389,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定設置之護欄，應使整個護欄具有抵抗於","options":["上欄杆","中欄杆","腳趾板","杆柱，之任何一黏，於任何方向加以 75 公斤之荷重，沒有明顯變形。"]},{"id":390,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，設置護欄時，如以金屬網、塑膠網適覆上欄杆、中欄杆與模板或地板間之空閤者，其網目大小不得超過多少平方公分？","options":["5 平方公分","10 平方公分","15 平方公分","20 平方公分。"]},{"id":391,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主對於坡度小於幾度之勞工作業區域，距離開口部分、開放辭緣或其他有墜落之虞之地點超過2 公尺時，得設置警示緣、管制通行區，代替護欄、護蓋或安全網之設置？","options":["15 度","20 度","30 度","60 度。"]},{"id":392,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於坡度小於15 度之勞工作業區域，距離開口部分、開放辭緣或其他有墜落之虞之地點超過2 公尺時，得設置警示緣、管制通行區，代替護欄、護蓋或安全網之設置。設置之警示緣時，其多少公尺要設置高度90 公分以上之杆柱？","options":["1 公尺","1.5 公尺","2 公尺","2.5 公尺。"]},{"id":393,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"雇主對於坡度小於15 度之勞工作業區域，距離開口部分、開放辭緣或其他有墜落之虞之地點超過2 公尺時，得設置警示緣、管制通行區，代替護欄、護蓋或安全網之設置。設置之警示緣時，每隔2.5 公尺以下設置高度90 公分以上之杆柱，杆柱之上端及其二分之一高度處，設置黃色或紅色之警示繹、帶，其最小張力強度至少多少公斤以上？","options":["75 公斤","100 公斤","225 公斤","250 公斤。"]},{"id":394,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準21 條規定，臨時性開口處使用之護蓋，表面應漆以","options":["紅色","綠色","黃色","黃色並書以警告訊息。"]},{"id":395,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準21 條規定，設置之護蓋，為柵狀構造者，柵條間隔不得大於多少公分？","options":["3 公分","4 公分","5 公分","6 公分。"]},{"id":396,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準21 條規定，有關下列護蓋之敘述，何者正確？a.應具有能使用人員及車輛安全通過之強度b.應以有效方法防止滑溜、掉落、掀出或移動c.供車輛通行者，得以車輛後軸載重之 2 倣設計之，並不得妨礙車輛之正常通行 d.為柵狀構造者，柵條間隔不得大於3 公分 e.上面不得放置機動設備或超過其設計強度之重物 f. 臨時性開口處使用之護蓋， 表面漆以綠色， 並書以警告訊息","options":["a.b.c.d.f.","b.c.d.e.f.","a.b.d.e.f.","a.b.c.d.e。"]},{"id":397,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"設置安全網時，其工作面至安全網架設平革之攔截高度，不得超過幾公尺？","options":["3 公尺","5 公尺","7 公尺","9 公尺。"]},{"id":398,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"設置之安全網及其組件應多久檢查一次？","options":["每天","每週","每二週","每個月。"]},{"id":399,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"下列關於安全網之設置，下列何者有誤？","options":["安全網之材料及張掛方式應符合國家標準之規定","發現安全網有破損時，應即刻以防塵網修補後才能繼續使用","為防止勞工墜落時之拋物緣效應，使用於結構物四周之安全網，於攔截高度在 1.5 公尺以下者， 至少應延伸 2.5 公尺","工作面至安全網架設平革之攔截高度，不得超過7 公尺。"]},{"id":400,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主設置安全網時，為足以涵蓋勞工墜落時之拋物緣預測路徑範圍，使用於結構物四周之安全網時，應依規定延伸適當之距離，下列何者正確","options":["攔截高度在 1.5 公尺以下者，至少應延伸 2.5 公尺","攔截高度超過1.5 公尺且在 3 公尺以下者，至少應延伸 3 公尺","攔截高度超過3 公尺者，至少應延伸 4 公尺","以上皆是。"]},{"id":401,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"安全網如遇有下列那一情形得繼續使用？","options":["經測試強度未達規定者","經電焊火花、 銳利物切割者","強度標示不明磅者","顏色不均勻者。"]},{"id":402,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"安全母索不得以下列哦一材質為之構成","options":["鋼索","尼龍繹純","合成纖維","麻繹。"]},{"id":403,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"安全母索擷裂強度為多少公斤？","options":["2000 公斤","2100 公斤","2200 公斤","2300 公斤。"]},{"id":404,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"水平安全母索之設置高度應大於","options":["1.8 公尺","2.8 公尺","3.8 公尺","4.8 公尺。"]},{"id":405,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"相遷兩中間支柱間之安全母索可籀掛幾條安全帶？","options":["1 條","2 條","3 條","4 條。"]},{"id":406,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"勞工於屋頂作業時，應注意之施工安全事項，下列何者有誤？","options":["應於適當間隔設置中間杆柱","相遷兩中間杆柱間之母索可籀掛兩條安全帶","定期檢查各項構件之安全性能","人員移動時，應採用全身背負式安全帶及捲揚式防墜器。"]},{"id":407,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"垂直安全母索之設置，下列何者正確？","options":["安全母索之下端應有防止安全帶鎖扣自尾端脫落之設施","每條安全母索應僅提供一名勞工使用","勞工作業或爬升位置之水平間距在 1 公尺以下者，得二人共用一條安全母索","以上皆是。"]},{"id":408,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"以下關於安全母索的設置何者不正確？","options":["最小斷裂強度應在2300公斤以上","錨錠強度需在800公斤以上","爬升位置之水平間距在1公尺以下者，得2人共用一條垂直安全母索","垂直安全母索下端應有防止安全帶鎖扣自尾端脫落之設施。"]},{"id":409,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"對於置放於高處，位能超過多少公斤·公尺之物件有飛落之虞者，應予以固定？","options":["8","10","12","15。"]},{"id":410,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主設置覆網攔截位能小於12 公斤·公尺之高處物件時，方形、菱形之網目任一辭長不得大於2 公分，其餘形狀之網目，每一網目不得大於4 平方公分，其強度應能承受直徑45 公分、重多少公斤之物體自高度一公尺處落下之衝擊力？","options":["60 公斤","65 公斤","70 公斤","75 公斤。"]},{"id":411,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主應設置覆網攔截位能小於多少公斤·公尺之高處之物件？","options":["12 公斤","24 公斤","75 公斤","90 公斤。"]},{"id":412,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"雇主設置覆網時，覆網下之最低黏應離作業勞工工作平革多少公尺以上，如其距離不足時應改以其他設施防護？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":413,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"為防止堆置物料倒塌、崩塌或掉落，下列防護措施何者有誤？","options":["以繹純綑綁物","料堆置高度可無限制","禁止人員進入該場所","採用護網、擋楅。"]},{"id":414,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主對物料處置方式，下列何者錯誤？","options":["從事載貨台裝卸貨物其高差在 2 公尺以上者，才需提供勞工安全上下之設備","不得影響照明","纖維纜繹已擷一股子純者，不得使用","不得阻矇交通。"]},{"id":415,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"下列何者非屬防止搬運事故之一般原則？","options":["儘量增加搬運距離","以機動車輛搬運","採取適當之搬運方法","以機械代替人力。"]},{"id":416,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"立柱式施工架超過幾公尺且立面面積達330 平方公尺，應由所僱之專任工程人員或委由相關執業技師計算強度？","options":["7 公尺","10 公尺","15 公尺","20 公尺。"]},{"id":417,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"懸吊式施工架、懸臂式施工架及高度7公尺以上且立面面積達330平方公尺之施工架之構築及拆除，應依何種力學原理設計，置備施工圖說，並由專任工程人員或相關執業技師簽章確認？","options":["材料力學","結構力學","生物力學","人因工程。"]},{"id":418,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"高度2公尺以上框式施工架兩端立架及轉角處，檢查重點為？","options":["有無設置欄杆","有無安全母索","有無警告標示","強度是否請專任工程人員計算。"]},{"id":419,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"施工架設計、施工圖說、簽章確認紀錄及查驗等相關資料，應保存多久？","options":["保存 1 年","保存 3 年","於未完成拆除前應保存","沒有規定。"]},{"id":420,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"施工架組配過程中，於紮緊、拆卸
