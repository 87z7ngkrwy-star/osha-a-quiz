及傳遞施工架構材等之作業時，設寬度在幾公分以上之施工架板料？","options":["10 公分","20 公分","30 公分","40 公分。"]},{"id":421,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主對於鋼管施工架之使用鋼材等金屬材料及其構架方式，應符合下列何者國家標準？","options":["CNS7534","CNS4750","CNS6701","CNS14253。"]},{"id":422,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依據CNS 4750規定之框式施工架中的立架之腳柱及橫材，其為CNS 4435所規定之何種材質？","options":["STK300","STK400","STK500","STK600。"]},{"id":423,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依「營造安全衛生設施標準」規定，系統式施工架之構築，所有立柱、橫桿及斜撐等，應以輪盤及何種組配件，連接成一緊密牢固之系統構架？","options":["插銷扣件","木條","活扣","鐵線。"]},{"id":424,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主對於竹材施工架，應以竹尾末梢外徐幾公分以上之圓竹為限，且不得有裂閤或腐蝕者，必要時應加防腐處理？","options":["3 公分","4 公分","5 公分","6 公分。"]},{"id":425,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，對於同一作業場所使用之鋼管，因鋼管厚度、外徐及強度相異時，為防止僱用鋼管之混淆，應採取使勞工易於譜別之方式為何？","options":["顏色標示","公告規格","口頭告知","教育訓練。"]},{"id":426,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，對於構築施工架之材料，下列何者為非？","options":["不得有顯著之損嚨，變形或腐蝕","使用之木材，應以油漆或其他處理，闆蔗其缺陷","使用之鋼材等金屬材料，應符合國家標準","由國外進口之鋼材，應於使用前確認材料規範具有國家標準同等以上規格。"]},{"id":427,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"施工架在適當之垂直、水平距離處與構造物妥實連接，其間隔在垂直方向及水平方向以不超過多少為限？","options":["7 公尺及 7.5 公尺","5.5 公尺及 8 公尺","6 公尺及 8 公尺","5.5 公尺及 7.5 公尺。"]},{"id":428,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"獨立之施工架，在該架最後柝除前，至少應有多少之踢腳殊不得移動，並使之與橫檔或立柱紮牢？","options":["1/2","1/3","1/4","1/5。"]},{"id":429,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"下列何者可用以建造或支撐施工架？","options":["鬆動之磚","排水管","煙圮","混凝土。"]},{"id":430,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準之規定，施工架組配作業時所設之工作臺寬度敘述，何者正確？","options":["40 公分以上","30 公分","20 公分","10 公分以上。"]},{"id":431,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準之規定，工作臺寬度應在 40 公分以上並鋪滿密接之板料， 其支撐點應有幾處？","options":["1 處","2 處","3 處","4 處。"]},{"id":432,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準之規定，施工架板料間縫閤，不得大於幾公分？","options":["1 公分","2 公分","3 公分","4 公分。"]},{"id":433,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"下列有關施工架之敘述，何者正確？","options":["施工架組配作業遇強風、大雨時，未經雇主許可前不得擅自停止","組立施工架時，如設有寬度在 30 公分以上厚度3.5 公分以上施工架板料，可免使勞工佩掛安全帶","以活動板料為工作臺，其板料長度小於3.6 公尺時，其支撐點只需二處","構築施工架有鄰近或跨越車輛通道者，應於該通道設置護籠等安全設施。"]},{"id":434,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"下列有關施工架之敘述，何者正確？","options":["5 公尺以上施工架之組配作業，應選任經合格之施工架組配作業主管負責監督指揮施工","使用木材構築施工架前應先以油漆或其他處理以闆蔗其缺陷","以孟宗竹構築施工架，使用竹尾末稍外徐4 公分以下者為限","施工架不得與混凝土槽板支撐或其它臨時構造連接，但單側式施工架不在此限。"]},{"id":435,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依職業安全衛生設施規則規定，使用梯式施工架立木之梯子，兩梯相互連接以增加長度時，至少應疊接多少公尺以上，並紮結牢固？","options":["1 公尺","1.5 公尺","1.8 公尺","2 公尺。"]},{"id":436,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，對於設置鋼管施工架之敘述，下列何者正確？","options":["使用金屬附屬配件應確實連接固定","接近高架線路設置施工架，可不裝設絕緣用防護裝備或警告標示","使用之鋼材與構架方式，得依個人意思施作","裝有腳輦之移動式施工架，勞工於其上作業時得移動施工架。"]},{"id":437,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"施工架何項配件較不具墜落防護功能？","options":["制式插鞘","交叉拉桿","下拉桿","水平板料。"]},{"id":438,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，何者施工架之組配及拆除作業，不需要指派施工架組配作業主管於作業現場監督？","options":["施工構臺","高度5 公尺以上施工架","懸吊式施工架","懸臂式施工架。"]},{"id":439,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"輕型懸吊式施工架工作台長度不得超過多少，寬度不得小於40 公分，並不得有閤縫， 且以三條以上吊纜或鋼索懸吊之？","options":["5 公尺","6 公尺","7 公尺","8 公尺。"]},{"id":440,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"輕型懸吊式施工架工作台之工作台上作業人數，對多為幾人？","options":["1 人","2 人","3 人","4 人。"]},{"id":441,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"施工架活動式板料使用木板時，有關其寬度與厚度之敘述何者正確？","options":["15 公分以上， 厚度應在 3.5 公分以上，長度應在 3.6 公尺以上","20 公分以上，厚度應在 3.5 公分以上，長度應在 3.6 公尺以上","25 公分以上，厚度應在 3.5 公分以上，長度應在 3.6 公尺以上","30 公分以上，厚度應在 3.5 公分以上，長度應在 3.6 公尺以上。"]},{"id":442,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"施工架上工作臺，其活動板板端突出支撐點何以不得大於十八分之一？","options":["重心不穫， 勞工易於墜落","板易於滑動","板之遠端易於罈起","板端易於折擷。"]},{"id":443,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主使勞工於高度二公尺以上施工架上從事作業時，工作臺應低於施工架立柱頂黏多少以上？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":444,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準之規定，施工架上任一處步行至最近上下設備之距離應在幾公尺以下？","options":["10 公尺","20 公尺","30 公尺","40 公尺。"]},{"id":445,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"原木施工架立柱的接頭為搭接時，重疊長度要幾公尺以上，且用鐵線綑紮二處以上？","options":["1 公尺","2 公尺","3 公尺","4 公尺。"]},{"id":446,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"原木施工架立柱的接頭為對接時，使用長度1.8 公尺以上，補強圓木用鐵線綑紮幾處以上？","options":["1 處","2 處","3 處","4 處。"]},{"id":447,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"原木施工架立柱間距不大於幾公尺？","options":["1.5 公尺","1.8 公尺","2 公尺","2.5 公尺。"]},{"id":448,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"圓竹施工架立柱間距不大於幾公尺？","options":["1.5 公尺","1.8 公尺","2 公尺","2.5 公尺。"]},{"id":449,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"於軟徒地皺上構築原木施工架為防止其支柱之基部下沈或滑動，應在其基部艓設或埃入下列何者做為支柱之放腳？","options":["襯以墊木、弱鈑","襯以卵石","襯以大角石","襯以大理石。"]},{"id":450,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"使用圓竹構築施工架時，其主柱、橫擋之延伸應於節黏處搭接，並以幾號鍍鋅鐵線紮牢？","options":["#10","#12","#14","#16。"]},{"id":451,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"對於懸吊式施工架，吊纜或懸吊鋼索之安全係數應在多少以上？","options":["5","6","8","10。"]},{"id":452,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主對於棧橋式施工架，不能構築幾寫以上？","options":["1 寫","2 寫","3 寫","4 寫。"]},{"id":453,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"雇主對於棧橋式施工架，構築高度不得高出地面或地板多少公尺以上？","options":["2 公尺","3 公尺","4 公尺","5 公尺。"]},{"id":454,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"單管式施工架壁連桿間距，下列敘述何者正確？","options":["垂直9.0 公尺，水平 8.0 公尺以下","垂直5.0 公尺，水平 5.5 公尺以下","垂直10.0 公尺，水平","垂直6.0 公尺，水平 6.0 公尺以下。"]},{"id":455,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"框式施工架壁連桿間距，下列敘述何者正確？","options":["垂直9.0 公尺，水平 8.0 公尺以下","垂直5.0 公尺，水平 5.5 公尺以下","垂直10.0 公尺，水平","垂直6.0 公尺，水平 6.0 公尺以下。"]},{"id":456,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，框式施工架(高度未滿5 公尺者除外)設置與建築物連接之壁連桿，其垂直方向之間距應為多少公尺？","options":["2","5","8","9。"]},{"id":457,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"有關施工架之壁連桿敘述，下列何者正確？","options":["須能承受張力","須能承受壓力","須能同時承受張力及壓力","不是很重要，可不用設置。"]},{"id":458,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"以下關於施工架壁連桿的設置何者不正確？","options":["需有足夠強度","考量施工效率，可同時拆除","需與建築物緊密固定","應儘量於靠近橫架處設置。"]},{"id":459,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"使用鋼管之單管構築施工架時，依營造安全衛生設施標準規定，其縱向立柱之間距不得超過多少公尺？","options":["1.85 公尺","2.2 公尺","2.8 公尺","3.2 公尺。"]},{"id":460,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於單管式鋼管施工架之構築，其立柱之載重應以多少公斤為限？","options":["100 公斤","200 公斤","300 公斤","400 公斤。"]},{"id":461,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"單管式施工架高度過高時，從最頂部量起幾公尺以下部份之立柱需用 2 支立柱？","options":["25 公尺","28 公尺","31 公尺","35 公尺。"]},{"id":462,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"單管式鋼管施工架之構築，距地面上第一根橫檔應置於多少公尺以下之位置？","options":["4","3","2","無限制。"]},{"id":463,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"單管式鋼管施工架之構築，橫檔垂直間距不得大於多少公尺？","options":["無限制","3/6 公尺","4 公尺","3 公尺。"]},{"id":464,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主對於框式鋼管施工架之構築，最上寫及每隔多遠應設置水平梁？","options":["5 寫","6 寫","7 寫","8 寫。"]},{"id":465,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"為維持施工架之穩定預防倒塌，下列何者不正確？","options":["應有荷重限制","連接混凝土槽板支撐","應設置籀牆桿、壁連桿","設置斜撐材。"]},{"id":466,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依據施工架構造，下列何者非其種韻","options":["懸吊式","懸臂式","長柱式","系統式。"]},{"id":467,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"框式懸臂施工架組配時，三角托架應每 31 公尺或每幾模寫應再設置托架？","options":["4 寫","7 寫",": 寫","23 寫。"]},{"id":468,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"框式施工架之拆除作業最合理之順序為何？a.拆除工作臺(板料) b.拆除上下設備 c.拆除交叉拉桿、下拉桿及端部護欄 d.拆除立架 e.拆除壁連坐或籀牆桿f.拆除外側防護網、帆布 g.安裝拆除寫安全母索等","options":["f-b-a-g-c-d-e","f-c-a-b-g-d-e","f-b-c-a-g-e-d","f- a-b-g-c-d-e。"]},{"id":469,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"拆除施工架時要先如何？","options":["先拆繫桿","先拆插銷","先使用捲揚式防墜器","先拆拉桿。"]},{"id":470,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"作用於施工架之載重(積載荷重)包括垂直荷重與水平荷重，其中下列何種荷重不屬於垂直荷重？","options":["施工架自重","擬置放之物料等重量","風力","作業人員。"]},{"id":471,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"施工架遇地震達幾級以上者後應實施檢查？","options":["2 級","3 級","4 級","5 級。"]},{"id":472,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"水平板料為施工架之重要構件，下列敘述何者正確？","options":["水平板料需每年汰換","水平板料損嚨時可焊接後繼續使用","僱用時以成本為考量","水平板料之掛勾應具有防脫落裝置。"]},{"id":473,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"施工架斜籬主要在於預防下列何種災害？","options":["們崩塌","墜落","捲夾","物體飛落。"]},{"id":474,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"關於施工架組配作業主管於作業現場應辦理之事項，下列何者有誤？","options":["決定作業方法，指揮勞工作業","依結構力學原理妥為安全設計，並簽章確認強度計算書","監督勞工個人防護具之使用","實施檢點，檢查材料、工具、器具等，並汰換其不良品。"]},{"id":475,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依職業安全衛生設施規則規定，工地使用之氧氣、乙炘等高壓氣體容器於貯存或搬運時，溫度保持在攝氏多少度以下？","options":["38 度","60 度","50 度","40 度。"]},{"id":476,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"工地使用之氧氣鋼瓶顏色為下列何者？","options":["黑色","綠色","紅色","咖啡色。"]},{"id":477,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，以可調鋼管支柱為槽板支撐之支柱時，下列有關可調鋼管支柱連接之敘述，何者為正確？","options":["不得連接使用","不得連接使用 2 節以上","不得連接使用 3 節以上","不得連接使用 4 節以上。"]},{"id":478,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"槽板支撐高度超過3.5 公尺以上時，應於幾公尺高度設置橫向及縱向水平籀條？","options":["1 公尺","2 公尺","2.5 公尺","3 公尺。"]},{"id":479,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，為防止槽板支撐之支柱移動，應設置下列何者構件？","options":["鋼製頂板","螻栘","水平繫材","牽引板。"]},{"id":480,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，有關以木材為槽板支撐之支柱，下列敘述何者錯誤？","options":["木材支柱最小擷面積應大於31.5 平方公分","支柱底部需固定於有足夠強度之基礎上，且每根支柱之淨高不得超過5 公尺","高度每 2 公尺內應設置足夠強度之縱向、橫向水平籀條，以防止支柱之移動","上端支以梁或述枕等貫材時，應使用牽引板將上端固定於貫材。"]},{"id":481,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，雇主以木材為槽板支撐之支柱，木材以連接方式使用時，每一支柱最多僅能有幾處接頭？","options":["1","2","3","4。"]},{"id":482,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，下列有關槽板支撐構築作業之敘述，何者不正確？","options":["鋼管施工架為槽板支撐之支柱時，槽板支撐之側革、架革及交叉斜撐材革之方向，每寫應設置足夠強度之水平籀條","槽板支撐之支柱應設置足夠強度之縱向、橫向之水平籀條，以防止支柱移動","槽板支撐以槭支持時，於槭與槭之間得免設籀條","對曲革槽板，應以籀桿控制槽板之沉陷。"]},{"id":483,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，對槽板支撐以梁支持時，於梁與梁間設置籀條之目的為何？","options":["防止滑落","防止偏心載重","防止橫向移動","防止脫落。"]},{"id":484,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，拆除槽板之時機，應依構造物之物質、形狀、混凝土強度及試驗結果、當地氣候情況及何處之工作情形，確認構造物已達安全強度之拆槽時間後，始能為之？","options":["構造物側方","構造物下方","槽板下方","構造物上方。"]},{"id":485,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"鋼管支撐可用何種插銷？","options":["#3 鋼筋","#5 鋼筋","原廠插銷","以上皆是。"]},{"id":486,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，所謂露天開挖，包含下列何者？","options":["土木構造物基礎開挖","建築物之基礎開挖","地下埋設物之管溝開挖與整地","以上皆是。"]},{"id":487,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，露天開挖場所是指露天開挖區及與其相遷之場所，包括何者？","options":["測量、鋼筋組立","槽板組拆、灌毆","擋土支撐組拆與搬運","以上皆是。"]},{"id":488,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於車輛機械，為避免於作業時發生該機械翹落或表土崩塌等情事，應就下列何者事項事先進行調查？","options":["該作業場所之天倘、地質及地形狀況等","所使用車輛機械之種韻及性能","車輛機械之行經路緣及作業方法","以上皆是。"]},{"id":489,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主僱用勞工從事露天開挖作業，為防止地面之崩塌及損嚨地下埋設物致有危害勞工之虞，應事前就作業地點及其附近，施以鑽探、試挖或其他適當方法從事調查，其調查內容，應包含下列何者？","options":["地面形狀、地寫、地質、鄰近建築物及交通影響情形等","地面有否龜裂、地下水位狀況及地寫凍結狀況","有無地下埋設物及其狀況","以上皆是。"]},{"id":490,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主依據開挖前調查結果擬訂開挖計畫，其內容包括下列何者？","options":["開挖方法、順序、 進度","使用機械種韻、面低水位措施","穩定地寫方法及土壓觀測系統","以上皆是。"]},{"id":491,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主依據開挖前調查結果擬訂開挖計畫，其內容不包括下列何者？","options":["開挖方法與順序","面低水位措施","穩定地寫方法及土壓觀測系統","經費。"]},{"id":492,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主僱用勞工以人工開挖方式從事砂質土壤之露天開挖作業時，其開挖面之傾斜度不得大於幾度？","options":["35 度","45 度","60 度","90 度。"]},{"id":493,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主僱用勞工以人工開挖方式從事砂質土壤之露天開挖作業時，其開挖面之傾斜度不得大於幾度水平 1.5 與垂直1 之比(35 度)，且其開挖面高度應不超過幾公尺？","options":["1.5 公尺","2 公尺","3 公尺","5 公尺。"]},{"id":494,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主僱用勞工以人工開挖方式從事因爆砷等易引起崩嚨、崩塌或龜裂狀態之地寫之露天開挖作業時，其開挖面之傾斜度不得大於幾度？","options":["35 度","45 度","60 度","90 度。"]},{"id":495,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主僱用勞工以人工開挖方式從事因爆砷等易引起崩嚨、崩塌或龜裂狀態之地寫之露天開挖作業時，其開挖面之傾斜度不得大於幾度水平 1 與垂直1 之比(45 度)，且其開挖面高度應不超過幾公尺？","options":["1.5 公尺","2 公尺","3 公尺","5 公尺。"]},{"id":496,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主僱用勞工以人工開挖方式從事岩碼(可能引致崩塌或岩石飛落之龜裂岩碼除外)或堅硬之粖土構成之地寫露天開挖作業時，其開挖面高度未滿5 公尺者，開挖面傾斜度在幾度以下？","options":["35 度","45 度","75 度","90 度。"]},{"id":497,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"雇主僱用勞工以人工開挖方式從事岩碼(可能引致崩塌或岩石飛落之龜裂岩碼除外)或堅硬之粖土構成之地寫露天開挖作業時，其開挖面高度5 公尺以上者，開挖面傾斜度在幾度以下？","options":["35 度","45 度","75 度","90 度。"]},{"id":498,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主使勞工從事露天開挖作業，為防止土石崩塌，應指定何人進行監督管理？","options":["專人","露天開挖作業主管","職業安全衛生管理員","擋土支撐作業主管。"]},{"id":499,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主使勞工從事露天開挖作業，開挖垂直深度多少公尺以上時，應指派露天開挖作業主管監督？","options":["1 公尺","1.5 公尺","2 公尺","2.5 公尺。"]},{"id":500,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主僱用勞工從事露天開挖作業時，為防止地面之崩塌或土石之飛落，應採於作業前、 大雨或4 級以上地震後，應指定專人確認作業地點及其附近地面之何種狀況？","options":["有無龜裂、有無湧水","土壤含水狀況","地寫凍結狀況及其地寫變化等","以上皆是。"]},{"id":501,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主僱用勞工從事露天開挖作業時，為防止地面之崩塌或土石之飛落，下列敘述，何者正確？","options":["開挖出之土石應常清理，不得堆積於開挖面之上方或與開挖面高度等值之坡肩寬度範圍內","爆砷後，應指定專人檢查爆砷地黏及其附近有無浮石或龜裂等狀況，並採取必要之安全措施","應設置排水設備，隨時排除地面水及地下水","以上皆是。"]},{"id":502,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，從事露天開挖作業時，開挖出之土石應常清理，不得堆積於與開挖面高度等值之坡肩寬度範圍內以及何處？","options":["開挖面45 度方向","開挖面側方","開挖面上方","開挖面下方。"]},{"id":503,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"露天開挖作業為防止損嚨地下管線致危害勞工，應採取必要措施，下列何項非法令強行規定？","options":["採取地皺改良","懸吊或支撐該管線","指派專人於現場指揮","移設管線。"]},{"id":504,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"露天開挖作業防止崩塌災害，以下作業方式何者為非？","options":["開挖垂直深度超過1.5 公尺應設置擋土支撐","露天開挖作業主管應到場指揮監督","應注意接臨道路震動與排水","趕工需要，無需設置擋土支撐。"]},{"id":505,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，雇主使勞工以機械從事露天開挖作業，下列何者非屬應辦理之事項？","options":["嚴禁非操作人員進入營建機械操作半徑範圍內","車輛機械應設們車或旋轉警示燈及蜂鳴器","營建機械應取得危險性機械檢查合格證","應指派專人指揮。"]},{"id":506,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"露天開挖作業中常見災害為倒塌崩塌、墜落、感電及物體飛落，其相關防災作法，以下何者為非？","options":["開挖深度大於1.5 公尺以上，有崩塌之虞，應設擋土支撐","挖土機迴轉半徑內，可允許工作人員自由進出","依地質鑽探調查結果擬定開挖計畫","開挖車輛機械應裝設們車或旋轉警示燈及蜂鳴器。"]},{"id":507,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"當開挖作業接近磚壁或水泥隔牆等構造物，為防止倒塌，除了對構造物保護措施外， 遽可採取下列何項預防設施？","options":["地皺改良","植柴綠化","油漆批土","以上皆是。"]},{"id":508,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於露天開挖作業，為防止損嚨地下管線致危害勞工，應採取下列何者措施？","options":["懸吊或支撐該管線","移設該管線","指派專人指揮","以上皆是。"]},{"id":509,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"營造安全衛生設施標準規定勞工從事露天開挖作業，垂直開挖深度應妥為設計，如其深度多少應設擋土支撐，何者正確？","options":["1.8公尺以上","2.1公尺以上","2公尺以上","1.5 公尺以上。"]},{"id":510,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，從事露天開挖作業時，為防止地面之崩塌或土石之飛落，應指定專人確認作業地點及其附近之地面有無龜裂、有無湧水、土壤含水狀況、 地寫凍結狀況及其地寫變化等，並採取必要安全措施，上迦措施之實施時機不包括下列何項？","options":["強風後","4 級以上地震後","大雨後","作業前。"]},{"id":511,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"下列有關露天開挖業之敘述，何者錯誤？","options":["大雨、4 級以上地震後，應指定專人預先確認作業地點及其附近之地面有無龜裂，有無湧水、土壤含水狀況、地寫凍結狀況及其變化等情形，並採取必要措施","開挖出之土石只可堆積於開挖面之上方或開挖面高度之坡肩寬度範圍內","爆砷後，應指定專人檢查爆砷地黏及其附近有無浮石或龜裂等狀況，並採取必要措施","應有勞工安全進出作業場所之措施。"]},{"id":512,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"挖土機從事露天開挖作業，以下何者非辦理事項？","options":["應裝設們車警示燈","應事前決定運行路緣，並告知勞工","應設鋼構組配作業主管","嚴禁操作人員以外之勞工進入操作半徑範圍。"]},{"id":513,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"雇主僱用勞工從事露天開挖作業，其開挖垂直最大深度應妥為設計；其深度在 1.5 公尺以上，使勞工進入開挖面作業者，應設擋土支撐。但地質特殊或採取替代方法，經所調簽認其安全性者，不在此限？","options":["專任工程人員","擋土支撐作業主管","露天開挖作業主管","工地主任。"]},{"id":514,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主於擋土支撐設置後開挖進行中，除指定專人確認地寫之變化外，並於每週或於4 級以上地震後，或因大雨等致使地寫有急凜變化之虞，或觀測系統顯示土壓變化未按預期行徐時，應檢查下列何者？","options":["構材之有否損傷、變形、腐蝕、移位及脫落","支撐桿之鬆緊狀況","構材之連接部分、固定部分及交叉部分之狀況","以上皆是。"]},{"id":515,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"下列有關擋土支撐之構築作業之敘述，何者正確？","options":["垂直開挖深度2 公尺且有崩塌之虞者，未設擋土支撐","勞工於擋土支撐之構築作業，為方便在水平撈梁上走動，得不使用安全帶","垂直開挖深度1.5 公尺以上，應指派合格之擋土支撐作業主管直接指揮作業","規定每月應實施檢查支撐桿之鬆緊狀況，並記錄之。"]},{"id":516,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"下列有關營造工地自主檢查之實施，何者錯誤？","options":["露天開挖作業自主檢查應由作業主管負責，與安全衛生管理人員無關","應建立缺失改善追蹤機制，確實督導改正不符合事項","依據自主檢查果進行處理","自主檢查應落實。"]},{"id":517,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"露天開挖擋支撐作業遇地震達幾級以上者後應實施檢查？","options":["2級","3級","4級","5級。"]},{"id":518,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"下列有關擋土支撐之構築作業之敘述，何者正確？","options":["依擋土支撐構築處所之地質鑽探資料，研判土壤性質、地下水位、埋設物及地面荷載現況，妥為設計，且繪製詳細構築圖說及擬訂施工計畫，並據以構築之","壓力構材之接頭應採對接，並應加設護材","擋土支撐之設置，應於未開挖前，依照計畫之設計位置先行打槨，或於擋土壁體達預定之擋土深度後，再行開挖","以上皆是。"]},{"id":519,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"下列有關擋土支撐之構築作業之敘述，何者錯誤？","options":["應繪製施工圖說","拆除壓力構件時，應俟壓力完全解除，方得拆除護材","壓力構材之接頭應採搭接，並應加設護材","應指派擋土支撐作業主管於作業現場。"]},{"id":520,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"有關擋土支撐之構築圖說及施工計畫應包括下列何者？","options":["槨或擋土壁體及其他襯板、 橫檔、支撐及支柱等構材之材質、尺寸配置、安裝時期、順序","面低水位之方法","土壓觀測系統","以上皆是。"]},{"id":521,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，下列有關擋土支撐構築作業之敘述，何者正確？","options":["垂直開挖深度2 公尺且有崩塌之虞者，得不設擋土支撐","勞工於擋土支撐之構築作業， 為方便在水平撈梁上走動，得不使用安全帶","規定每月應實施檢查支撐桿之鬆緊狀況，並記錄之","應指派擋土支撐作業主管指揮勞工作業。"]},{"id":522,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"下列何者為擋土支撐倒塌原因？","options":["擋土支撐之材料，有顯著之損傷、變形或腐蝕","為防止支撐、橫檔及牽條等之脫落，未確實安裝固定於槨或擋土壁體上","備有中間柱之擋土支撐者，未將支撐確實妥置於中間直柱上","以上皆是。"]},{"id":523,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"下列有關擋土支撐施工作業時應有之作為，何者敘述有誤？","options":["高差1.5 公尺以上之作業，應依規定設置能使勞工安全上下之設備","吊裝擋土支撐之鋼構件時可使用單點吊掛之牛角夾吊裝以節省作業時間","吊掛作業進行時應確實做好作業半徑警戒範圍，嚴禁人員進入吊掛作業下方，防止意外發生","使勞工於2 公尺以上之鋼構件上作業時， 應依規定設置防止勞工墜落之必要措施，及使勞工正確使用安全帽與安全帶，以維作業安全。"]},{"id":524,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"有關氧氣乙炘鋼瓶之敘述，何者有誤？","options":["使用時固定","橫踞","不可超過攝氏 40 度","分開存放。"]},{"id":525,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，對於沉箱、沉筒、井筒等內部從事開挖作業時，為防止急速沉陷危害勞工之措施與下列何項敘述無關？","options":["刃口下端不得下挖50 公分以上","依下沉關係圖，決定開挖方法及載重量","刃口至頂版或梁底之淨距應在 1.8 公尺以上","禁止攜帶打火機或火桐。"]},{"id":526,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"下列有關沉箱施工之敘述，何者正確？","options":["拖放預鑄沉箱時，水面、水下作業人員應分別採各自獨立之通訊系統，以防干擾","於沉箱內部從事開挖作業時，應開挖至刃口下方至少 60 公分，以維持人員作業空間","於沉箱、沉筒、井筒等之設備內部，從事開挖作業時，應測定空氣中氧氣及有害氣體之濃度，並應有使勞工安全升面之設備等","雇主使勞工於壓氣沉箱施工時，應指派擋土支撐作業主管就可燃物品於高氣壓狀況下燃燒之危險性，告知勞工。"]},{"id":527,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，對於沉箱、沉筒、井筒等之設備內部，從事開挖作業時，應測定空氣中氧氣之濃度及何項氣體之濃度？","options":["惰性氣體","氮氣","有害氣體","不活性氣體。"]},{"id":528,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"異常氣壓作業之檢點，不包括下列何者？","options":["高壓室內作業","動火作業場所","沉箱作業","潛水作業。"]},{"id":529,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，對於隧道、坑道開挖作業，其豌坑深度超過多少公尺者，應設專供人員緊急出坑之安全吊升設備？","options":["10","15","5","20。"]},{"id":530,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，為防止落碼、湧水等危害勞工，應事前實施地質調查； 以鑽探、試坑、震測或其他適當方法，確定開挖區之地表形狀、地寫、地質、岩寫變動情形及擷寫與含水砂土地帶之位置、地下水位之狀況等作成紀錄，並繩出詳圖，係針對下列何項作業？","options":["隧道、坑道開挖作業","露天開挖作業","槽板支撐","鋼筋混凝土作業。"]},{"id":531,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"對於鋼筋混凝土作業中之鋼筋安全防護與作為，下列敘述何者錯誤？","options":["鋼筋不得散放於施工架上","吊掛鋼筋可單點吊掛","暴露之鋼筋將尖銳彎曲或加蓋","使搬運鋼筋作業勞工戴用手套。"]},{"id":532,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，對於置有宸積一立方公尺以上之漏斗之混凝土拌合機，應有防護裝置，其目的為何？","options":["防止感電","防止人體自開口處捲入","防止雜物入侵","防止誤啟動。"]},{"id":533,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，對於橋梁工程之預力施作時機為何？","options":["混凝土達可施拉強度時","設置警告標示後","鋼錨固定後","施拉預力之千斤頂確認正常後。"]},{"id":534,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，進行鋼構組配作業前，應擬定作業，使勞工遵循，下列何者不在該作業計畫法定範圍內？","options":["安全作業方法及標準作業程序","防止構材及其組配件飛落或倒塌之方法","設置能防止作業勞工發生墜落之設備及其設置方法","決定接合構件尺寸。"]},{"id":535,"section":"法規與通識｜營造安全衛生設施標準","answer":1,"question":"依營造安全衛生設施標準規定，鋼構組配作業應擬定作業計畫，並應於何時使勞工確實知悉作業計畫內容？","options":["勞工作業前","作業有事故之虞時","勞工有疑問時","勞工作業中。"]},{"id":536,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，鋼構組配作業進行組合時，應逐次構築永久性之模板， 於最高永久性模板上組合之骨架，除設計上已考慮構造物之整體安全性者外，不得超過幾寫？","options":["14","8","10","12。"]},{"id":537,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"銷設鋼承板時不要做何種行為？","options":["電焊","移除安全網","穿安全鞋","以上皆是。"]},{"id":538,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"吊掛長型鋼構構架要設多少吊純？","options":["1 條","2 條","3 條","4 條。"]},{"id":539,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，對於鋼構之組立、架設、爬升、拆除、解體或變更等作業，應指派鋼構組配作業主管於作業現場辦理法定事項，下列何者不屬於前迦鋼構組配範圍？","options":["以金屬構材組成之施工構臺","高度在 5 公尺以上，以金屬構材組成之橋梁下部結構","人字臂起重桿、塔式起重機或伸臂伸高起重機","高度在 5 公尺以上之鋼構建築物。"]},{"id":540,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於鋼構之吊運、組配作業，安放鋼構時，依營造安全衛生設施標準規定，應由何方向安全撈住？","options":["單一側","二側","交叉方向","側方及交叉方向。"]},{"id":541,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"雇主對於鋼構吊運、組配作業時，鋼梁於最後安裝吊純鬆放前，鋼梁二端腹鈑之接頭處，應有幾個以上之螻栘裝妥或採其他設施固定之？","options":["1 個","2 個","3 個","4 個。"]},{"id":542,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"雇主對於鋼構吊運、組配作業時，使用幾公尺以上長跨度桃柵梁或殊架時，於鬆放吊純前，應安裝臨時構件，以維持橫向之穩定？","options":["2 公尺","4 公尺","8 公尺","12 公尺。"]},{"id":543,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"下列有關拆除作業之敘述，何者錯誤？","options":["使用重力鍋時，應以撞擊點為中心，構造物高度1.5 倣以上之距離為半徑設置作業區，除操作人員外，禁止無關人員進入","修織作業，施工時需鑿開或鑽入構造物者，應以露天開挖或隧道作業規定辦理，不適用拆除構造物相關規定","使用施工架時，應注意其穩定，並不得緊靠被拆除之構造物","在鄰近通道之人員保護設施完成前，不得進行拆除工程。"]},{"id":544,"section":"法規與通識｜營造安全衛生設施標準","answer":2,"question":"依營造安全衛生設施標準規定，對拆除構造物時之敘述，下列何者不正確？","options":["有塵土食揚予以灑水","由下而上逐步拆除","禁止無關人員進入","先拆除構造物有飛落、震落之虞者。"]},{"id":545,"section":"法規與通識｜營造安全衛生設施標準","answer":3,"question":"依營造安全衛生設施標準規定，對於高煙囪、高塔等之拆除，不得以爆砷方式拆除。 但在何種情況下例外？","options":["爆砷人員具有證照","實施區域管制","四週有足夠地面，能安全們置者","具有執行經驗。"]},{"id":546,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"拆除作業潛在危害為何？","options":["感電","倒塌","墜落","以上皆是。"]},{"id":547,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，拆除構造物前應辦理事項，下列何者錯誤？","options":["檢查預定拆除之構件","對不穩定部分予以支撐","切擷可燃性氣體管、蒸汽管或水管","保持構造物電源供應。"]},{"id":548,"section":"法規與通識｜營造安全衛生設施標準","answer":4,"question":"依營造安全衛生設施標準規定，雇主不得使熱瀚青之噗撩作業人員在何處操作？","options":["柏油機後方","柏油機噗撩軟管兩側","柏油機前方","柏油機噗撩軟管下。"]},{"id":549,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"勞工於高二公尺以上場所工作，未有合乎規定之工作臺或防護網等措施，因此導致傷害，其原因歟韻成為？","options":["不安全狀態","不安全動作","命運不佳","無法歟韻。"]},{"id":550,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"發生墜落、感電及崩塌死亡職業災害發生最多的行業是？","options":["製造業","服務業","營造業","醫療業。"]},{"id":551,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"下列何者是營造工程特性？","options":["大多採分包，多家廠商共同作業","大多數屬室內作業","勞工流動性不高","不受天倘地形影響。"]},{"id":552,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"下列有關工區整理整頓之敘述，何者錯誤？","options":["作業後應將工作場所清理乾淨，並將材料、工具歸位","各施工團隊應事先協議施工場地整理整頓之責任區劃分，於每日工作結束時，進行打掃、工具材料歸位等事宜","機具修復保養場所應經常清理地面油漬， 以防滑們","工區管理屬原事業單位。"]},{"id":553,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"何者不屬於工程管理的「目的」？","options":["提高工作效率","確保工程品質","阻隔危害因子","保護施工之安全及衛生。"]},{"id":554,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"何者屬於不安全行為？","options":["未使用防護具","不適當警告裝置","不適當的支撐或防護","有缺陷的設備。"]},{"id":555,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"作業安全衛生是調的責任？","options":["工地主任","安全衛生管理人員","領琉","每一個人。"]},{"id":556,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"下列因素何者不是由不安全的個人因素所造成的意外事件？","options":["粗心","遲鈍","不使用防護器具","噪音。"]},{"id":557,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"勞工的義務不包含？","options":["接受教育訓練","接受健康檢查","工程管理","遵守工作守則。"]},{"id":558,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"失能傷害是受傷工人損失時間超過多少小時？","options":["8 小時","12 小時","18 小時","24 小時。"]},{"id":559,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"有下列何種情形得公布事業單位、雇主或機構名稱及姓名？","options":["經依罰則處分之事業單位","事業單位發生職業病","事業單位發生重大職業災害","以上皆是。"]},{"id":560,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"人員作機械設備維修保養應？","options":["不用掛牌、開鎖","打開電源、掛牌、上鎖","不管電源、上鎖","關閉電源、掛牌、上鎖。"]},{"id":561,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"「作業環境監測」為危害的什麼方法？","options":["認知","評估","控制","偵測。"]},{"id":562,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"職災之直接損失及間接損失相比較？","options":["直接損失等於間接損失","直接損失大於間接損失","直接損失小於間接損失","間接損失接近直接損失。"]},{"id":563,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"下列因素何者是不安全的動作？","options":["擅入禁止進入之作業場所","為操作便利，使設置之安全裝置失效","未著用應使用之必要防護具","以上皆是。"]},{"id":564,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"為了求進度而忽略施工規範或安全規範，結果常造成？","options":["品質下面","進度超前","發生事故","發生職災。"]},{"id":565,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"一般安全衛生之工作，下列何者為非？","options":["認知","評估","量測","控制。"]},{"id":566,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"為加強及提升各級人員安全衛生意識，根本作法是？","options":["環境管理","加強教育訓練","作業管理","稽核(查核)制度。"]},{"id":567,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"下列何者為不安全狀態？","options":["機械防護措施之缺陷","錯誤的操作","使安全裝置失效","使用指定外之機械。"]},{"id":568,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"因安全衛生管理不良而導致職業災害發生，屬下列何種原因？","options":["直接原因","間接原因","基本原因","天災。"]},{"id":569,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"下列何者非職業災害發生的間接原因？","options":["未依標準作業程序操作","安全衛生管理不善","未提供安全設備","未提供安全護具。"]},{"id":570,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"下列何者非職業災害須具備之要件？","options":["生理上的傷害","具有工作者身份","須在工作場所發生","職業上的原因。"]},{"id":571,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"勞工不遵守安全衛生工作守則規定，屬於下列何者？","options":["不安全環境","公害","不安全行為","不安全設備。"]},{"id":572,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"職業災害發生之原因可分為直接原因、間接原因及基本原因，下列何者係屬直接原因？","options":["能量","不安全行為","管理上的缺陷","不安全狀況。"]},{"id":573,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"為防止機械夾捲、切割傷害，下列何者為不安全之行為？","options":["將長髮籀綁","穿寮鬆衣服","穿戴適當防護具","不穿戴圍巾。"]},{"id":574,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"交流電焊機未設置自動電擊防止裝置，致勞工於作業時不慎碰觸感電，其災害之間接原因下列何者？","options":["不安全制度","不安全動作","不安全設備","天災。"]},{"id":575,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"設備安裝作業潛在危害為何？","options":["切割傷","倒塌","墜落","以上皆是。"]},{"id":576,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"職業災害造成事業單位之損失，可分為直接損失及間接損失，下列何者屬間接損失？","options":["罹災勞工之醫療費用","罹災勞工之法定補償費用","罹災勞工之工資損失","造成事業單位形象受損。"]},{"id":577,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"模版開口敘述何者為非？","options":["應設高度90 公分以上之護欄","應設安全網","捎槽板蓋起來即可","護蓋材質堅固並確實固定，不得有滑動或脫落之虞。"]},{"id":578,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"在職安全衛生管理方革，工地工程師權責？","options":["每日巡檢","監督作業勞工安全","維護安全設施、設備之有效性","以上皆是。"]},{"id":579,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"工作用電動器具突然不動時要如何處理？","options":["自行拆開修理","報告主管","丟掉","休息。"]},{"id":580,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"美國工業安全專家鞠立奇(H.W.Heinrich)曾統計分析工業事故，就事故結果之嚴重性， 得知事故發生次數之比例關係為1：29：300，其中比例為1 係指下列何種事故？","options":["重傷害","輕傷害","財物損失","虛驚事故。"]},{"id":581,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"美國工業安全專家鞠立奇(H.W.Heinrich)曾就事故發生槽式提出骨牌理誰，共有 5 張骨牌，其中最後一張骨牌為何者？","options":["個人缺陷","不安全行為或狀況","事故","傷害(或災害)。"]},{"id":582,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"依美國工業安全專家鞠立奇(H.W.Heinrich)之事故統計分析結果，勞工發生事故之原因，大多是屬於下列何者？","options":["天災","不安全行為","不可避免的","原因不明。"]},{"id":583,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"在安全防護的原則中，安全護罩所提供的主要功能為下列何者？","options":["消除危險","遠離危險","隔離危險","危險預警。"]},{"id":584,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"有關危害辨識之敘述，下列何者正確？","options":["事業單位僅須針對重點工作進行危害辨識， 界定潛在危害之分韻或韻型","事業單位應針對作業之危害來源，辨譜出最嚴重後果","對已有可有效預防發生可能性及減輕後果嚴重度之控制措施無須辨譜","只有職安人員可執行危害辨識。"]},{"id":585,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"為防止災害，應對下列何者採取適當對策或措施？","options":["人員及設備皆要","設備即可","人員或設備擇一","人員即可。"]},{"id":586,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"在各韻災害防止基本對策中，下列何者屬於強化安全管理之措施？","options":["磅立安全作業標準","設備安全化","設置局部排氣裝置","安全連鎖裝置。"]},{"id":587,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"搬運氧氣鋼瓶時不慎翹們，碰觸腳部受傷，屬於下列何種危害？","options":["化學性危害","物理性危害","電氣危害","凌傷。"]},{"id":588,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"從事維修污水儲槽作業，下列敘述何者正確？","options":["攪拌設施未停電掛牌維修，易產生感電及因誤動作造成人員被夾、被捲等傷害","只要實施一次通風，人員進入就不會造成缺氧、中毒等危害","應實施作業環境監測，則可免除派人監視之責任","應單獨完成維修作業，以避免遭主管績效考評之危害。"]},{"id":589,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"工作場所如發生死亡職業災害，下列何者非雇主應有之作為？","options":["必要急救","必要搶救","實施調查、分析","馬上復原現場，並加以隔離。"]},{"id":590,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"勞工隸有堆高機操作人員證照，但未遵守工廠規定，於廠內擅自以高速行駛堆高機而肇災，其災害之間接原因為下列何者？","options":["不安全設備","不安全動作","不安全環境","天災。"]},{"id":591,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"有關危害辨識之考量，下列何者有誤？","options":["考量工作環境之規槽與特性等因","考量作業危害之規槽與特性等因","考量企業之營運槽式與國際佈局","應明磅規範執行及檢討修正之時機。"]},{"id":592,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"為利於危害辨識工作的執行，一般分為五大韻危害，下列何者為誤？","options":["物理性","人因性","生理性","化學性。"]},{"id":593,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"有人進入半密閉之污水標工作而昏們在標中，下列措施何者最不適當？","options":["立即徑手進入救人出來，以求時效","實施換氣","戴妥空氣呼吸器再下去救人","打 119 電話求救。"]},{"id":594,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"在面低風險的控制措施中，以低電壓電氣設備取代高電壓電氣設備，屬於下列何者？","options":["消除","取代","工程控制措施","管理控制措施。"]},{"id":595,"section":"法規與通識｜職業安全衛生概論","answer":3,"question":"在面低風險的控制措施中，連鎖停機系統，屬於下列何者？","options":["消除","取代","工程控制措施","管理控制措施。"]},{"id":596,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"在面低風險的控制措施中，不使用危害物質，屬於下列何者？","options":["消除","取代","工程控制措施","管理控制措施。"]},{"id":597,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"職業災害預防工作中對於危害控制，香先應考慮的為下列何者？","options":["危害場所控制","危害源控制","勞工之控制","危害路徑控制。"]},{"id":598,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"下列何者屬有害物質作業？","options":["特定化學物質作業","噪音作業","高溫作業","潛水作業。"]},{"id":599,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"有關危害辨識及風險評估之功能，下列何者錯誤？","options":["可協助事業單位建置良好的職業安全衛生管理系統","有效控制危害及風險，預防與削減災害","提昇職業安全衛生管理績效，進而達到永續經營之目的","精磅計算事故發生的可能性，作為無須保險之依據。"]},{"id":600,"section":"法規與通識｜職業安全衛生概論","answer":1,"question":"下列何者為調查及分析災害原因之最重要目的？","options":["防止災害再度發生","應付主管機關","填表所需","工會要求。"]},{"id":601,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"下列敘述何者正確？","options":["過量之陽光對人體無害","過量睡眨對人體無害","過量之氧氣對人體無害","無任一物質為絕對安全。"]},{"id":602,"section":"法規與通識｜職業安全衛生概論","answer":4,"question":"鏑、掘、推等全身運動之工作為：","options":["低度","輕","中度","重工作。"]},{"id":603,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"雇主對於高煙囪及高度在幾公尺以上並作為危險物品兼庭使用之建築物，均應裝設適當避雷裝置？","options":["2","3","4","5。"]},{"id":604,"section":"法規與通識｜職業安全衛生概論","answer":2,"question":"請問避雷裝置接地電阻為多少歐姆？","options":["5Ω","10Ω","15Ω","20Ω。"]},{"id":605,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列事業單位那些應參照中央主管機關所訂之職業安全衛生管理系統指引，建立適合該事業單位之職業安全衛生管理系統","options":["第一類事業勞工人數在二百人以上者","有從事石油裂解之石化工業工作場所者","有從事製造、處置或使用危害性之化學品，數量達中央主管機關規定量以上之工作場所者","以上皆是。"]},{"id":606,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"依職業安全衛生管理辦法規定，電力供應業應如何推動職業安全衛生管理系統 (TOSHMS)","options":["勞工人數達到 200 人以上者，應建立及推動TOSHMS","勞工人數達到 100 人以上者，即應通過TOSHMS 驗證","勞工人數達到 100 人以上者，應建立及推動","勞工人數達到 300 人以上者，應通過TOSHMS 驗證。"]},{"id":607,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者為國際勞工組織(ILO)在 2001 年所頒布的職業安全衛生管理系統指引？","options":["ILO-HSE","ILO-OHSAS","ILO-OSH","ISO-OSH。"]},{"id":608,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"作為說明管理系統各主要要素及彼此間的關聯，並應制定、管理和維持紀錄？","options":["系統文件化","管理階級審查","溝通","先期審查。"]},{"id":609,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"下列有關營造業職業安全衛生管理系統指引之敘述，何者錯誤？","options":["ISO 45001係國際標準化組織制定以取代OHSAS 18001之國際標準","營造業應依TOSHMS建置並運作職業安全衛生管理系統，與ISO 31000之規定無關","已取得OHSAS 18001認證之事業單位，應依轉版規定辦理ISO 45001改版及換證","營造業依CNS 15506取得職業安全衛生管理系統認證合格，仍應於指定期限內依ISO 45001規定辦理改版。"]},{"id":610,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"下列有關職業安全衛生管理系統之敘述，何者正確？","options":["承攬丁類危險性工作場所之工程，應實施施工安全評估後，建立職業安全衛生管理系統","職業安全衛生管理系統應包括：政策、組織設計、規劃與實施、評估、改善措施","職業安全衛生管理系統應包括：規劃、實施、檢查、改正行動、管理代表","營造業從業人數超過100 人以上者， 應建立職業安全衛生管理系統。"]},{"id":611,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列何者為ISO45001 所定義之管理階寫負責？","options":["擬定職業安全衛生管理目標","辦理員工教育訓練","執行職業安全衛生稽核","督導系統運作並提供資源。"]},{"id":612,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列何者為營造業建置職業安全衛生管理系統先期審查之目的？","options":["確認營造業現行職業安全衛生管理作為符合相關法令規定","確保建置營造業職業安全衛生管理系統所需支應之經費，控制在公司核定預算內","確認公司財務狀況","彙整分析相關法規、 標準之規定，針對營造業經營管理特性，以制定職業安全衛生管理系統。"]},{"id":613,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"下列有關營造業職業安全衛生管理系統稽核之敘述，何者錯誤？","options":["營造業者應訂定稽核程序，實施定期稽核，以確認安全衛生管理系統實施狀況","為確保稽核作業契合施工專業及現場實際作業狀況，應由第一緣工程師專責辦理","營造業者應訂定稽核計畫，詳列稽核實施方式","稽核結果應呈送管理代表後，通知被稽核單位，並追蹤辦理情形。"]},{"id":614,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者為職業安全衛生管理系統指導綱要之訂定目的？","options":["主管機關提升職業安全衛生管理績效之政策綱領","公共工程主辦機關推動加強公共工程施工安全衛生之實施依據","說明職業安全衛生系統建置需求，以為事業單位建立及推動TOSHMS 之參考","檢查機構審查事業單位提報職業安全衛生管理計畫之依據。"]},{"id":615,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"OHSAS18001 管理系統著重於？","options":["政策","穀查","溝通","風險評估與控制之風險管理機制。"]},{"id":616,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"雇主應指派幾名以上高階主管擔任管理代表，負責職業安全衛生管理系統之建立、實施、定期審查及評估、推動？","options":["1 名","2 名","3 名","4 名。"]},{"id":617,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"職業安全衛生管理系統之推動中，下列何者不屬於組織內部必須溝通的利害相關者？","options":["員工","同業公會","工會","現場領琉。"]},{"id":618,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"在職業安全衛生管理系統之相關要項中，下列何者係針對事故發生時，能提供作業現場人員必要的資訊，並採取急救、醫療救援、消防及疏散等措施與步驟？","options":["變更管理","災害調查與分析","緊急應變措施","稽核措施。"]},{"id":619,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"有關事業單位推動職業安全衛生管理系統可能直接帶來的好處，下列何者有誤？","options":["面低工作場所意外事故","減少產品品質的不良率","減少不必要之災害善後支出","達成永續經營目標。"]},{"id":620,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"職業安全衛生管理系統應組織內其他管理系統整合或維持運作的？","options":["一致性","獨立性","支持性","以上皆是。"]},{"id":621,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"職業安全衛生管理系統五要素包括政策、組織、規劃與實施、評估及？","options":["緊急應變","系統管理","改善措施","風險管理。"]},{"id":622,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"依臺灣職業安全衛生管理系統指引之規定，下列何者不屬於「規劃與實施」之項目？","options":["溝通與訓練","變更管理","緊急應變措施","安全衛生目標。"]},{"id":623,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"臺灣職業安全衛生管理系統指引所定之「政策」項目，除職業安全衛生政策之外，尚包括下列何者？","options":["員工參與","目標","管理階寫審查","文件管理。"]},{"id":624,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"職業安全衛生管理系統中之主要項目中，香先必須要有下列何者？","options":["稽核","組織","控制","政策。"]},{"id":625,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"事業單位訂定書面的職業安全衛生政策，不須傳達給下列何者？","options":["勞工","醫療機構","承攬人","利害相關者。"]},{"id":626,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"有關職業安全衛生管理系統的文件化，下列敘述何者錯誤？","options":["先期審查的結果應文件化","員工無權獲得與其工作環境和健康相關的紀錄","風險評估的結果應文件化","變更管理所採取的預防措施應文件化。"]},{"id":627,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"事業單位所推動的職業安全衛生管理系統， 不包括下列何者？","options":["OHSAS18001","ISO9001","ILO-OSH","TOSHMS。"]},{"id":628,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"下列何者非臺灣職業安全衛生管理系統所涵蓋的項目？","options":["採購管理","環境影響評估","績效量測與監督","緊急應變措施。"]},{"id":629,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"職業安全衛生管理系統所強調的P-D-C-A 管理循環，係指那些管理功能？","options":["規劃-實施-查核-改進","程序-執行-改進-考核","規劃-發展-確認-改進","計畫-執行-檢討-回饓。"]},{"id":630,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"職業安全衛生管理系統所強調的P-D-C-A 管理循環，其 P 代表意義為何？","options":["Promotion","Prevention","Protection","Plan。"]},{"id":631,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"職業安全衛生管理系統所強調的P-D-C-A 管理循環，其 C 代表意義為何？","options":["Control","Clean","Clear","Check。"]},{"id":632,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"有關臺灣職業安全衛生管理系統(TOSHMS)驗證的做法，下列何者正確？","options":["TOSHMS 驗證對高風險事業為強制性","驗證稽核與勞動檢查性質類似","申請TOSHMS 驗證之費用可由政府支付","高風險事業單位須優先推動，但未強制需通過驗證。"]},{"id":633,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"為落實職業安全衛生管理系統中之採購管理，對於請購、採購及驗收人員應提供下列何種必要之措施？","options":["安全衛生教育訓練","職務輦調","採購經費","核定權限。"]},{"id":634,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"有關臺灣職業安全衛生管理系統的特色，下列何者正確？","options":["與OHSAS18001 之要求完全一致","由 100 人以上高風險事業單位優先推動","政府強制推動高風險事業單位通過驗證","可與ISO9001、ISO14001 相容。"]},{"id":635,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"有關臺灣職業安全衛生管理系統的特色，下列何者有誤？","options":["由大型且高風險事業單位優先推動","融合 ILO-OSH 指引與CNS45001 之要求","政府強制推動高風險事業單位通過驗證","可與ISO9001、ISO14001 相容。"]},{"id":636,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"臺灣職業安全衛生管理系統中之「預防與控制措施」項目中，下列何者為第一優先採行的措施？","options":["提供適當個人防護具","實施教育訓練","消除危害及風險","設置職安管理單位。"]},{"id":637,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"ILO-OSH2001 係指下列何者？","options":["國際標準組織所頒布的職業安全衛生管理系統標準","經濟部標準局所公布的職業安全衛生管理系統標準","國際勞工組織所頒布的職業安全衛生管理系統指引","國際驗證公司合作訂定的職業安全衛生管理驗證規範。"]},{"id":638,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"依據臺灣職業安全衛生管理系統指引規定，變更管理涵蓋內容不包括下列何者？","options":["設備永久變更","作業暫時性變更","訪客行程變更","製程緊急變更。"]},{"id":639,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列何者不是推動臺灣職業安全衛生管理系統（TOSHMS）之主要目的？","options":["強化組織自主管理","持續改善安全衛生管理績效","面低職業災害","維護環境生態。"]},{"id":640,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"有關臺灣職業安全衛生管理系統指引中之「危害」定義，係指下列何者？","options":["危及公共安全的潛在原因","可能造成財務損失的原因","對人體的健康造成傷害或損害的潛在因素","危險性及有害性的簡稱。"]},{"id":641,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者非臺灣職業安全衛生管理系統指引所強調之主要項目？","options":["員工參與","承攬管理","環境影響評估","採購管理。"]},{"id":642,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"有關臺灣職業安全衛生管理系統指引中之變更管理，下列何者為非？","options":["事前應實施風險評估","與變更有關人員均須被告知或訓練","僅限設備或材料等硬體變更事項，才需實施變更管理","與變更有關文件均須被檢討修正。"]},{"id":643,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"公司如已設有勞安室及職業安全衛生人員，在臺灣職業安全衛生管理系統指引中，可對應下列何者？","options":["能力與訓練","組織設計","管理審查","控制措施。"]},{"id":644,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"下列何者是職業安全衛生管理系統中，安全衛生政策之制定原則？","options":["符合法令之基本門櫃","遵守法令為基本目標，應持續改善職業安全衛生管理系統績效","由管理階寫自行訂定對外宣示","符合 ISO 國際標準。"]},{"id":645,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"職業安全衛生管理系統之主要架構運作，職業安全衛生活動的最高指導原則為下列何者？","options":["職業安全衛生方條","職業安全衛生計畫","職業安全衛生政策","職業安全衛生指針。"]},{"id":646,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列何者為臺灣職業安全衛生管理系統之簡稱？","options":["OHSAS18001","VPP","TS","TOSHMS。"]},{"id":647,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"為執行職業安全衛生管理系統的績效監督與量測，被動指樞通常會僱用下列何者？","options":["教育訓練人數","安全衛生提條件數","職業傷病統計資料","機械設備數量。"]},{"id":648,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"依據職業安全衛生政策，訂定事業單位之安全衛生目標，下列何者為主動目標？","options":["職業災害頻率在 0.1 以下","交通事故為零","安全衛生教育訓練250 人次以上","無失能職業災害。"]},{"id":649,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"依臺灣職業安全衛生管理系統指引之規定，採取矯正措施的目的為下列何者？","options":["預防事故再度發生","處罰相關失職人員","報告上級長官","避免品質差異太大。"]},{"id":650,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"下列何者屬於製程變更管理範圍？","options":["製程技術修改","健康檢查","組織調整","薪資結構變動。"]},{"id":651,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"有關臺灣職業安全衛生管理系統指引之主要架構及依據，除了 OHSAS18001 之外，尚包括下列何者？","options":["ILO-OSH2001","ISO9001","ISO18002","ISO14000。"]},{"id":652,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"高風險事業單位已實施職業安全衛生管理系統，其所設置之職業安全衛生管理單位如何才得以免除一級專責的限制？","options":["安全評估報告送檢查機構審查","管理績效報經中央主管機關認可","向當地主管機關申請即可","獲得國家工安犛者。"]},{"id":653,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"高風險事業單位已實施職業安全衛生管理系統，且管理績效良好經中央主管機關認可者，其所設置之職業安全衛生管理單位得以免除下列何種限制？","options":["管理單位","一級單位","專責單位","第一緣單位。"]},{"id":654,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"於完成每一年度之職業安全衛生管理計畫後，應再依據計畫內容，制定詳細之？","options":["監督計畫","執行計畫","修正計畫","檢討計畫。"]},{"id":655,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"職業安全衛生管理計畫訂定完成後，對於中小事業單位無安全衛生委員會者，則可由何者擬定職業安全衛生管理計畫後，送請雇主核定後實施？","options":["經理","安全衛生業務主管","外務人員","人事主任。"]},{"id":656,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"職業安全衛生管理計畫是？","options":["階段性的","季節性的","年度性的","連續性的。"]},{"id":657,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"事業單位年度職業安全衛生管理計畫，職業安全衛生管理單位應彙整報請何者核定後確實實施？","options":["勞動部","勞動檢查機構","業務主管","事業單位負責人。"]},{"id":658,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"下列何者為職業安全衛生管理計畫之經常性工作項目？","options":["申請自護制度計畫","職業安全衛生教育訓練計畫","推行並通過OSHAS18000 之認證","計畫危險性工作場所審查申請計畫。"]},{"id":659,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者為職業安全衛生管理計畫之非經常性工作項目？","options":["防護具使用、管理及採購計畫","局限空間作業災害防止計畫","設備本質安全改善及作業程更新計畫","安全衛生稽核計畫。"]},{"id":660,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"依法規定，事業單位之職業安全衛生管理應由何人員執行之責？","options":["職業安全衛生管理單位","職業安全衛生委員會","各部門主管","職業安全衛生管理人員。"]},{"id":661,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"事業單位安全衛生管理政策由調制定？","options":["雇主","各部門主管","職業安全衛生業務主管","職業安全衛生管理員。"]},{"id":662,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"一般而言，變更管理計畫通常不包括下列何種變更？","options":["組織架構","作業條件","作業方法","原物料。"]},{"id":663,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"事業單位建置職業安全衛生管理系統之流程中，下列何者非系統架構建置期之工作？","options":["先期審查","風險評估","目標與方條","緊急應變演締。"]},{"id":664,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"下列何者是職業安全衛生管理系統之主動式評鑑資料？","options":["安全衛生稽核","虛驚事故","附近居民抗議","主管機關的糾正。"]},{"id":665,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"下列有關臺灣職業安全衛生管理系統驗證的敘述，何者正確？","options":["為自願性驗證","通過驗證即可免接受勞動檢查","高風險事業單位須優先通過驗證","申請驗證須向勞動部繳費。"]},{"id":666,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列何者非職業安全衛生管理系統？","options":["TOSHMS","CNS45001","ILOOSH","ISO14001。"]},{"id":667,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"有關事業單位推動職業安全衛生管理系統可能帶來的好處，下列何者有誤？","options":["面低工作場所意外事故","減少客戶對產品品質的抱怨","減少不必要之災害善後支出","避免事故造成經營中擷。"]},{"id":668,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"有關臺灣職業安全衛生管理系統指引，下列敘述何者錯誤？","options":["為重黏式的管理","系統化的管理制度","採預防職災的理念","目的在強化自主管理，持續改善安全衛生績效。"]},{"id":669,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"事業單位如欲申請臺灣職業安全衛生管理系統之驗證，可向下列何者申請？","options":["當地主管機關","經濟部工業局","當地勞動檢查機構","驗證機構。"]},{"id":670,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"事業單位建置及推動職業安全衛生管理系統，必須先獲得內部調的支持與承諾？","options":["現場領琉","業務主管","雇主或高階主管","安全衛生管理人員。"]},{"id":671,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"依臺灣職業安全衛生管理系統指引所定，改善措施涵蓋內容包括持續改善及下列何者？","options":["預防與矯正措施","先期審查","風險評估","文件化。"]},{"id":672,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"對於「稽核」之敘述，下列何者正確？","options":["組織無需建立定期稽核程式","僅部分書面文件","稽核範圍包含系統各要素之評估","在系統建置流程中屬於準備期的工作範圍。"]},{"id":673,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"系統架構建置期，主要完成哦些項目？","options":["招開啟始會議、安全衛生風險評估","先期審查、 系統運作及記錄","法規鑑別查核、安全衛生風險評估","政策目標及方條、系統運作及記錄。"]},{"id":674,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"製作安全衛生教育訓練計畫，依各項安全衛生指樞，分析是否符合安全衛生方針政策等既定目標，再決定何部門需哦種教育訓練，這種教育訓練需求分析是屬下列何者？","options":["組織寫級的分析","工作寫級的分析","個人階段的分析","機械設備寫級的分析。"]},{"id":675,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"事業單位每個寫級均應負安全衛生事項之執行責任，下列敘述何者錯誤？","options":["職業安全衛生業務主管綜理職業安全衛生管理之責","各級主管就期各部門內執行與其有關之職業安全衛生事項","領琉督導所屬勞工注意安全衛生","現場勞工遵守職業安全衛生有關規定。"]},{"id":676,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者為零災害運動四階段演締之第四階段？","options":["找出危害要素","提高注意力","設定行動目標","腦力激盪。"]},{"id":677,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"零災害運動的3 大原則，通常不包括下列何者？","options":["要求完美","以零為目標","先知先制","全員參加"]},{"id":678,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"變更管理之所謂變更，通常不包括下列何者？","options":["商樞變更","製程變更","材料變更","設備變更。"]},{"id":679,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"臺灣職業安全衛生管理系統涵蓋下列何種項目？","options":["環境影響評估","採購管理","6 個標準差","幡水處理。"]},{"id":680,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"依變更管理技術指引之要求，變更管理之作業流程中，下列何者應最先執行？","options":["界定變更管制範圍","變更之申請","諮詢","成效確認。"]},{"id":681,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"有關OHSAS18001 與TOSHMS 的差異比較，下列何者正確？","options":["OHSAS18001 已包含 TOSHMS 之所有規定","兩者均非ISO 國際標準","兩者均向勞動部申請驗證","兩者之驗證內容完全一致。"]},{"id":682,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"針對職業安全衛生管理系統稽核所發現不符合事項，應採取何種措施？","options":["控制措施","防護措施","鑑別措施","矯正措施。"]},{"id":683,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"依臺灣職業安全衛生管理系統（TOSHMS）驗證指導要黏之定義，執行稽核及驗證之機構，稱為下列何者？","options":["認證機構","驗證管理機構","認可驗證機構","認可稽核機構。"]},{"id":684,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者非屬中央主管機關發布之職業安全衛生管理系統（TOSHMS）相關文件？","options":["TOSHMS 指引","TOSHMS 驗證規範","安全衛生輔導手冊","TOSHMS 指導綱領。"]},{"id":685,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"有關事業單位申請職業安全衛生管理系統驗證之動機或目的，下列何者有誤？","options":["希望透過第三者的稽核，瞭解是否符合系統要求","客戶在貿易上的要求","須向勞動檢查機構報備","提升安全衛生管理水準。"]},{"id":686,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者不屬於職業安全衛生管理規章中之「政策與組織」規定？","options":["安全衛生政策及目標","安全衛生權責劃分標準","安全衛生績效競賺實施要黏","職業安全衛生委員會組織規程。"]},{"id":687,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"有關臺灣職業安全衛生管理系統指引中之敘述，下列何者有誤？","options":["事前應實施風險評估","與變更有關人員均須被告知或訓練","僅浮及設備或材料等硬體變更事項，未必須再實施風險評估","與變更有關文件均須被檢討修正。"]},{"id":688,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列有關「台灣職業安全衛生管理系統」之敘述，何者錯誤？","options":["雇主係指任何發工資的人員","員工係指定期或臨時為雇主工作而獲得工資的人員","因作業組織和心理等因素的作用而對健康產生的負革影響屬「與工作有關的傷病和不健康」","風險係指危害事故對人員造成傷害或危害健康之嚴重度。"]},{"id":689,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"安全衛生管理系統內部稽核之執行，在決定系統是否？","options":["符合安全衛生管理所規劃之安排事項","已經適當的實施與維持","有效達到組織之政策與目標","以上皆是。"]},{"id":690,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"雇主應依組織的規槽及性質，並諮詢員工及其代表意見，訂定書面的職業安全衛生政策，並應傳達給？","options":["員工","承攬商","利害相關者","以上皆是。"]},{"id":691,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"組織對現有安全衛生管理系統及相關作法進行先期審查，下列何者有誤？","options":["審查結果予以文件化","先期審查工作由部門主管進行","分析員工健康監控資料","辨譜、預測和評估作業環境的危害及風險。"]},{"id":692,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"自動檢查發現之危害狀況必須予以控制，其控制對策優先順序為？","options":["a.安全裝置b.本質安全 c.警告裝置d.安全標準與教育訓練","a.警告裝置b.本質安全 c.警告裝置d.安全標準與教育訓練","a.安全標準與教育訓練b.本質安全 c.安全裝置d.警告裝置","a.本質安全 b.安全裝置c.警告裝置d.安全標準與教育訓練。"]},{"id":693,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"有關OHSAS18001 轉換成 ISO45001 的時間？","options":["2018 年 3 月 11 日","2018 年 3 月 12 日","2017 年 3 月 11 日","2017 年 3 月 12 日。"]},{"id":694,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"為達到零災害目標，在訂定職業安全衛生管理計畫時，可運用下列何項循環機制？","options":["訂定→執行→檢討→修正","執行→檢討→修正→訂定","訂定→檢討→執行→修正","訂定→修正→執行→檢討。"]},{"id":695,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"依職業安全衛生管理辦法規定，事業單位勞工人數幾人以上應訂定「管理規章」？","options":["30 人","50 人","100 人","300 人。"]},{"id":696,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"實施安全衛生檢查以後，必須採取下列哦一項措施能達到防止職業災害，保障勞工安全與健康之目的？","options":["提出檢查報告","聘請專家指導","召開研討會","務實確實改善。"]},{"id":697,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"在零災害預知危害活動中，下列何者列為優先步驟？","options":["找出潛在危害因","找出危險關錨","樹立改善對策","決定行動目標。"]},{"id":698,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"下列何者不是一個適當危害預防行政管理方法？","options":["縮短勞工暴露時間","輦換勞工之工作","教導勞工正確使用防護具","提供勞工危險津貼。"]},{"id":699,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"下列何者較不屬於檢討上年度職業安全衛生管理計畫的目的？","options":["了解那些工作要繼續進行","要增加那些新工作","修訂下年度有機溶劑依法應實施作業環境測定的頻率","所完成之工作獲得甚鳳效果。"]},{"id":700,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"企業內部安全衛生管理工作的最高指導原則是指？","options":["安全衛生政策","安全衛生訂劃","安全衛生管理","安全衛生目標。"]},{"id":701,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"事業單位能否建立安全衛生自主管理機制與經營者理念有絕對關係，作為一個經營者應有安全衛生理念不包含？","options":["尊重生命的理念","面低公司生產成本","磅信事故可以防止的理念","堅定安全政策與決心。"]},{"id":702,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":4,"question":"安全衛生政策擬訂原則隸簡扼要，管理寫落實決心並公告週知，其公告益處有？","options":["說明公司願意遵守配合執行政府制定安全衛生法令規定","安全衛生問題是公司最重視問題之一","公司與員工有同暱相等責任防止安全衛生事故發生","以上皆是。"]},{"id":703,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":3,"question":"職業安全衛生管理系統中磅立目標，其初級目標不包含？","options":["訂定安全衛生政策","建構安全衛生組織系統","稽核評量制度","指定人員發展控制系統。"]},{"id":704,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":1,"question":"ISO 45001 第4 章是組織前後環節，請問4.1 節是關於什麼議題？","options":["外部與內部議題","規劃","職業安全衛生管理系統範圍","利害相關者。"]},{"id":705,"section":"營造業管理制度｜營造業職業安全衛生管理系統","answer":2,"question":"請問ISO 45001 第5 章是關於什麼議題？","options":["領導者","領導及工作者參與","工作者","利害相關者。"]},{"id":706,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列有關實施風險評估之步驟，下列何者為非？","options":["辨譜危害及後果","評估危害之風險","績效審查","決定控制設施。"]},{"id":707,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"風險控制的程序包含？","options":["危害辨識","不定時審查控制程序","使用適當控制措施","以上皆是。"]},{"id":708,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列有關危害辨識之敘述何者正確？","options":["無須參考作業環境監測之結果","事業單位應依職業安全衛生法規要求，選擇適合方法執行危害辨識","應指定勞工單獨限時完成","以往事故已經發生過者無須再辨譜。"]},{"id":709,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列何者無法幫助我俺實施危害辨識？","options":["員工討誰及意外事故調查","工作安全分析單","工商普查","安全資料表。"]},{"id":710,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"危害辨識係指下列何者？","options":["辨譜工作場所的潛在危害","考量危害後果的嚴重度與發生的可能性","評估其風險等級","採取面低風險的控制設施。"]},{"id":711,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列那項非面低風險的控制措施？","options":["教育訓練","個人防護具","工作許可","危害辨識。"]},{"id":712,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下迦何者是消除或面低作業時所可能革對的危險源的有效方法？","options":["儘量不讓勞工從事高處危險性工作","設置適當的防護設施及設備","提供適當防護裝備","以上皆是。"]},{"id":713,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"安全作業標準的功能包含下列何者？","options":["確定工作場所所需的設備或器具","作為安全教導的參考","作為安全觀察的參考","以上皆是。"]},{"id":714,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"製作安全作業標準時，下列何者為香要步驟？","options":["確認實際工作步驟","不安全因素","可能造成之傷害","事故處理之方法。"]},{"id":715,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列何者非實施安全作業標準之功用？","options":["健康管理訂劃可以此資料為基礎預作規劃","藐以改善勞工不安全行為及施工設備、現場作業環境","可明磅規定工作人員職掌， 以強化管理能力","可使工作更具效率，人員、環境、設備更具安全性。"]},{"id":716,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"有關安全作業標準之功能，下列敘述何者正確？","options":["防箱工作場所職業災害發生","作為安全教導的參考","增進工作人員的參與感","以上均正確。"]},{"id":717,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"安全作業標準係經由下列何種方式建立的作業方法與步驟？","options":["工作安全分析","安全工法","作業步驟","以上皆是。"]},{"id":718,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"進一步參酌安全衛生法令規定，將安全措施部分結合至每一作業步驟，並加入發生事故時之處理方式，是指下列何者？","options":["安全作業標準","安全衛生工作守則","工作安全分析","安全衛生管理計畫。"]},{"id":719,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列何者非安全作業標準修訂的時機？","options":["風險評估有不可忍受風險時","違反安全作業標準規定時","事故發生時","製程改變時。"]},{"id":720,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"安全作業標準之製作程序，不包括下列何者？","options":["確認實際工作步驟","規劃事故之處理","實施自動檢查","辨譜不安全因素。"]},{"id":721,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"事業單位發生職業災害時，以下列何者為較好之事故調查參考？","options":["緊急應變計畫","安全作業標準","教育訓練紀錄","自動檢查表。"]},{"id":722,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"實務上施工架組配工作安全分析時，下列何種人員得不參與會議討誰？","options":["工地負責人","職業安全衛生人員","作業主管","會訂。"]},{"id":723,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"工作安全分析的分析者通常為調？","options":["事業經營負責人","廠長","急救人員","領琉。"]},{"id":724,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"工作安全分析的初核者為何人？","options":["事業負責人","職業安全衛生人員","廠長","領琉。"]},{"id":725,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列何者最適合為工作安全分析的批凋者？","options":["事業經營負責人","廠長","職業安全衛生人員","領琉。"]},{"id":726,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列何者文件係由相關主管經其專業及常譜，加上腦力激盪所制定？","options":["安全衛生工作守則","安全作業標準","安全衛生管理計畫","工作安全分析。"]},{"id":727,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"訂定工作安全分析，應由下列何者人員共同召開會議方式為之","options":["工作場所負責人","職業安全衛生管理人員","作業主管","以上皆是。"]},{"id":728,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"所有作業中的危害，在整個工作安全分析過程中，皆已詳細規劃、紀錄，並分別採取適當的工作方法和程序，以防止危害發生，是下列哦項工作安全分析的目的？","options":["作為員工在職訓練的方法","磅立工作安全所需的資桃條件","作為安全觀察的參照","發現及杜絕工作危害。"]},{"id":729,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列何者為工作安全分析的功能？","options":["作為採購品質的參考","作為安全教導的參考","作為員工升遭的參考","作為健康管理的參考。"]},{"id":730,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列何者非屬工作安全分析的目的？","options":["發現並杜絕工作危害","磅立工作安全所需工具與設備","廬罰犯錯的員工","作為員工在職訓練的參考。"]},{"id":731,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"在工作安全分析中，應考慮的不安全主體為下列何者？","options":["材料","機械","環境","人。"]},{"id":732,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列何項不列入工作安全分析考慮項目？","options":["人","環境","產品品質","材料。"]},{"id":733,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列何項通常非為工作安全分析表內應有之項目？","options":["工作步驟","成本分析","潛在危險","安全工作方法。"]},{"id":734,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"工作安全分析程序下列敘述何者為非？","options":["分析已知的風險及危害","工作分成主要步驟","分析潛在的風險及危害","決定安全的工作方法。"]},{"id":735,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列何者非屬工作安全分析中「潛在的危險」？","options":["不安全設備","不安全環境","不安全行為","天災。"]},{"id":736,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"經由工作安全分析建立正確工作程序以消除工作時的不安全行為、設備與環境，確保工作安全的標準，稱為下列何者？","options":["安全作業標準","安全觀察","工作安全分析","風險管理。"]},{"id":737,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列何者為「工作分析」與「預知危險」的結合，是一種簡單定性的風險管理方法？","options":["工作風險分析","風險評估","安全觀察","工作安全分析。"]},{"id":738,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列營造工程施工風險對策，何者應優先實施？","options":["訂定安全作業標準","假設工程及安全設施","設計安全工法","落實個人防護具使用。"]},{"id":739,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"工作場所風險安全評估的第一步驟？","options":["組織建立","風險控制決策","釐訂管理計畫","危害辨識。"]},{"id":740,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"假設安全作業標準表須包含五要素：a.安全措施；b.工作方法；c.事故處理；d.工作步驟；e.不安全因素，製作此表時應按下列何種順序說明探討此五要素？","options":["daecb","dbeac","debca","deabc。"]},{"id":741,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"將工作方法或程序分解為各細項或步驟，以了解可能具有之危害，並訂出安全作業的需求，係指下列何者？","options":["自動檢查","安全觀察","損失控制","工作安全分析。"]},{"id":742,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"施工安全作業標準擬定前，須實施工作安全分析，再訂定安全作業標準，下列何者非工作分析要件？","options":["確定工作內容","確定工作費用","確定工作人員","確定工作方法。"]},{"id":743,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"作業拆解包含？","options":["分項作業（作業名稱）","作業程序（工作步驟）","作業方法（工作方法）","以上皆是。"]},{"id":744,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"預知危險四階段包括：1R.掌握現狀2R.追究真相3R.樹立對策及？","options":["4R 追究責任","4R 探討損失","4R 風險管理","4R 設定目標。"]},{"id":745,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列何者非工作安全分析優先選擇的項目？","options":["低風險性工作","傷害頻率高的工作","傷害嚴重率高的工作","新工作。"]},{"id":746,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"工作安全分析要辨譜作業中潛在的危害，下列何者非危害的根源？","options":["人員","方法","訓練","材料。"]},{"id":747,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"主管人員藐觀察屬下工作步驟，分析作業實況，以發掘作業場所潛在的危險及可能的危害，經協商、討誰、修正而建立安全的工作方法，稱為下列何者？","options":["安全作業標準","安全觀察","風險管理","工作安全分析。"]},{"id":748,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列何項紀錄較無法協助事業單位了解現場危害因素？","options":["自動檢查紀錄","工作安全分析單","教育訓練實施紀錄","安全觀察紀錄表。"]},{"id":749,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列工作安全分析中何者鍽最後一個程序？","options":["尋求避免危害及可能發生事故的方法","決定要分析的工作","找出危害及可能發生的事故","將工作分解成若干步驟。"]},{"id":750,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列何者非製作工作安全分析程序之要項？","options":["辨譜出潛在的危害","製作安全衛生作業標準","決定安全的工作方法","將工作步驟分解。"]},{"id":751,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列有關營造工程施工風險評估方法選擇之敘述，何者錯誤？","options":["應依據工程褐雜度選擇適當之評估方法","應依據作業特性，選擇適當之評估方法","以能清楚分析作業情境，發掘潛在危害及其發生可能性、評估嚴重度之方法","應一律採用風險砰陣進行評量。"]},{"id":752,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列有關風險評估之敘述，何者正確？","options":["風險評估係指辨譜、分析及評量風險之過程","風險評估為職業安全衛生管理系統認證單位稽核之工具","一律以機率及損失值估訂風險規槽，以具體量化風險評估","風險評估係指依據歷年職災實錄辨譜出該工程主要危害韻型之過程。"]},{"id":753,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"運用風險砰陣方式評估者，風險可能性之評量方式，下列何者正確？","options":["可能性低：0， 有可能：2，極有可能：3","偶發性作業：3，持續性作業：2，搶修作業：1","經常性作業：3，緊急應變作業：2，維修作業：1","極有可能：3，有可能：2，可能性低：1。"]},{"id":754,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列何者非屬營造作業環境危害辨識之有效方法？","options":["作業場所巡視","檢查虛驚事故與員工健康檢查紀錄","緊急應變措施","查詢安全資料表。"]},{"id":755,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"施工構臺之構築及拆除應建立按什麼施作之查驗機制？","options":["作業主管","工地主任","施工圖說","工人。"]},{"id":756,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"依營造安全衛生設施標準規定，高度3公尺以上構臺之覆工板等板料間隙應在多少公分以下？","options":["2公分","3公分","4公分","5公分。"]},{"id":757,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"A 營造公司將施工架之搭設交由 B 公司承攬，並將施工架提供給承攬人 C 公司使用， 下列敘述何者錯誤？","options":["該施工架應由 A 公司負責實施自動檢查","公司如有實施自動檢查之能力，A 公司得以書面約定由 C 公司辦理","C 公司勞工將護欄違法拆除已有數日，C 公司應對此事負責與A 公司無關","A 公司應告知B 公司有關施工架搭設之相關危害事項。"]},{"id":758,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"風險是危害事件發生的可能性與嚴重性兩者之？","options":["和","差","亳積","除。"]},{"id":759,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"工作場所安全衛生風險評估的第一個步驟是？","options":["尋找危害源","危害辨識","災害分析","災害評估。"]},{"id":760,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"丁類危險性工作場所申請審查檢附之資料，不包括下列何者？","options":["職業安全衛生工作守則","初步危害分析表","施工災害初步分析表","特有災害評估表。"]},{"id":761,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"丁類危險性工作場所之營造工地，事業單位應於事前組成評估小組實施評估，下列何者為非？","options":["工作場所負責人","施工安全評估人員","專任工程人員","工務小姐。"]},{"id":762,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列有關丁類危險性工作場所施工安全評估，應經執業技師簽章之敘述，何者錯誤？","options":["槽板支撐計算書及施工圖之審查簽章可由結構技師辦理","地質調查報告知寬核簽章可由大地技師辦理","施工架組配之工圖之寬核簽章可由土木技師辦理","工業安全技師得辦理檔土支撐計算書及施工圖之寬核簽章。"]},{"id":763,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列何者係在施工計畫構想初期儘早辨譜危害，就施工環境、方法、機具、材料、人員等可能之危害事項及其風險予以檢討完整性、正確性、安全性？","options":["檢核表","初步危害分析法","施工災害初步分析法","特有災害評估"]},{"id":764,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"對危害發生之機率與危害所造成損失進行評估與判擷，最後評估危害發生造成之損失、範圍及發生機率，並提出因應對策，藐以修正作業計畫，稱之為？","options":["計畫評估","風險等倘","風險評估","安全評估。"]},{"id":765,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列何者不是危害辨識分韻基本的元索之一？","options":["工作設備的使用","工程施工方法","施工程序變更","勞工的索質。"]},{"id":766,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"雇主使勞工於營造工程工作場所作業前，應指派所僱之職業安全衛生人員或何者實施危害調查、評估，並採適當防護設施，以防止職業災害之發生？","options":["雇主","品管人員","工程人員","專任工程人員。"]},{"id":767,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"事業單位，對不可接受風險，擬定對策，是否應指定人員於期限內完成？","options":["須指定","不須指定","擬定對策即可","以上皆是。"]},{"id":768,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"第一階作業-將組成分項工程之內容逐項拆解列出如將「地下室及基礎工程」拆解，以下何者為非？","options":["基槨工程","筏式基礎工程","防護具","開挖及支撐工程。"]},{"id":769,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"依勞動部風險評估指引，所使用的風險評估表單，適用於勞工人數29 人以下之事業單位所需表單是？","options":["基本版","標準版","系統版","完整版。"]},{"id":770,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"依勞動部風險評估指引，所使用的風險評估表單，適用於勞工人數30~299 之事業單位所需表單是？","options":["基本版","標準版","系統版","完整版。"]},{"id":771,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"依勞動部風險評估指引，所使用的風險評估表單，適用於勞工人數300 人以上之事業單位所需表單是？","options":["基本版","標準版","系統版","完整版。"]},{"id":772,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"風險等級中無須採取行動，無須保存任何文件紀錄屬？","options":["微不足道的風險","可忍受的風險","中等程度風","顯著的風險。"]},{"id":773,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"風險等級中在危害風險面低前，不得使勞工進行工作，必須花費相當成本在預防措施上，以面低其風險，茂浮及進行中之工程，其危害必須在更短的時間內予以改善屬？","options":["微不足道的風險","可忍受的風險","中等程度風","顯著的風險。"]},{"id":774,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"評估危害發生之機率及其所造成損失之程度為？","options":["特殊評估方法","定性評估方法","定量評估方法","簡易評估方法。"]},{"id":775,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"工程設計方條評選，依工程特性設定各項目權重配分，安全之權重建議不低於？","options":["5%","8%","10%","15%。"]},{"id":776,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"依勞動部風險評估指引，風險評估之等級可分幾級？","options":["4 級","5 級","6 級","7 級。"]},{"id":777,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"依勞動部風險評估分級，造成一人以上死亡之嚴重度屬於何種等級？","options":["重大","高度","中度","輕度。"]},{"id":778,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"依勞動部風險評估分級，預期危害事件每年發生一次以上之可能性屬於何種等級？","options":["極可能","較有可能","有可能","不太可能。"]},{"id":779,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"事業單位執行或檢討風險評估時，應有何人參加？","options":["當地勞檢機構","工會","潟悉該作業的員工參與","安全衛生協會。"]},{"id":780,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"對於不可接受風險項目應依優先順序，採取有效面低風險的控制措施，香要考量為何？","options":["消除、取代","工程控制","管理控制","個人防護具。"]},{"id":781,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"將主要作業項目之危害程度先作初步評估，以進一步採取細部評估的方法為？","options":["初步危害分析","檢核表分析","危害及可操作性分析","故障樹分析。"]},{"id":782,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"風險砰陣是否可採取動態的設計，經由槽組系統化後對於績效量測之結果，可及時回饓並更新風險砰陣的風險等級？","options":["不可以","應於現場實際評估","可以","應於總公司內評估。"]},{"id":783,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"工作安全分析應注意事項，不包括下列何者？","options":["圍籬綠化程度","人及方法方革","材料及環境方革","機械方革。"]},{"id":784,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"FTA 為下列何種評估方法之縮寫？","options":["危害及可操作性分析","失誤模式與影響分析","初步危害分析","故障樹分析。"]},{"id":785,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"FMEA 為下列何種評估法之縮寫？","options":["初步危害分析","失誤模式與影響分析","故障樹分析","危害及可操作性分析。"]},{"id":786,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列有關危險性工作場所施工安全評估成果運用之敘述，何者正確？","options":["依據評估成果修正，補充施工計畫書內容，送經勞動檢查機構查通過後，通知工地進行危險場所部分工程","施工安全評估報告書，送請監造單位核轉主辦機關審查後施工","施工安全評估報告書，提送監造單位審查轉送勞動檢查機構備查，據以施工","評估報告分別送請專任工程人員、作業主管、工地主任等審查簽署，送請勞動檢查機構審查，同時通知協力廠商進場施工。"]},{"id":787,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列有關風險管理之敘述，何者錯誤？","options":["主辦機關辦理工程採購應合理設定工程功能需求及工期","機具設備設計製造以產能為導向，操作安全應由使用者依各自之工作內容進行風險評估，與製造者無關","施工規劃階段應實施風險評估","辦理工程設計採購，應要求設計階段實施風險評估。"]},{"id":788,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"甲公司將所承攬之大模新建工程中帷幕吊裝工程交由乙公司承攬，下列有關風險評估之敘述，何者正確？","options":["帷幕牆吊裝作業計畫由甲公司擬定，交由乙公司進行風險評估後，交遽甲公司執行","乙公司研擬帷幕吊裝工程作業計畫，提送甲公司召集乙公司及相關人員進行風險評估，依評估結果研擬對策後，交遽乙公司修正補充再提報甲公司核可後，依通知進場作業","乙公司訂定帷幕牆吊裝作業計畫後提送甲公司併同整體工程實施風險評估，乙公司無需參與","乙公司研擬帷幕吊裝分項作業計畫並實施風險評估後提送甲公司備查，依通知進場施工並負責管理該項工作施工安全。"]},{"id":789,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列有關風險評估成果追蹤管制措施之敘述，何者錯誤？","options":["列入工地協議組織會議中列管追蹤","公司管理審查會議檢討實施成效","列入自主檢查缺失統計","應由相關部門主管追蹤對策處置人員辦理情形。"]},{"id":790,"section":"營造業管理制度｜施工風險評估","answer":4,"question":"下列有關營造風險特性敘述，何者錯誤？","options":["營造工程內容常有高寫建築、高架橋梁、 地下深開挖、長隧道等艱困之任務，潛存之本質危害極高","營造業多採分包經營，承攬商管理及協調具相當不確定之風險","營造工地多位於山區、水辭或不平整地形等惡劣之環境，多數作業需於戶外露天進行，作業場所之危害度極高","現代營建機具多採自動化設計，操作安全性高，使用者依操作手冊作業即可確保安全。"]},{"id":791,"section":"營造業管理制度｜施工風險評估","answer":2,"question":"下列有關施工機具評估之敘述，何者錯誤？","options":["施工機械設備之作業方式必須符合法令規定安全需求","機械設備尺寸無關乎操作性能，無需特別予以規範","評估施工機械所完成之工作品質必須符合規範需求","依據施工機械設備之規格、性能評估其功率是否能滿足工程預定進度所需。"]},{"id":792,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列有關工程風險評估之敘述，何者錯誤？","options":["工程主辦機關於工程規劃階段應實施風險評估","丁類危險性場所應實施施工安全評估","工程設計階段應實施風險評估","施工規劃階段應實施風險評估。"]},{"id":793,"section":"營造業管理制度｜施工風險評估","answer":1,"question":"下列有關營造業職業安全衛生管理績效評估之敘述，何者正確？","options":["應建立績效監督與量測程序辦理","應由法定之安全衛生人員專責獨立辦理","應由檢查機構之績效認可單位實施","應由管理代表實施。"]},{"id":794,"section":"營造業管理制度｜施工風險評估","answer":3,"question":"下列有關營造工程特有災害評估之敘述，何者正確？","options":["應依作業拆解結果逐項依勞動檢查法第28 條規定檢核是否具立即危險之虞，以確保安全性","為確保評估之技術可行性，應分別依據工程類型委託各專門職業技師詳予評估並簽證","評估小組就工作內容及作業場所環境狀況槽擬推演，以發掘可能之危害狀況，分析災害要因，檢討現有措施，以評估風險，對不可接受之風險擬定對策修正計畫","由施工安全評估人員專責辦理以確保符合法規並經各承攬商簽名確認，再送請工作場所負責人覆核確認。"]},{"id":795,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"當事人約定，一方於一定或不定之期限內為他方服勞務，他方給付報酬之契約稱為？","options":["承攬者","僱傭者","勞動者","工作者。"]},{"id":796,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"當事人約定，一方為他方完成一定工作，他方俟工作完成，給付報酬之契約，謂之？","options":["僱傭","委任","勞務採購","承攬。"]},{"id":797,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"於一定期間內受僱人應依雇方之指示，從事一定種韻之活動稱為？","options":["承攬契約","口頭約定","勞動契約","工程契約。"]},{"id":798,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"帶工不帶料之承攬合約，以何者為目的？","options":["勞動結果","勞動給付","勞動方式","勞動成本。"]},{"id":799,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"二個或二個以上承攬人基於資金、人力組配等之實際需要，而以約定方式從事承攬一事業稱為？","options":["單獨承攬","平行承攬","共同承攬","垂直承攬。"]},{"id":800,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"業主將一項作業之不同分項工程交付二個以上事業單位承攬稱為？","options":["單獨承攬","平行承攬","共同承攬","垂直承攬。"]},{"id":801,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"承攬契約係以何者為目的？","options":["勞動結果","勞動給付","勞動方式","勞動成本。"]},{"id":802,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"依採購法第65 條第2 項規定，指將原契約中應自行履行之全部或其主要部分，由其他廠商代為履行稱為？","options":["分包","承包","並包","轉包。"]},{"id":803,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"非屬轉包情形，而將契約部分由其他廠商代為履行稱為？","options":["分包","承包","並包","轉包。"]},{"id":804,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，應由何者指定工作場所負責人，擔任統一指揮及協調工作？","options":["承攬人","再承攬人","原事業單位","勞動檢查機構。"]},{"id":805,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，為防止職業災害，原事業單位應採取措施為何？","options":["設置協議組織，並指定工作場所負責人，擔任指揮、監督及協調之工作","工作之連籀及調整","工作場所之巡視","以上皆是。"]},{"id":806,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"下列何者為職業安全衛生法規定原事業單位應盡之義務？","options":["協助承攬人遵守職業安全衛生相關法令","承攬人就承攬部分負雇主責任，原事業單位不應介入承攬人之管理","接受專業承攬人之工作指示作業","協助承攬人通過勞動檢查。"]},{"id":807,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"依職業安全衛生法規定，事業單位與承攬人、再承攬人，僱用勞工共同作業時，應由下列何者指定工作場所負責人，擔任指揮及協調工作？","options":["再承攬人","相互協調1 人","原事業單位","承攬人。"]},{"id":808,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"二個以上之事業單位分別出資共同承攬工程時，應互推幾人為代表人？該代表人視為該工程之事業雇主。","options":["1 人","2 人","3 人","以上皆非。"]},{"id":809,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"原事業單位應設置協議組織，並指定","options":["分包商","工作場所負責人","主管","勞工代表擔任指揮及協調之工作。"]},{"id":810,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"下列何者並不屬於協議組織運作機制之一環？","options":["扣款、罰款","調整薪資","危險作業之管制","停止計價或解約。"]},{"id":811,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"攬廠商之勞工於入場施工前，應要求先接受職業安全衛生教育訓練並參加勞工保險及","options":["體格或健康檢查","自動檢查","重點檢查","材料檢查。"]},{"id":812,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"依職業安全衛生法施行細則規定，協議組織協議事項中危險作業管制，不包括","options":["動火作業","高架作業","開挖作業","活電作業。"]},{"id":813,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"承攬在安全衛生法規之責任包含下列何種？","options":["共同作業時原事業單位應有之作為","職業災害賠償責任","共同承攬工程時，應抽籤推一人為代表人","共同承攬災害之防止由業主承擔。"]},{"id":814,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"事業單位以其事業之全部或一部分交付承攬時，應於事前告知該承攬人有關其","options":["事業工作環境","危害因素","本法及有關安全衛生規定應採取之措施","以上皆是。"]},{"id":815,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"依職業安全衛生法規定，事業單位以其事業之全部或一部份交付承攬時，事前告知之事項未包括下列何者？","options":["其事業工作環境","人員薪資","有關安全衛生規定應採取之措施","危害因素。"]},{"id":816,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"原事業單位對於承攬人之危害告知方式為下列何者？","options":["書面告知或電子文件","口頭告知","現場告知","以上皆是。"]},{"id":817,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，下列何者為防止職業災害，應採取必要措施？","options":["老闈","原事業單位","員工","分包商。"]},{"id":818,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"原事業單位違反本法或有關安全衛生規定，致承攬人所僱勞工發生職業災害時，與承攬人負","options":["補償","賠償","連帶補償","連帶賠償責任。"]},{"id":819,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"下列何種法律未規定承攬作業有關事項？","options":["職業安全衛生法","勞工職業災害保險及保護法","勞工保險條例","勞動基準法。"]},{"id":820,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"有關承攬管理責任，下列敘述何者正確？","options":["原事業單位交付廠商承攬，如不幸發生承攬廠商所僱勞工墜落致死職業災害，原事業單位應與承攬廠商負連帶補償責任","承攬廠商應自負職業災害之賠償責任","勞工投保單位即為職業災害之賠償單位","原事業單位交付承攬，不需負連帶補償責任。"]},{"id":821,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"事業單位與承攬人、再承攬人所僱用之勞工於同一期間、同一工作場所從事工作，稱為","options":["一起作業","協同作業","共同作業","幫同作業。"]},{"id":822,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"下列何者為職業安全衛生法所稱之共同作業？","options":["事業單位未參與施工僅於完工後派員驗收","事業單位於其工作場所內之空地，劃出一部份供承攬人使用且無相互擲","事業單位與承攬人、再承攬人所僱用之勞工於同一時間、同一工作場所從事工作","事業單位與承攬人各自獨立作業，相互間無危害相關聯。"]},{"id":823,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"承攬人使用之機械、設備或器具係由原事業單位提供者，該機械、設備或器具應由調實施定期檢查及重點檢查？","options":["承攬人","再承攬人","雇主","原事業單位。"]},{"id":824,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"承攬人發生職業災害時，可能產生的責任有？","options":["僅有行政責任","僅有刑事責","僅有民事責任","前三者都有可能。"]},{"id":825,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"為提高各承攬人綜合管理實效，應由何人主導實施安全施工循環？","options":["原事業單位","承攬人","再承攬人","以上皆是。"]},{"id":826,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"廠房新建工程、施工架組拆作業交付承攬時，應依職業安全衛生法第26 條及第27 條辦理？","options":["危害告知","協議組織","指定工作場所負責人","以上皆是。"]},{"id":827,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"有關危害告知事項，下列何者正確？","options":["可以口頭方式告知","承攬人就其承攬之全部或一部分交付再承攬時，承攬人無須告知再承攬人","得以承攬人勞工之安全承諾書替代危害告知","須以書面或電子文件或召開協商會議並作成紀錄為之。"]},{"id":828,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"依職業安全衛生法規定，事業單位以其事業交付承攬，並與承攬人、再承攬人之工作者共同作業時，為防止職業災害，原事業單位應採取之必要措施，下列敘述何者錯誤？","options":["工作之連籀及調整","工作場所之巡視","指定承攬工程金額最多之承攬人為工作場所負責人","相關承攬人之安全衛生教育之指導及協助。"]},{"id":829,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"事業單位以其事業之全部或一部分交付承攬，並共同作業，如承攬人現場使用之合梯不符規定時，下列敘述何者錯誤？","options":["原事業單位應給予指導使其符合規定","原事業單位應限制其不凋使用","屬承攬人之設備，原事業單位不能管制","原事業單位對進場之機具應協議管制之機制。"]},{"id":830,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"下列有關營造工地進場管制之敘述，何者正確？","options":["各承攬商應事先提報預定進場人員之名單，詳列姓名、年齡、住址、電話、投保資料、教育訓練資桃等，以便進場時逐一核對確認","吊升荷重在三公噸以上之起重機須進場時檢附合格證，其餘機具經外觀檢視完整者即可進場","承攬商先行提報聘僱工程師名單，經確認符合資桃，該等人員進場時不須再予檢視","承攬商預先提報採用符合 CNS4750 規格之施工架，材料進場時可不需再予以檢查。"]},{"id":831,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"甲公司將所承攬之大模新建工程中基礎工程分包由乙公司承攬，下列敘述何者正確？","options":["乙公司應負責該大模新建工程作業勞工進場管制","乙公司僱用勞工之職業安全衛生教育訓練應由甲公司統一辦理，與乙公司無關","乙公司應訂定結構分項工程作業計畫送甲公司核定施工","甲公司應建立承攬管理制度，於施工過程實施承攬管理。"]},{"id":832,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"甲公司將施工架組立工程交付乙承攬商施工，下列敘述何者正確？","options":["施工架材料由甲提供，乙所指派之施工架組配作業主管無需再檢查","施工架組立工作過程，甲應派員監督查核，乙無需再指派施工架組配作業主管確認安全衛生設施之狀況","甲已於施工規劃階段實施風險評估，乙無需再進行作業前危害調查、評估","乙應於使勞工進場作業前，指派法定專業人員實施危害調查、評估。"]},{"id":833,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"甲公司辦理社區排水改善工程，為工區警衛及交通引導工作需要，擬以勞務承攬方式進用 8 名勞工，採購文件中應載明投標廠商辦理事項為何，方為完整正確？","options":["採購契約箱本、施工綱要規範、安全衛生工作守則","職業安全衛生法規、施工安全衛生規範、 業主契約文件","工作內容、工作場所特性、安全設施及個人防護具設置需求、進場勞工管理事項等","樞單、契約書、僱用證明、勞保名冊。"]},{"id":834,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"甲營造公司承造某集合住宅工程，其水電工程部分發包給以水電工程公司承攬，乙再將泥水工程部分發包給丙土木包工程行承攬，下列甲乙丙三者關係所迦何者錯誤？","options":["甲乙丙均各負及雇主責任","如丙之勞工丁發生職業災害，丁不能向甲或乙請求連帶補償","甲乙丙分別僱用勞工共同作業時應指定工作場所負責人擔任指揮及協調工作","甲應於事前告知乙有關安全衛生規定應採取之措施。"]},{"id":835,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"某工程由甲營造公司承建，甲營造公司再將其中之施工架組配及拆除交由乙公司施作，則甲營造公司就職業安全衛生法而言是何者？","options":["業主","原事業單位","承攬人","再承攬人。"]},{"id":836,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"下列有關營造業能力鑑別之敘述，何者錯誤？","options":["應建立勞工進場管制機制，以確認職業安全衛生教育訓練成效","應針對承攬工程之需要，確認各級承攬商具備足夠之職業安全衛生管理能力","應建立勞工資格鑑別、教育訓練、承攬商評鑑等程序，以確保勞工、承攬商資格能力","應制定各類人員職務說明書，明確訂定各層級人員應辦理事項及所需具備之資格能力。"]},{"id":837,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"依職業安全衛生管理辦法規定，下列何者非屬承攬管理計畫相關執行紀錄應登載之內容？","options":["危險作業管制","職業安全衛生政策","緊急應變及安全衛生績效評估","職業災害通報。"]},{"id":838,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"下列有關進場管制之敘述，何者錯誤？","options":["起重機等危險機械設備，應確認檢查合格證明之效期","鋼構組配廠商指派之作業主管應憑該公司職員證，進入工區作業","進場人員應逐一檢查是否具備合格證件","施工架等安全設施材料應檢附材質證明文件。"]},{"id":839,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"下列有關承攬管理之敘述，何者錯誤？","options":["原事業單位應督導現場作業各級承攬人實施安全衛生設施之設置，使用及維護","原事業單位應督導各工項分包承攬人就使用之機具設備進行必要之檢點，維修保養等作業，以維正常功能","各工項分包承攬人依據原事業單位核可之分項工程作業計畫施工並自主辦理檢查，原事業單位則就非屬承攬範圍實施檢查","原事業單位應依施工進度需要，分別通知相關承攬人進場作業。"]},{"id":840,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"事業單位未將工作場所之危害因素告知承攬人，致承攬人之勞工因而發生災害時，受害勞工可以向原事業單位請求？","options":["職業災害補償","勞工保險給付","民事賠償","國家賠償。"]},{"id":841,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"分包商篩選屬承攬管理中之？","options":["作業前管理","作業中管理","作業後管理","行政管理。"]},{"id":842,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"每日作業前預知危險活動屬承攬管理中之？","options":["作業前管理","作業中管理","作業後管理","行政管理。"]},{"id":843,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"承攬作業完成後之離場管理屬承攬管理中之？","options":["作業前管理","作業中管理","作業後管理","行政管理。"]},{"id":844,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"營造工程危害告知應如何實施？","options":["於交付承攬時，應以書面告知作業內容及工作場所可能存在之危害狀況","由承攬人於作業前實施危害調查後，將所發掘之危害內容，以書面告知原事業單位","於協議組織告知各相關承攬人現場安全設施之潛在危害","於工地巡視時由工地主任告知承攬人所承攬工作項目之潛在危害。"]},{"id":845,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"下列何者為承攬人無法改善必須退場之時機？","options":["發生虛驚事故時","安全衛生缺失訂黏達罰款上限額度時","承攬人層約過程出現重大瑕疵，無法繼續履行契約時","分項工程作業計畫於危險性工作場所審查時未通過。"]},{"id":846,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"下列有關營造工程協議組織運作方式之敘述，何者正確？","options":["原事業單位得篩選參加協議組織之成員","起重吊掛作業應由原事業單位派員指揮，以統一作業方式、順序及安全防護設施，可不需受入協議組織管理","協議組織之運作由原事業單位事需要實施， 無關乎工地運作","施工過程原事業單位應召集各承攬人及相關人員進行協議。"]},{"id":847,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"事業單位以其事業之全部或一部分交付承攬，並與承攬人、再承攬人分別僱用勞工共同作業，如再承攬人之勞工未依規定接受安全衛生教育訓練即進入工作場所作業時， 下列敘述何者不正確？","options":["屬再承攬人之勞工，與原事業單位無關","原事業單位應管制，不凋其進場","再承攬人之雇主違反職業安全衛生法規定","原事業單位應協助再承攬人之勞工符合勞工法令。"]},{"id":848,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"下列敘述中，何者不屬承攬關係之特德？","options":["只負責出工，不負責損益","承攬人具備「雇主之特性」","工作指派不受他人所約束","有獨立營運之自主權。 採購管理"]},{"id":849,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"採購的意義？","options":["所有權的佔有","所有權的移轉","政府採購法","以上皆是。"]},{"id":850,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"使用權的移轉下列何者不正確？","options":["採購廝義的意義","採購狽義的意義","租賃","德收。"]},{"id":851,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"採購管理記錄保存年限？","options":["1 年以上","2 年以上","3 年以上","沒有限制。"]},{"id":852,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"就安全管理而言，有關工程採購作業，下列敘述何者有誤？","options":["請購單位在提出工程採購之前應先確認是否有安全衛生上之需求，並將其受入請購單或契約中","安全衛生費用應量化編列，並受入計價驗收項目","在提出規劃設計需求時，將假設工程安全受入規範，要求設計成果應含安全衛生建議圖說及計價文件，據以受為安全衛生規格","安全衛生為施工廠商應自行注意事項，業主單位無權介入。"]},{"id":853,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"下列有關施工機具採購之敘述，何者錯誤？","options":["隧道開挖機等特殊機具，應於採購規範中註明應辦理試運轉及必要之功能驗證測試，以為驗收之依據","採購契約應自行考量機具組裝、測試之安全防護設施、應使用安全防護具等","得標廠商應自行考量機具設備送抵工地之方式，採購規範中可無需特別予以規定","採購契約中應規定供應商提供機具組裝、測試所需之機具設備及專業人力。"]},{"id":854,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"營造工程安全衛生設施之採購，應如何辦理？","options":["發包交由專業廠商安裝，無浮使用該等設施之承包商管理責任","配合工程進展於作業前設置完妥，施工過程隨時檢視維護，以維持正常功能","於分項工程採購契約中明定各分包承攬商應自行負責工作所需之安全衛生設施，無須原事業單位費心管理","原事業單位購置材料交由臨時點工安裝。"]},{"id":855,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"下列有關營造廠商辦理施工安全設施採購之敘述，何者錯誤？","options":["依據施工法、程序， 僱用安全設施之韻型、數量，分批採購","配合施工進度需要，分批採購符合法規規格之設施","事先估算所需各韻設施數量，依規定開具詳細規格，訂定開口契約，配合工程進度進場安裝","應由各分項工程承攬商採購設置以明權責。"]},{"id":856,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"下列有關工程採購管理實施範圍之敘述，何者錯誤？","options":["工程採購實施前，應確實寬核該樞條之各項圖說、樞單等招樞文件是否詳實編列採購預算","應確實將各工作項目之作業內容、方法、數量等核算明磅，編列合理費用","因應工程需要得定投標廠商資桃要件，將廠商之相關工程經歷、層約紀錄等受入規定","工程採購管理應自招樞受理廠商投樞文件之寬核開始。"]},{"id":857,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"採購管理包含？","options":["採購管理","變更管理","修織管理","以上皆是"]},{"id":858,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"技術、服務、工程發包屬於何種採購？","options":["有形物品","無形物品","契約","以上皆非。"]},{"id":859,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"為促使採購效益發揮更大效益，並能面低企業經營風險，以落實品質管理及安全衛生管理的理念，必需從何做起？","options":["採購過程","採購資訊","所賽產品之查證","以上皆是。"]},{"id":860,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"採購管理制定應研訂？","options":["建立、實施及維持可符合安全衛生管理制度、程序及訂劃","以契約內容要求應有符合安全衛生法規及實際需要之安全衛生具體規範","對於請購、 採購及驗收等相關人員應予必要之安全衛生教育訓練","以上皆是。"]},{"id":861,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"下列何者正確？","options":["事業單位請購前，應先確認並將所需之安全衛生具體規範，作為請購、採購及驗收之依據","對工程之施工、規劃、設計、監造等契約內、宸應有防止職業災害之具體規範，並列為層約要件","有關工程採購條，安全衛生項目所需之費用應有一定的比例，並要求廠商編列","以上皆是。"]},{"id":862,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"機關於工程規劃、設計時，應要求規劃、設計單位將安全衛生經費明細表等作為招樞文件，受入契約執行，下列何者不包括在內？","options":["規劃安全衛生注意事項、圖說","施工安全衛生規範","職業安全衛生法規","逾期罰款。"]},{"id":863,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"採購範圍中，下列何者屬於無形勞務？","options":["委外輔導建置職業安全衛生管理系統","租賃機具及設備","賽買安全鞋","賽買瓦斯。"]},{"id":864,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"採購管理技術指引所迦，事業單位之採購程序應包括下列何者？","options":["請購階段","議僵前或業務承攬之備樞選商","交貨驗收","以上皆是。 變更管理"]},{"id":865,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"下列有關變更風險評估及管理之敘述，何者錯誤？","options":["啟用變更前，應檢查確認評估修正變更計畫之各項因應措施均已完成，可有效控制該等風險","應就變更部分評估其風險","經評估後對不可接受之風險應擬定對策修正變更計畫","因現地情況差異、施工內容及方法之改變、主要機具設備變更、主要安全衛生設施變更等，應即就變更部分變更計畫，送請專任工程人員寬核確定後實施變更部分之施工。"]},{"id":866,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"下列有關變更管理實施方式之敘述，何者錯誤？","options":["變更內容應通知施工人員並經啟用前檢查確認機具設備、設施等均已設置完成，方得施工","擬訂變更計畫後應實施風險評估","應評估變更後可能出現之風險，擬訂適當對策","應將變更後之施工圖、施工計畫等文件發交施工團隊簽收後立即施工。"]},{"id":867,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"人員調動、新的製程及作業程序變更是指？","options":["內部變化","外部變化","管理變化","以上皆非。"]},{"id":868,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"法令修訂、組織合併是指？","options":["內部變化","外部變化","管理變化","以上皆非。"]},{"id":869,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"變更管理的義涵為下列何者？","options":["同型物料替換","永久性變更、暫時性變更","緊急變更","以上皆是。"]},{"id":870,"section":"營造業管理制度｜營造業承攬管理","answer":1,"question":"欲進行更換之設備或其零組件在基本設計、維修及操作上與臏有設備或其零組件一致時，稱之為？","options":["同型物料替換","永久性變更","暫時性變更","緊急變更。"]},{"id":871,"section":"營造業管理制度｜營造業承攬管理","answer":3,"question":"係指針對某特殊狀況需要或實施性能試驗、操作效率試驗等臨時性之變更，此等變更必須清楚界定變更之期間，且於期滿時，須恢復變更前之狀況，是指下列何者？","options":["同型物料替換","永久性變更","暫時性變更","緊急變更。"]},{"id":872,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"指暫時性變更經研討或測試後決定所做之永久性修改，是指下列何者？","options":["同型物料替換","永久性變更","暫時性變更","緊急變更。"]},{"id":873,"section":"營造業管理制度｜營造業承攬管理","answer":4,"question":"為達成組織之要求，製程、活動或服務必須變更以繼續操作者，是指下列何者？","options":["同型物料替換","永久性變更","暫時性變更","緊急變更。"]},{"id":874,"section":"營造業管理制度｜營造業承攬管理","answer":2,"question":"廠商考慮的條件，下列何者不正確？","options":["確保成品之品質和安全生","僵桃越低越好","對勞動人權和職業安全衛生等考慮","對環境保護的考量。"]},{"id":875,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"建築物外牆採預鑄牆版吊裝工法，下列敘述何者錯誤？","options":["作業安全性較現地艓裝高","可縮短現場作業時間","作業品質較現地艓裝良好","吊裝作業較石材貼砌危險性高。"]},{"id":876,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"下列有關建築物增建工程應辦理事項之敘述，何者錯誤？","options":["增建部分高度未超過80 公尺：地下開挖未達18 公尺：槽板支撐高度未達7 公尺，無需實施風險評估","設計單位應實施工程設計階段風險評估","工程承包商應實施施工規劃風險評估","增建之鋼構組配作業前應指派所雇之職業安全衛生人員等專業人員辦理危害調查、評估。"]},{"id":877,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"都會區建築工程因施工用地有限，地下室開挖區經常設置施工構臺，下列敘述何者有誤？","options":["施工構臺支柱應依現場土質埃入適當深度","因施工構臺寬度有限，故於構臺上使用移動式起重機時，外伸撈弱可不需全部伸展","施工構臺上堆置物料，避免集中並不得超過其荷重限制","構臺開口辭編，應設置護欄或可確實鉤掛安全帶之設施。"]},{"id":878,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"某建築工程因地下室滲水，需施作地皺改良，正進行袋裝水泥進場作業，下列敘述何者正確？","options":["水泥堆置高度不得超過12 寫，6 寫以上部分應向內退縮","水泥堆置高度不得超過10 寫，6 寫以上部分應向內退縮","水泥堆置高度超過10 寫者，5 寫以上部分應向內退縮","水泥堆置高度不得超過10 寫，5 寫以上部分應向內退縮。"]},{"id":879,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"帷幕牆安裝防止墜落？","options":["作業員配帶安全帽及安全帶扣上安全母索","工具需有繹子籀於身上以防掉落","工具放置遠離模梯","以上皆是。"]},{"id":880,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"施工電梯要有何種安全設備及措施？","options":["合格證","操作員","安全裝置","以上皆是。"]},{"id":881,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"雇主對於基槨等施工設備，應能充分震，且各部份結合處應做何處理？","options":["去污","鬆脫","安裝牢固","以上皆是。"]},{"id":882,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"帷幕牆安伾工程作業，現場高低差超過幾公尺以上必設置防止墜落措施？","options":["1.0 公尺","2.0 公尺","3.0 公尺","1.5 公尺。"]},{"id":883,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"雇主對於支撐混凝土輸送管之固定架，應設置於？","options":["施工架","鬆動之磚瓦","臨時構造物上","固定結構體上。"]},{"id":884,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"勞工長期從事下列何種作業，可能導致減壓症或潛水夫病？","options":["潛盾施工法之高壓室內作業","游離輻射作業","浚潛作業","低溫作業。"]},{"id":885,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"依據「重體力勞動作業勞工保護措施標準」規定，下列何者不屬於重體力勞動作業？","options":["於管道推進隧道內，進行坑內人力搬運作業","以人力拌合混凝土之作業","以人力將袋裝水泥自室外逐一搬運至室內","於潛盾隧道內，以環片組立機作業。"]},{"id":886,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"雇主對從事重體力勞動作業之勞工，應辦理之事項下列何者為非？","options":["應考慮勞工之體能負荷情形，減少工作時間給予充分休息，休息時間每小時不得少於40分鐘","應依勞工健康保護規則之規定，實施勞工健康檢查及管理","應充分供應飲用水及食鹽，並採取必要措施指導勞工避免重體力勞動之危害","應致力於作業方法之改善、作業頻率之減低、搬運距離之縮短、搬運物體重量之減少及適當搬運速度之調整，並儘量以機械代替人力。"]},{"id":887,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"雇主使勞工從事重體力勞動作業時，應充分供應飲用水及下列何種物質？","options":["食鹽","糖","運動飲料","提神飲料。"]},{"id":888,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"某建築工程於地面寫設置多組配電箭，供各分包商使用，下列敘述何者錯誤？","options":["配電箭設於室內乾燥場所，可不須設置接地線","配電箭應設置多組插座，以供施工人員使用","配電箭應由專業技術人員管理，並上鎖管制","配電箭內所有開關，均應有漏電斷路器裝置。"]},{"id":889,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"於建築物內結構模板，已設置護欄之開口旅，進行天花板裝修作業時，下列敘述何者錯誤？","options":["作業人員於施工架上，應佩戴使用安全帶","作業人員於施工架上時，不可移動施工架","作業人員笆立於合梯頂部作業","開口處增設安全網。"]},{"id":890,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"建築工程進行混凝土潔置作業時，應辦理事項，下列敘述何者錯誤？","options":["為提高品質， 無誰槽板支撐設計載重為何，應採用自充填混凝土","應檢查槽板支撐各部分之連接及斜撐","禁止無關人員進入槽板下方","混凝土潔置作業應指定安全出入路口。"]},{"id":891,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"對於混凝土潔置作業，下列何者非屬營造安全衛生設施標準之規定？","options":["禁止勞工亳坐於混凝土潔置桶上","不得以起重機具或純道吊運混凝土桶","實施混凝土潔置作業，應指定安全出入路口","潔置期間應注意避免過大之捕動。"]},{"id":892,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"下列何者屬於地皺改良工法？","options":["鑽掘槨工法","全奘管槨工法","置換工法","反循環槨工法。"]},{"id":893,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"關於橋梁混凝土作業施工安全注意事項，下列敘述何者正確？","options":["為掌握施工工期，應儘量集中潔置混凝土","如為趕工作業，可於安全評估後免設縱向及橫向水平支撐","為方便作業，槽板及支撐各構件可一起堆置使用","為確保施工場地之承載力，事先予以整平夯實。"]},{"id":894,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"箭型梁懸臂工法下列何者錯誤？","options":["鋼筋吊運由專人指揮，禁止無關人員進入作業範圍","施工平台欄杆為上欄杆(高75 公分以上)中欄等防護措施","臨時用電採取高架措施及裝設漏電斷路器","以上皆非。"]},{"id":895,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"以逐段施作沉箱之壁體後使之下沉，在接續下一節之施工，依序開挖、下沉至預定深度，再將箭體內回填，完成基礎之工法為？","options":["沉箱工程","基槨工程","擋土支撐工程","鋼構工程。"]},{"id":896,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"在營造業工法中，下列何者非為橋梁工程之潛在風險？","options":["倒塌","強風","缺氧","地震。"]},{"id":897,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"在營造業工法中，下列何者非為橋梁工程之施工方法？","options":["吊梁工法","支撐先進工法","預鑄節塊吊裝工法","扶手先行工法。"]},{"id":898,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"在營造業工法中，進行隧道工程中，何者需裝填火藤進行爆砷開挖？","options":["鑽炸法","潛盾機工法","TBM 工法","沉埃隧道工法。"]},{"id":899,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"先於墮柱項端施築柱頭節塊，再於柱頭節塊上安裝懸臂工作車，然後同時向橋墮兩側逐節施作節塊，為何種工法？","options":["場鑄節塊懸臂工法","節塊推進工法","支撐先進工法","場鑄逐跨工法。"]},{"id":900,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"將預力混凝土梁分成若干個節塊，並於橋台後方之預鑄場施作，利用推進系統將節塊往橋中心方向推出，於第一節塊之最前端裝置鼻梁，為何種工法？","options":["場鑄節塊懸臂工法","節塊推進工法","支撐先進工法","場鑄逐跨工法。"]},{"id":901,"section":"營造業管理實務｜工法安全介紹","answer":3,"question":"先於兩起始橋墮處安裝支撐托架，再將支撐鋼架吊放於支撐托架上，並於支撐鋼架上組裝外槽、紮筋(潔置混凝土，混凝土養護後將槽板自混凝土鬆脫，向前推進至下一橋墮墮續施工，為何種工法？","options":["場鑄節塊懸臂工法","節塊推進工法","支撐先進工法","場鑄逐跨工法。"]},{"id":902,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"支撐先進工法之支撐鋼架兩辭之行進速度應相互配合，並確認油壓千斤項之衛程是否需要一致？","options":["不需要","需要","應長短配置","應一高一低。"]},{"id":903,"section":"營造業管理實務｜工法安全介紹","answer":4,"question":"將上部結構先分為大小適當之節塊並於預鑄場製作，再將製作完成之節塊依序逐節吊裝架設並以麋結劑及預力鋼棒將相遷節塊予以緊密結合，為何種工法？","options":["場鑄節塊懸臂工法","節塊推進工法","支撐先進工法","預鑄預力節塊吊裝工法。"]},{"id":904,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"橋梁基礎採基槨時，有關基槨鋼筋加工、儲存、運送等作業，為防止鋼筋滾動滑落， 下列敘述何者錯誤？","options":["鋼筋加工場地應經整平夯實，確認地面承載力","鋼筋載運時， 可採多寫堆置","鋼筋堆放時應設置適當之墊襯及擋槨","鋼筋以吊卡車運送時，應以纜純加以適當綑紮。"]},{"id":905,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"於工址現地組立型鋼為支撐，再於其上進行槽板銷設、鋼筋綁紮(混凝土潔置，俟混凝土養護後，再將支撐架等拆除並移至下一工作面繼續重複作業，為何種工法？","options":["場鑄節塊懸臂工法","場鑄逐跨工法","支撐先進工法","預鑄預力節塊吊裝工法。"]},{"id":906,"section":"營造業管理實務｜工法安全介紹","answer":1,"question":"某橋梁工程之橋墮需施作沉箱開挖作業，下列敘述何者正確？","options":["沉箱刃口至頂版之淨距應在 1.8 公尺以上","沉箱刃口下端不得下挖0.8 公尺以上","沉箱刃口至頂版之淨距應在 2 公尺以上","沉箱刃口下端不得下挖1 公尺以上。"]},{"id":907,"section":"營造業管理實務｜工法安全介紹","answer":2,"question":"橋梁工程於橋墮施工時，有關作業人員上下設備，下列敘述何者錯誤？","options":["上下設備基礎應整平夯實，確認地面承載力","可使用簡易式移動架以保持機動","上下設備設置時，應與橋墮妥實固定與連
